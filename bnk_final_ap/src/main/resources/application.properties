spring.application.name=bnk_final_ap

server.port=8090

# ORACLE
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:testdb
spring.datasource.username=green
spring.datasource.password=1234

# PostgreSQL(pgvector)
spring.datasource.pg.driver-class-name=org.postgresql.Driver
spring.datasource.pg.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.pg.username=myuser
spring.datasource.pg.password=secret

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format-sql=true
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# OpenAI API Key
# ===========================
spring.ai.openai.api-key=#
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.model=text-embedding-3-small
