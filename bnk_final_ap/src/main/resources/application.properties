spring.application.name=bnk_final_ap
server.port=8090

# =======================
# ORACLE (메인 JPA 데이터소스)
# =======================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:testdb
spring.datasource.username=green
spring.datasource.password=1234
spring.datasource.driver-class-name=oracle.jdbc.driver.OracleDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# ⭐ Oracle Dialect 설정은 제거합니다. Hibernate가 자동으로 감지합니다.

# =======================
# PostgreSQL(pgvector)
# -> DataSource를 수동 등록할 예정 (Spring JPA가 사용 안 함)
# =======================
pg.datasource.url=jdbc:postgresql://localhost:5432/pension_vector_db
pg.datasource.username=pension_user
pg.datasource.password=1234
pg.datasource.driver-class-name=org.postgresql.Driver

