<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <title>전체 알림</title>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <style>
      :root{--bg:#0b1020;--card:#151b2d;--muted:#9aa4b2;}
      *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#e9eef5;font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,'Noto Sans KR',sans-serif}
      .wrap{max-width:720px;margin:40px auto;padding:0 16px}
      .card{background:var(--card);border:1px solid #26324e;border-radius:16px;padding:22px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
      .title{font-size:20px;margin:0 0 24px}
      ul { list-style: none; padding-left: 0; margin: 0; }
      li { padding: 12px 0; border-bottom: 1px solid #2a3656; cursor: pointer; transition: background-color 0.2s; }
      li:first-child { border-top: 1px solid #2a3656; }
      li:hover { background-color: rgba(255,255,255,0.05); }
      .read { opacity: 0.5; cursor: default; }
      .read:hover { background-color: transparent; }
      .muted { color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="card">
        <h1 class="title">전체 알림</h1>
        <ul id="notification-list"></ul>
    </div>
</div>
<script>
    const listUl = document.getElementById('notification-list');

    async function fetchAllNotifications() {
        const response = await fetch('/api/notifications/all'); // 모든 알림 조회 API
        const result = await response.json();
        
        listUl.innerHTML = '';
        if (result.success && result.data.length > 0) {
            result.data.forEach(noti => {
                const li = document.createElement('li');
                if (noti.isRead) {
                    li.classList.add('read');
                }
                li.innerHTML = `
                    <div>${noti.message}</div>
                    <div class="muted">${new Date(noti.createdAt).toLocaleString()}</div>
                `;
                
                if (!noti.isRead && noti.linkUrl) {
                    li.addEventListener('click', () => markAsRead(li, noti.id, noti.linkUrl, noti.linkId));
                }
                listUl.appendChild(li);
            });
        } else {
            listUl.innerHTML = '<li>알림이 없습니다.</li>';
        }
    }

    async function markAsRead(listItem, notificationId, linkUrl, linkId) {
        if(listItem.classList.contains('read')) return;
        try {
            await fetch(`/api/notifications/${notificationId}/read`, { method: 'POST' });
            listItem.classList.add('read');
            if (linkUrl && linkId) {
                window.location.href = `${linkUrl}?linkId=${linkId}`;
            }
        } catch(error) {
            console.error("Mark as read failed:", error);
        }
    }

    fetchAllNotifications();
</script>
</body>
</html>
