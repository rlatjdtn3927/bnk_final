<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>부부연동 요청 수락</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            /* Color Palette */
            --primary-blue: #3182f6;
            --text-strong: #333d4b;
            --text-normal: #4e5968;
            --text-subtle: #8b95a1;
            --surface-bg: #f2f4f6;
            --content-bg: #ffffff;
            --border-light: #e5e8eb;
            --success-color: #28a745;
            --danger-color: #f04452;

            /* Sizing & Radius */
            --content-padding: 24px;
            --border-radius-l: 20px;
            --border-radius-m: 12px;
        }
        
        /* Basic Setup */
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--surface-bg);
            margin: 0;
            color: var(--text-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Layout */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--content-bg);
            position: relative;
            padding-bottom: 120px; /* 하단 고정 버튼 영역 확보 */
        }
        .app-header {
            display: flex;
            align-items: center;
            padding: 16px;
            background: var(--content-bg);
        }
        .app-header .back-btn {
            font-size: 28px;
            font-weight: 500;
            text-decoration: none;
            color: var(--text-strong);
            padding: 0 8px;
        }
        .app-header h1 {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-strong);
            margin: 0;
            text-align: center;
            flex-grow: 1;
            transform: translateX(-20px); /* 아이콘 너비만큼 중앙 정렬 보정 */
        }

        /* Content Area */
        .content-area {
            padding: 40px var(--content-padding);
            text-align: center;
        }
        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background-color: var(--surface-bg);
            border-radius: 50%;
            font-size: 36px;
            margin-bottom: 24px;
        }
        h2.title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-strong);
            margin: 0 0 12px;
            line-height: 1.4;
        }
        p.subtitle {
            font-size: 16px;
            color: var(--text-subtle);
            line-height: 1.6;
            margin: 0 0 32px;
        }

        /* Benefit Box (using info-box style for consistency) */
        .info-box {
            background: var(--surface-bg);
            padding: 20px;
            border-radius: var(--border-radius-l);
            text-align: left;
            margin-bottom: 24px;
        }
        .info-box b {
            font-weight: 700;
            color: var(--text-strong);
            font-size: 16px;
        }
        .info-box ul {
            list-style: none;
            padding: 0;
            margin: 12px 0 0;
        }
        .info-box ul li {
            position: relative;
            padding-left: 22px;
            font-size: 15px;
            color: var(--text-normal);
            margin-bottom: 8px;
        }
        .info-box ul li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--primary-blue);
            font-weight: bold;
        }
        
        /* Action Footer */
        .action-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            margin: 0 auto;
            max-width: 480px;
            padding: 16px var(--content-padding) 32px;
            background: var(--content-bg);
            box-shadow: 0 -8px 16px rgba(0,0,0,0.05);
            border-top-left-radius: var(--border-radius-l);
            border-top-right-radius: var(--border-radius-l);
        }
        .action-footer-buttons {
            display: flex;
            gap: 12px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            height: 52px;
            padding: 0 24px;
            border-radius: var(--border-radius-m);
            border: none;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn.primary { background: var(--primary-blue); color: white; }
        .btn.secondary { background: var(--surface-bg); color: var(--text-strong); }
        .btn:disabled { opacity: .6; cursor: not-allowed; }

        /* Result/Status message */
        .result-message {
            font-size: 16px;
            font-weight: 500;
            padding: 16px;
            text-align: center;
            border-radius: var(--border-radius-m);
        }
        .result-message.success {
            background-color: #e8f3ff;
            color: var(--primary-blue);
        }
        .result-message.error {
            background-color: #fff2f2;
            color: var(--danger-color);
        }
    </style>
</head>
<body>
<div class="mobile-container">
    <header class="app-header">
      <a href="/link-view/main" class="back-btn" aria-label="뒤로가기">‹</a>
      <h1>연동 요청 확인</h1>
    </header>

    <main class="content-area">
        <div class="icon-wrapper">💌</div>
        <h2 class="title">
            <strong id="applicant-name" style="color: var(--primary-blue);">신청자</strong> 님께서<br>연동을 요청했어요.
        </h2>
        <p class="subtitle">
            부부 IRP 연동을 수락하고<br>더 스마트한 노후 준비를 시작해 보세요.
        </p>

        <div class="info-box">
            <b>✅ 연동 시 이런 혜택이 있어요</b>
            <ul>
                <li>IRP 입금 시 입금액의 0.5% 추가 적립</li>
                <li>연말정산 세액공제 전략 공동 수립</li>
            </ul>
        </div>
    </main>

    <footer class="action-footer" id="action-footer">
        <div id="button-container" class="action-footer-buttons">
            <button id="reject-btn" class="btn secondary">거절하기</button>
            <button id="accept-btn" class="btn primary">수락하기</button>
        </div>
    </footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const linkId = urlParams.get('linkId');

        const applicantNameEl = document.getElementById('applicant-name');
        const acceptBtn = document.getElementById('accept-btn');
        const rejectBtn = document.getElementById('reject-btn');
        const footer = document.getElementById('action-footer');
        const buttonContainer = document.getElementById('button-container');

        if (!linkId) {
            showResult('error', '잘못된 접근입니다. 처리할 연동 요청 정보가 없습니다.');
            return;
        }

        fetchRequestDetails(linkId);
        acceptBtn.addEventListener('click', () => handleDecision('ACCEPT'));
        rejectBtn.addEventListener('click', () => handleDecision('REJECT'));

        async function fetchRequestDetails(id) {
            try {
                const response = await fetch(`/link/details/${id}`);
                const result = await response.json();
                if (!response.ok || !result.success) {
                    throw new Error(result.message || '신청 정보를 불러오는 데 실패했습니다.');
                }
                applicantNameEl.textContent = result.data.applicantName || '신청자';
            } catch (error) {
                console.error("신청자 정보 조회 실패:", error);
                applicantNameEl.textContent = '신청자';
                showResult('error', error.message);
            }
        }

        async function handleDecision(action) {
            acceptBtn.disabled = true;
            rejectBtn.disabled = true;

            try {
                const res = await fetch('/link/spouse/decide', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ linkId: Number(linkId), action: action })
                });
                const result = await res.json();
                
                if (!res.ok || !result.success) {
                  throw new Error(result.message || '요청 처리에 실패했습니다.');
                }
                
                const message = action === 'ACCEPT' ? '연동을 수락했습니다.' : '연동을 거절했습니다.';
                showResultAndRedirect('success', message);
            } catch (error) {
                showResult('error', '오류: ' + error.message);
                acceptBtn.disabled = false;
                rejectBtn.disabled = false;
            }
        }
        
        function showResult(type, message) {
            buttonContainer.style.display = 'none'; // 버튼 숨기기

            let resultDiv = footer.querySelector('.result-message');
            if (!resultDiv) {
                resultDiv = document.createElement('div');
                resultDiv.className = 'result-message';
                footer.appendChild(resultDiv);
            }
            
            resultDiv.classList.remove('success', 'error');
            resultDiv.classList.add(type);
            resultDiv.textContent = message;
            
            if (type === 'error') {
                setTimeout(() => { // 잠시 후 에러 메시지 숨기고 버튼 다시 표시
                    resultDiv.remove();
                    buttonContainer.style.display = 'flex';
                }, 3000);
            }
        }
        
        function showResultAndRedirect(type, message) {
            showResult(type, message + ' 2초 후 메인 페이지로 이동합니다.');
            setTimeout(() => {
                window.location.href = '/link-view/main';
            }, 2000);
        }
    });
</script>
</body>
</html>
