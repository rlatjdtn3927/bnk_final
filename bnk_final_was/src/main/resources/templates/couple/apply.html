<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>부부연동 신청</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{--bg:#0b1020;--card:#151b2d;--muted:#9aa4b2;--accent:#5dd0ff;--ok:#2ecc71;--warn:#ffb020;--bad:#ff5c5c}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#e9eef5;font-family:system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,'Noto Sans KR',sans-serif}
    .wrap{max-width:720px;margin:40px auto;padding:0 16px}
    .card{background:var(--card);border:1px solid #26324e;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
    .header{padding:22px 22px 0}
    .title{font-size:20px;margin:0 0 4px}
    .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
    form{padding:22px;display:grid;gap:14px}
    label{font-size:13px;color:#cfd7e1}
    input[type=text],input[type=date],input[type=file]{width:100%;padding:12px 12px;border-radius:12px;border:1px solid #2a3656;background:#0f1526;color:#e9eef5}
    .row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;border:1px solid #2a3656;background:#0f1526;color:#e9eef5;cursor:pointer}
    .btn.primary{background:linear-gradient(135deg,#2a9df4,#6dd5ff);border:none;color:#0a0f1e;font-weight:700}
    .btn.secondary{background: #2a3656;}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .status{margin-top:16px;padding:14px;border-radius:12px;display:none}
    .status.ok{display:block;background:rgba(46,204,113,.1);border:1px solid rgba(46,204,113,.3);color:#d7ffe6}
    .status.warn{display:block;background:rgba(255,176,32,.12);border:1px solid rgba(255,176,32,.35);color:#fff1d6}
    .status.bad{display:block;background:rgba(255,92,92,.1);border:1px solid rgba(255,92,92,.35);color:#ffdede}
    .muted{color:var(--muted);font-size:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="header">
      <h1 class="title">부부연동 신청</h1>
      <p class="sub" th:text="'세션 사용자: ' + (${sessionUserId} != null ? ${sessionUserId} : '로그인 필요')"></p>
    </div>

    <form id="applyForm" enctype="multipart/form-data">
      <div>
        <label for="spouseName">배우자 이름</label>
        <input type="text" id="spouseName" name="spouseName" placeholder="예: 김연동" required/>
      </div>

      <div class="row">
        <div>
          <label for="spouseBirth">배우자 생년월일</label>
          <input type="date" id="spouseBirth" name="spouseBirth" required/>
        </div>
        <div>
          <label for="file">가족관계증명서 (PDF만)</label>
          <input id="file" type="file" name="file" accept=".pdf,application/pdf" required/>
        </div>
      </div>

      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn primary" type="submit" id="submitBtn">신청하기</button>
        <button class="btn secondary" type="button" id="adminRequestBtn" style="display: none;">관리자에게 검토 요청</button>
        <span id="loading" class="muted" style="display:none">처리 중…</span>
      </div>

      <div id="statusBox" class="status"></div>
    </form>
  </div>
</div>

<script>
  // --- DOM 요소 가져오기 ---
  const form = document.getElementById('applyForm');
  const fileInput = document.getElementById('file');
  const submitBtn = document.getElementById('submitBtn');
  const adminRequestBtn = document.getElementById('adminRequestBtn');
  const loading = document.getElementById('loading');
  const statusBox = document.getElementById('statusBox');

  // 재시도를 위해 linkId를 저장할 변수
  let currentLinkId = null;

  // --- 함수 정의 ---

  // 상태 메시지 박스를 표시하는 헬퍼 함수
  const setStatus = (type, text) => {
    statusBox.className = 'status ' + type;
    statusBox.innerHTML = text; // innerHTML을 사용해 <br> 태그 등 허용
  };

  // 폼 제출 이벤트를 처리하는 메인 함수
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setStatus('none', ''); // 이전 메시지 숨기기
    loading.style.display = 'inline';
    submitBtn.disabled = true;
    submitBtn.textContent = '처리 중...';

    try {
      const fd = new FormData(form);
      if (currentLinkId) {
        fd.append("existingLinkId", currentLinkId);
      }

      const res = await fetch('/link/apply', {
        method: 'POST',
        headers: { 'Accept': 'application/json' },
        body: fd
      });
      const result = await res.json();

      if (!res.ok) throw new Error(result.message || `서버 응답 오류 (${res.status})`);
      
      const data = result.data;
      
      // [핵심] 서버 응답의 nextAction에 따라 UI 분기 처리
      switch (data.nextAction) {
        case 'WAIT_SPOUSE':
          setStatus('ok', '<b>신청이 정상 접수되었습니다.</b><br>배우자에게 연동 요청 알림을 보냈습니다.');
          form.reset();
          submitBtn.style.display = 'none';
          adminRequestBtn.style.display = 'none';
          break;
        
        case 'RETRY_OCR':
          setStatus('warn', `<b>OCR 판독 실패 (${data.message.match(/(\d\/\d)/)[0]}회)</b><br>증빙 서류가 선명하게 나오도록 다시 업로드해주세요.`);
          currentLinkId = data.linkId; // 다음 시도를 위해 linkId 저장
          submitBtn.textContent = '다시 신청하기';
          break;

        case 'AWAIT_ADMIN_REQUEST':
          setStatus('bad', '<b>자동 판독에 3회 실패했습니다.</b><br>관리자에게 직접 검토를 요청하시겠습니까?');
          currentLinkId = data.linkId; // 관리자 요청에 사용할 linkId 저장
          submitBtn.style.display = 'none';
          adminRequestBtn.style.display = 'inline-flex';
          break;
          
        case 'WAIT_ADMIN': // 3회 실패 후 관리자 요청까지 완료된 경우
          setStatus('warn', '<b>관리자에게 검토를 요청했습니다.</b><br>처리에는 1~2 영업일이 소요될 수 있습니다.');
          submitBtn.style.display = 'none';
          adminRequestBtn.style.display = 'none';
          break;

        default:
          setStatus('bad', data.message || '알 수 없는 상태입니다.');
      }

    } catch (err) {
      setStatus('bad', '네트워크 오류: ' + err.message);
    } finally {
      loading.style.display = 'none';
      submitBtn.disabled = false;
    }
  });

  // '관리자에게 검토 요청' 버튼 클릭 이벤트
  adminRequestBtn.addEventListener('click', async () => {
    const spouseName = document.getElementById('spouseName').value;
    const spouseBirth = document.getElementById('spouseBirth').value;
    
    if (!spouseName || !spouseBirth) {
        alert('배우자 이름과 생년월일은 반드시 입력해야 합니다.');
        return;
    }

    loading.style.display = 'inline';
    adminRequestBtn.disabled = true;

    try {
    	const fd = new FormData();
    	fd.append('linkId', currentLinkId);
    	fd.append('spouseName', spouseName);
    	fd.append('spouseBirth', spouseBirth);

    	const fileEl = document.getElementById('file');
    	if (!fileEl.files || fileEl.files.length === 0) {
    	  alert('관리자 심사 요청에는 가족관계증명서 파일 첨부가 필요합니다.');
    	  adminRequestBtn.disabled = false;
    	  loading.style.display = 'none';
    	  return;
    	}
    	fd.append('file', fileEl.files[0]);

    	const res = await fetch('/link/request-admin-review', {
    	  method: 'POST',
    	  body: fd
    	});
    	const result = await res.json();
      if (!res.ok || !result.success) throw new Error(result.message || '요청 실패');
      
      setStatus('warn', '<b>관리자에게 검토를 요청했습니다.</b><br>처리에는 1~2 영업일이 소요될 수 있습니다.');
      adminRequestBtn.style.display = 'none';

    } catch (err) {
      setStatus('bad', '요청 처리 중 오류: ' + err.message);
      adminRequestBtn.disabled = false;
    } finally {
        loading.style.display = 'none';
    }
  });
</script>
</body>
</html>
