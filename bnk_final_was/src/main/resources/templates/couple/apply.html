<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>부부 IRP 연동 신청</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            /* Color Palette */
            --primary-blue: #3182f6;
            --text-strong: #333d4b;
            --text-normal: #4e5968;
            --text-subtle: #8b95a1;
            --surface-bg: #f2f4f6;
            --content-bg: #ffffff;
            --border-light: #e5e8eb;
            --success-color: #059669;
            --warning-color: #f59e0b;
            --danger-color: #f04452;
        }

        /* Basic Setup */
        *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Pretendard', sans-serif;
            background: var(--surface-bg);
            margin: 0;
            color: var(--text-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Layout */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            background: var(--surface-bg);
            padding-bottom: 120px; /* Footer height */
        }
        .app-header {
            display: flex; align-items: center; padding: 16px; background: var(--content-bg);
        }
        .app-header .back-btn {
            font-size: 28px; font-weight: 500; text-decoration: none; color: var(--text-strong); padding: 0 8px;
        }
        .app-header h1 {
            font-size: 18px; font-weight: 700; color: var(--text-strong); margin: 0; text-align: center; flex-grow: 1; transform: translateX(-20px);
        }
        .content-area { padding: 16px; }

        /* Form Card & Elements */
        .form-card {
            background: var(--content-bg);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 12px;
        }
        .form-card h2 {
            font-size: 20px; font-weight: 700; color: var(--text-strong); margin: 0 0 24px;
        }
        .form-group { margin-bottom: 20px; }
        .form-group:last-child { margin-bottom: 0; }
        label {
            display: block; font-size: 14px; font-weight: 600; color: var(--text-strong); margin-bottom: 8px;
        }
        input[type=text], input[type=date] {
            width: 100%; height: 52px; padding: 0 16px;
            border-radius: 12px; border: 1px solid var(--border-light);
            background: var(--surface-bg); color: var(--text-strong);
            font-size: 16px; font-family: 'Pretendard', sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type=text]:focus, input[type=date]:focus {
            outline: none; border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(49, 130, 246, 0.15);
        }
        .muted-text { color: var(--text-subtle); font-size: 13px; line-height: 1.5; margin-top: 8px; }

        /* Custom File Upload */
        input[type=file] { display: none; }
        .file-upload-label {
            display: flex; align-items: center; justify-content: space-between;
            width: 100%; height: 52px; padding: 0 8px 0 16px;
            border-radius: 12px; border: 1px solid var(--border-light);
            background: var(--surface-bg); color: var(--text-subtle);
            cursor: pointer; transition: border-color 0.2s;
        }
        .file-upload-label.has-file { border: 1px solid var(--primary-blue); }
        .file-upload-label .file-name {
            font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .file-upload-label.has-file .file-name { color: var(--text-strong); }
        .file-upload-label .file-btn {
            background: var(--content-bg); border: 1px solid var(--border-light);
            color: var(--text-strong); padding: 8px 14px; border-radius: 8px;
            font-size: 14px; font-weight: 600; white-space: nowrap;
        }

        /* Action Footer */
        .action-footer {
            position: fixed; bottom: 0; left: 0; right: 0;
            width: 100%; margin: 0 auto; max-width: 480px;
            padding: 16px 16px 32px; background: var(--content-bg);
            box-shadow: 0 -8px 16px rgba(0,0,0,0.05);
            border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .btn {
            display: flex; align-items: center; justify-content: center; width: 100%;
            height: 52px; padding: 0 24px; border-radius: 12px; border: none;
            font-size: 17px; font-weight: 600; cursor: pointer; text-decoration: none;
            transition: background-color 0.2s, opacity 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn.primary { background: var(--primary-blue); color: white; }
        .btn.secondary { background: var(--surface-bg); color: var(--text-strong); }
        .btn:disabled { background-color: #bec3c9; cursor: not-allowed; }
        
        /* Status & Precheck Card */
        .status-card, .precheck-card {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            background: var(--content-bg); border-radius: 20px; padding: 32px 24px;
        }
        .status-card .icon, .precheck-card .icon { font-size: 36px; line-height: 1; margin-bottom: 16px; }
        .status-card .title, .precheck-card .title { font-size: 22px; font-weight: 700; margin: 0 0 8px; color: var(--text-strong); }
        .status-card .message, .precheck-card .message { font-size: 16px; line-height: 1.6; color: var(--text-normal); margin: 0; }
        .precheck-card .btn { margin-top: 24px; }
        .status-card.success .icon { color: var(--success-color); }
        .status-card.warning .icon { color: var(--warning-color); }
        .status-card.error .icon { color: var(--danger-color); }

        .loading-text { text-align: center; padding-top: 40px; color: var(--text-subtle); }
    </style>
</head>
<body>
<div class="mobile-container">
    <header class="app-header">
      <a href="/link-view/main" class="back-btn" aria-label="뒤로가기">‹</a>
      <h1>부부 IRP 연동 신청</h1>
    </header>

    <main class="content-area">
        <div id="loading-view">
            <p class="loading-text">신청 자격를 확인하는 중입니다...</p>
        </div>

        <div id="precheck-view" style="display: none;">
            <div class="precheck-card">
                <div class="icon">🏦</div>
                <h3 class="title">IRP 계좌가 먼저 필요해요</h3>
                <p class="message">부부 연동을 신청하려면<br>본인의 IRP 계좌가 있어야 합니다.</p>
                <a href="/irp/join/irp-join" class="btn primary">IRP 계좌 개설하기</a>
            </div>
        </div>
        
        <div id="form-container" style="display: none;">
            <div id="statusBox"></div>
            <form id="applyForm" enctype="multipart/form-data">
                <div class="form-card">
                    <h2>배우자 정보</h2>
                    <div class="form-group">
                        <label for="spouseName">이름</label>
                        <input type="text" id="spouseName" name="spouseName" placeholder="배우자 성명을 정확히 입력" required/>
                    </div>
                    <div class="form-group">
                        <label for="spouseBirth">생년월일</label>
                        <input type="date" id="spouseBirth" name="spouseBirth" required/>
                    </div>
                </div>

                <div class="form-card">
                    <h2>증빙 서류</h2>
                    <div class="form-group">
                        <label for="file">가족관계증명서</label>
                        <label for="file" class="file-upload-label" id="file-label">
                            <span class="file-name" id="file-name">파일 선택</span>
                            <span class="file-btn">파일 찾기</span>
                        </label>
                        <input id="file" type="file" name="file" accept=".pdf,application/pdf" required/>
                        <p class="muted-text">주민등록번호 뒷자리는 가리고 업로드해주세요. (PDF 형식)</p>
                    </div>
                </div>
            </form>
            <footer class="action-footer">
              <button class="btn primary" type="submit" id="submitBtn" form="applyForm">신청하기</button>
              <button class="btn secondary" type="button" id="adminRequestBtn" style="display: none;">관리자에게 검토 요청</button>
            </footer>
        </div>
    </main>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // --- DOM 요소 ---
    const loadingView = document.getElementById('loading-view');
    const precheckView = document.getElementById('precheck-view');
    const formContainer = document.getElementById('form-container');
    const form = document.getElementById('applyForm');
    const fileInput = document.getElementById('file');
    const fileLabel = document.getElementById('file-label');
    const fileNameSpan = document.getElementById('file-name');
    const submitBtn = document.getElementById('submitBtn');
    const adminRequestBtn = document.getElementById('adminRequestBtn');
    const statusBox = document.getElementById('statusBox');

    let currentLinkId = null;

    async function checkUserIrpStatus() {
        try {

            const response = await fetch('/link/status'); 
            const result = await response.json();
            
            if (result.success && result.data.hasIrpAccount) {
                // 계좌가 있으면 신청서 폼을 보여줌
                formContainer.style.display = 'block';
            } else {
                // 계좌가 없으면 개설 안내 화면을 보여줌
                precheckView.style.display = 'block';
            }
        } catch (error) {
            console.error('IRP status check failed:', error);

            precheckView.style.display = 'block';
        } finally {
            loadingView.style.display = 'none';
        }
    }

    // --- 상태 메시지 UI 설정 ---
    const setStatus = (type, title, message) => {
        if (!type) {
            statusBox.innerHTML = '';
            return;
        }
        const icons = { success: '✅', warning: '⚠️', error: '❗️' };
        const icon = icons[type] || 'ℹ️';
        statusBox.innerHTML = `
            <div class="status-card ${type}" style="margin-bottom: 12px;">
                <div class="icon">${icon}</div>
                <h3 class="title">${title}</h3>
                <p class="message">${message}</p>
            </div>`;
        
        if (type === 'success') {
            document.getElementById('applyForm').style.display = 'none';
        }
    };

    // --- 이벤트 리스너 ---
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            fileNameSpan.textContent = fileInput.files[0].name;
            fileLabel.classList.add('has-file');
        } else {
            fileNameSpan.textContent = '파일 선택';
            fileLabel.classList.remove('has-file');
        }
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        setStatus(null);
        submitBtn.disabled = true;
        submitBtn.textContent = '처리 중...';
        adminRequestBtn.style.display = 'none';

        try {
            const fd = new FormData(form);
            if (currentLinkId) fd.append("existingLinkId", currentLinkId);

            const res = await fetch('/link/apply', { method: 'POST', headers: { 'Accept': 'application/json' }, body: fd });
            const result = await res.json();
            
            if (!res.ok) throw new Error(result.message || `서버 응답 오류 (${res.status})`);
            
            const data = result.data;
            
            switch (data.nextAction) {
                case 'WAIT_SPOUSE':
                    setStatus('success', '신청이 완료되었습니다', '배우자에게 연동 요청 알림을 보냈습니다.<br>이제 이 페이지를 닫으셔도 됩니다.');
                    formContainer.querySelector('.action-footer').style.display = 'none';
                    break;
                case 'RETRY_OCR':
                    const attempt = data.message.match(/(\d\/\d)/)?.[0] || '';
                    setStatus('warning', `OCR 판독 실패 (${attempt})`, '증빙 서류가 선명하게 나오도록 다시 업로드해주세요.');
                    currentLinkId = data.linkId;
                    submitBtn.textContent = '다시 신청하기';
                    break;
                case 'AWAIT_ADMIN_REQUEST':
                    setStatus('error', '자동 판독 실패', '자동 판독에 3회 실패했습니다.<br>관리자에게 직접 검토를 요청하시겠습니까?');
                    currentLinkId = data.linkId;
                    submitBtn.style.display = 'none';
                    adminRequestBtn.style.display = 'flex';
                    break;
                case 'WAIT_ADMIN':
                    setStatus('success', '관리자 검토 요청됨', '관리자에게 검토를 요청했습니다. 처리에는 1~2 영업일이 소요될 수 있습니다.');
                    formContainer.querySelector('.action-footer').style.display = 'none';
                    break;
                default:
                    setStatus('error', '알 수 없는 오류', data.message || '알 수 없는 상태입니다.');
                    submitBtn.textContent = '다시 신청하기';
            }
        } catch (err) {
            setStatus('error', '오류가 발생했습니다', err.message);
            submitBtn.textContent = currentLinkId ? '다시 신청하기' : '신청하기';
        } finally {
            submitBtn.disabled = false;
        }
    });

    adminRequestBtn.addEventListener('click', async () => {
        const spouseName = document.getElementById('spouseName').value;
        const spouseBirth = document.getElementById('spouseBirth').value;
        
        if (!spouseName || !spouseBirth || !fileInput.files || fileInput.files.length === 0) {
            setStatus('error', '정보 누락', '관리자 검토 요청 시에는 배우자 정보와 증빙 서류가 모두 필요합니다.');
            return;
        }
        
        adminRequestBtn.disabled = true;
        adminRequestBtn.textContent = '요청 중...';

        try {
            const fd = new FormData();
            fd.append('linkId', currentLinkId);
            fd.append('spouseName', spouseName);
            fd.append('spouseBirth', spouseBirth);
            fd.append('file', fileInput.files[0]);

            const res = await fetch('/link/request-admin-review', { method: 'POST', body: fd });
            const result = await res.json();
            
            if (!res.ok || (result.hasOwnProperty('success') && !result.success)) {
                throw new Error(result.message || '요청에 실패했습니다.');
            }
          
            setStatus('success', '검토 요청 완료', '관리자에게 검토를 요청했습니다. 처리에는 1~2 영업일이 소요됩니다.<br>이제 이 페이지를 닫으셔도 됩니다.');
            formContainer.querySelector('.action-footer').style.display = 'none';

        } catch (err) {
            setStatus('error', '요청 실패', err.message);
            adminRequestBtn.disabled = false;
        } finally {
            adminRequestBtn.textContent = '관리자에게 검토 요청';
        }
    });

    // --- 페이지 초기화 실행 ---
    checkUserIrpStatus();
  });
</script>
</body>
</html>
