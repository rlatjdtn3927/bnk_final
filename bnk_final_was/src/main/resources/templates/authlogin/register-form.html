<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>회원가입</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
*{box-sizing:border-box}

body {
  font-family: 'Pretendard', sans-serif;
  margin: 0;
  padding: 0;
  background: #fff;
  color: #222;
}

/* 카드/타이틀 기본(로그인과 동일 톤) */
.wrap { display:flex; justify-content:center; align-items:center; min-height:90vh; }
.card { background:#fff; padding:18px 20px; width:100%; max-width:480px; }
.title { font-size:22px; font-weight:700; margin:0 0 6px; }
.subtitle { font-size:14px; color:#666; margin:0 0 18px; }

#register-form {
  margin-top: 25px; 
}

/* 라벨/필드 */
#register-form label { 
  display:block; 
  margin:10px 0 6px 5px; 
  font-size:11px; 
  font-weight:700; 
  color:#555; 
}
#register-form .input, #register-form select {
  width:100%; height:44px; padding:0 12px;
  border:1px solid #ddd; border-radius:8px; font-size:12px; outline:none; box-sizing:border-box;
}
#register-form .input:focus, #register-form select:focus {
  border-color:#2e2f36; box-shadow:0 0 0 3px rgba(46,47,54,.08);
}

/* 2칸 행 */
#register-form .row { display:flex; gap:12px; }

/* select 기본 화살표 커스텀(선택) */
#register-form select {
  appearance:none; background:#fff
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>")
    no-repeat right 10px center;
  padding-right:34px;
}

/* 체크박스 라벨 약간 정돈 */
#register-form .agree { 
  display:flex; 
  align-items:center; 
  gap:8px; 
  margin-top: 22px;
  margin-bottom: 10px; 
  font-size:14px; 
}

/* 가입 버튼(로그인과 동일 스타일) */
#register-form .btn{
  width:100%; height:44px; border:0; border-radius:8px;
  background:#f85151; color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  transition:background .2s;
}
#register-form .btn:hover{ background:#e04444; }

/* 메시지 */
#register-form .err{ margin-top:8px; color:#e74c3c; font-size:13px; }
#register-form .ok{ margin-top:8px; color:#1b8f49; font-size:13px; }

/* 비밀번호 토글 버튼 위치(두 칸 칸마다) */
#register-form .pw-wrap { position:relative; }
#register-form .pw-toggle{
  position:absolute; right:10px; top:55%; transform:translateY(-50%);
  width:24px; height:24px; border:0; background:transparent; cursor:pointer;
  text-indent:-9999px; overflow:hidden; /* 텍스트 '표시' 숨김 — JS 영향 없음 */
  padding:0;
}

/* 👁 눈 아이콘 (password 상태) */
#register-form .pw-toggle.eye{
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12Z'/><circle cx='12' cy='12' r='3'/></svg>")
    no-repeat center/20px;
}
/* 👁‍🗨 눈-오프 아이콘 (text 상태) */
#register-form .pw-toggle.eye-off{
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.94'/><path d='M6.1 6.1C8.28 4.9 10.08 4 12 4c7 0 11 8 11 8a22 22 0 0 1-5.1 6.9'/><path d='M9.88 9.88A3 3 0 0 0 12 15a3 3 0 0 0 2.12-.88'/><path d='M1 1l22 22'/></svg>")
    no-repeat center/20px;
}

.links {
  color: #555555;
  text-align: center;
  margin-top: 20px;
  font-size: 14px;
  margin-bottom: 5px;
}

.links a {
  text-decoration: none;
}

.bold {
  font-weight: 700; 
  color: #222;
}

.links a:hover{ text-decoration:underline; }

.muted {
  color: #555555;
  text-align: center;
  font-size: 14px;
}
</style>
</head>
<!-- ... head/style 동일 ... -->
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">회원가입</div>
      <div class="subtitle"></div>

      <form id="register-form" novalidate>
        <label>아이디</label>
        <input type="text" id="username" class="input" autocomplete="username" placeholder="영문/숫자 4~15자" />

        <div class="row">
          <div style="flex:1">
            <label>성명</label>
            <input type="text" id="nickname" class="input" placeholder="이름"/>
          </div>
          <div style="width:140px">
            <label>성별</label>
            <select id="gender">
              <option value="M">남</option>
              <option value="F">여</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div style="flex:1">
            <label>이메일</label>
            <input type="email" id="email" class="input" autocomplete="email" placeholder="example@domain.com" />
          </div>
          <div style="width:180px">
            <label>생년월일</label>
            <input type="date" id="birthDate" class="input" />
          </div>
        </div>

        <!-- ✅ 주민등록번호 입력 추가 -->
        <label>주민등록번호</label>
        <div class="row">
          <div style="flex:1">
            <input type="text" id="rrnFront" class="input" placeholder="앞 6자리" maxlength="6" />
          </div>
          <div style="width:20px; text-align:center; padding-top:12px">-</div>
          <div style="flex:1">
            <input type="password" id="rrnBack" class="input" placeholder="뒤 7자리" maxlength="7" />
          </div>
        </div>

	      <label>직종</label>
	<select id="job" required>
	  <option value="">-- 선택하세요 --</option>
	  <option value="STUDENT">학생</option>
	  <option value="OFFICE_WORKER">사무직 / 회사원</option>
	  <option value="PUBLIC_SERVANT">공무원 </option>
	  <option value="SELF_EMPLOYED">자영업자</option>
	  <option value="Professional">전문직(의사, 변호사, 회계사 등)</option>
	  <option value="soldier">군인</option>
	  <option value="RETIRED">퇴직자</option>
	  <option value="ETC">기타</option>
	</select>

        <div class="row">
          <div style="flex:1" class="pw-wrap">
            <label>비밀번호</label>
            <input type="password" id="password" class="input" autocomplete="new-password" placeholder="영문+숫자 6자 이상" />
            <button type="button" class="pw-toggle" data-target="password">표시</button>
          </div>
          <div style="flex:1" class="pw-wrap">
            <label>비밀번호 확인</label>
            <input type="password" id="confirmPassword" class="input" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="confirmPassword"></button>
          </div>
        </div>

        <label class="agree">
          <input type="checkbox" id="agreeTerms" />
          약관에 동의합니다.
        </label>

        <button type="submit" class="btn">가입하기</button>
        <div id="errorMsg" class="err"></div>
        <div id="okMsg" class="ok"></div>
        <div class="links">
          이미 계정이 있나요? <a href="/login-view"><span class="bold">로그인</span></a>
        </div>
        <div class="muted">회원가입 완료 후 로그인 화면으로 이동합니다.</div>
      </form>
    </div>
  </div>

  <script>
    /*
    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input.type === 'password') { input.type = 'text'; btn.textContent = '숨김'; }
        else { input.type = 'password'; btn.textContent = '표시'; }
      });
    });
	*/
	
	document.querySelectorAll('#register-form .pw-toggle').forEach(btn => {
		  const target = document.getElementById(btn.dataset.target);
		  // 초기 상태: password → '눈' 아이콘
		  btn.classList.add('eye');

		  btn.addEventListener('click', () => {
		    if (!target) return;
		    if (target.type === 'password') {
		      target.type = 'text';
		      btn.classList.remove('eye');
		      btn.classList.add('eye-off');   // 눈-오프 아이콘
		    } else {
		      target.type = 'password';
		      btn.classList.remove('eye-off');
		      btn.classList.add('eye');       // 눈 아이콘
		    }
		  });
		});
	
    document.getElementById("register-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const rrnFront = document.getElementById("rrnFront").value.replace(/\D/g,"");
      const rrnBack  = document.getElementById("rrnBack").value.replace(/\D/g,"");

      const data = {
        username: document.getElementById("username").value.trim(),
        nickname: document.getElementById("nickname").value.trim(),
        gender: document.getElementById("gender").value, // M/F
        birthDate: document.getElementById("birthDate").value, // yyyy-MM-dd
        email: document.getElementById("email").value.trim(),
        job: document.getElementById("job").value,
        password: document.getElementById("password").value,
        confirmPassword: document.getElementById("confirmPassword").value,
        agreeTerms: document.getElementById("agreeTerms").checked,
        rrn: rrnFront + rrnBack // ✅ AP로 전달
      };

      const err = document.getElementById("errorMsg");
      const ok = document.getElementById("okMsg");
      err.textContent = ""; ok.textContent = "";

      const idOk = /^[a-zA-Z0-9]{4,15}$/.test(data.username);
      const pwOk = /^(?=.*[A-Za-z])(?=.*\d).{6,}$/.test(data.password);
      const emailOk = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email);
      const rrnOk = /^\d{6}\d{7}$/.test(data.rrn);

      if (!idOk) { err.textContent = "아이디는 4~15자, 영문과 숫자만 가능합니다."; return; }
      if (!pwOk) { err.textContent = "비밀번호는 6자 이상, 영문+숫자 조합이어야 합니다."; return; }
      if (data.password !== data.confirmPassword) { err.textContent = "비밀번호가 일치하지 않습니다."; return; }
      if (!emailOk) { err.textContent = "이메일 형식을 확인하세요."; return; }
      if (!data.job) { err.textContent = "직종을 선택하세요."; return; }
      if (!data.agreeTerms) { err.textContent = "약관에 동의해 주세요."; return; }
      if (!rrnOk) { err.textContent = "주민등록번호를 정확히 입력하세요."; return; }

      try{
        const res = await fetch("/user-api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "same-origin",
          body: JSON.stringify(data)
        });

        const text = await res.text();
        let payload = {};
        try { payload = JSON.parse(text); } catch { payload = { ok: res.ok, message: text }; }

        if (!res.ok || payload.ok === false) { err.textContent = payload.message || "회원가입 실패"; return; }

        ok.textContent = "가입 완료! 로그인 화면으로 이동합니다.";
        setTimeout(() => location.href = "/login-view", 800);
      }catch(e){
        err.textContent = "네트워크 오류가 발생했습니다.";
      }
    });
  </script>
</body>
</html>
