<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>통합 로그인</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
* { box-sizing: border-box; } 

body {
  font-family: 'Pretendard', sans-serif;
  margin: 0;
  padding: 0;
  background: #fff;
  color: #222;
}

/* 전체 레이아웃 */
.wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 90vh;
  max-width:760px;
} 

.grid {
  width: 100%;
  max-width: 400px;
}
/*
@media(min-width:860px){ 
  .grid{grid-template-columns: 520px;} 
  .wrap{display:flex; justify-content:center;} 
}
*/
/* 로그인 카드 */
.card {
  background: #fff;
  padding: 40px 32px;
  text-align: center;
}

.logo {
  display: flex;
  justify-content: center;   /* 가운데 정렬 */
  align-items: center;
  margin-bottom: 50px;
}

.brand {
  font-size: 28px;
  font-weight: 700;
}

.brand .red {
  color: #D93C3C;           /* BNK 빨강 */
  font-weight: 700;
}

/* 부제목 */
.subtitle {
  display: flex;                   /* 가로 배치 */
  justify-content: space-between;  /* 좌우 끝에 배치 */
  font-size: 14px;
  color: #666;
  margin-bottom: 20px;
  align-items: center;             /* 세로 가운데 정렬 */
}

.admin-badge {
  display: inline-block;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  background: #2e2f36;
  padding: 4px 10px;
  border-radius: 14px;
  text-decoration: none;
  margin-right: 5px; 
}

.admin-badge:hover {
  background: #444;          /* hover 시 약간 밝게 */
}

/* 입력 필드 */
.field {
  margin-bottom: 16px;
  position: relative;
}

/* 라벨 */
.field-label{
  display:block;
  margin: 0 0 6px;
  font-size:16px;
  font-weight:700;
  text-align: left; /* ✅ 왼쪽 정렬 */
  color:#555555;  
  margin-left: 3px;
} 

.input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid #ddd;
  border-radius: 6px;
  font-size: 14px;
  outline: none;
  padding: auto auto auto 40px; /* 왼쪽에 아이콘 자리 확보 */
}
.input:focus {
  border-color: #2e2f36;
  background-image: none;   /* 포커스 시 아이콘 제거 */
}

/* 사람 아이콘 */
.user-input {
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23666' viewBox='0 0 24 24'><path d='M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z'/></svg>") no-repeat 12px center;
  background-size: 18px;
}

/* 자물쇠 아이콘 */
.pw-input {
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23666' viewBox='0 0 24 24'><path d='M17 8h-1V6c0-2.8-2.2-5-5-5S6 3.2 6 6v2H5c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8 6c0-1.7 1.3-3 3-3s3 1.3 3 3v2H8V6zm9 16H5V10h12v12z'/></svg>") no-repeat 12px center;
  background-size: 18px;
}

/* 비밀번호 토글 버튼 */
.pw-wrap {
  position: relative;
}
.pw-toggle {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-10%); 
  background: transparent;
  border: none;
  color: #666;
  cursor: pointer;
  width: 24px;
  height: 24px;
  padding: 0;
}

/* 눈 모양 아이콘 (비밀번호 숨김 상태) */
.pw-toggle.show {
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' fill='%23666' viewBox='0 0 24 24'><path d='M12 5c-7.633 0-11 7-11 7s3.367 7 11 7 11-7 11-7-3.367-7-11-7zm0 12c-2.757 0-5-2.243-5-5s2.243-5 5-5 5 2.243 5 5-2.243 5-5 5zm0-8a3 3 0 100 6 3 3 0 000-6z'/></svg>") no-repeat center;
  background-size: 20px;
}

/* 눈 감은 아이콘 (비밀번호 표시 상태) */
.pw-toggle.hide {
  background:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23999' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.77 21.77 0 0 1 5.06-6.94'/><path d='M6.1 6.1C8.28 4.9 10.08 4 12 4c7 0 11 8 11 8a22 22 0 0 1-5.1 6.9'/><path d='M9.88 9.88A3 3 0 0 0 12 15a3 3 0 0 0 2.12-.88'/><path d='M1 1l22 22'/></svg>")
    no-repeat center/20px;
}

/* 로그인 버튼 */
.btn {
  width: 100%;
  padding: 14px 0;
  background: #f85151; /* 보라색 */
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s;
}
.btn:hover {
  background: #e04444;
}

/* 오류 메시지 */
.error {
  margin-top: 10px;
  font-size: 13px;
  color: #e74c3c;
}

/* 회원가입 링크 */
.links {
  margin-top: 20px;
}
.links a {
  font-size: 16px;
  color: #444;
  text-decoration: none;
}
.links a:hover {
  text-decoration: underline;
}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="grid">
    
      <!-- 메인 로그인 카드 -->
      <div class="card">
        <div class="logo">
          <div class="brand"><span class="red">BNK</span> 퇴직연금</div>
        </div>
        <div class="subtitle">
          사용자 로그인입니다.
          <a href="/admin" class="admin-badge">admin</a>
        </div>

        <form id="login-form" autocomplete="on" class="row" novalidate>
          <div class="field">
            <label class="field-label" for="username">아이디</label>
            <input class="input user-input" id="username" name="username" type="text" autocomplete="username" />
          </div>

          <div class="field pw-wrap">
            <label class="field-label" for="password">비밀번호</label>
            <input class="input pw-input" id="password" name="password" type="password" autocomplete="current-password" />
            <button type="button" id="togglePw" class="pw-toggle" aria-controls="password" aria-label="비밀번호 표시 전환"></button>
          </div>

          <button type="submit" id="loginBtn" class="btn"><strong>로그인</strong></button>
          <div id="errorMsg" class="error" role="status" aria-live="polite"></div>

          <div class="links">
            <a href="/register">회원가입</a>
          </div>
        </form>
      </div> 
      <!-- card (end) -->
    </div>
  </div> 

<script>
  function toggleInputIcon(input, className){
	  if(input.value.trim() !== ""){
	    input.classList.remove(className);  // 값 있으면 아이콘 제거
	  } else {
	    input.classList.add(className);     // 값 없으면 아이콘 복원
	  }
  }
  
  const usernameInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");

  // 초기 체크
  toggleInputIcon(usernameInput, "user-input");
  toggleInputIcon(passwordInput, "pw-input");

  // 입력할 때마다 체크
  usernameInput.addEventListener("input", () => toggleInputIcon(usernameInput, "user-input"));
  passwordInput.addEventListener("input", () => toggleInputIcon(passwordInput, "pw-input"));

  // 비밀번호 표시/숨기기
  const pw = document.getElementById('password');
  const btn = document.getElementById('togglePw');

  // 초기 상태 → 눈 아이콘
  btn.classList.add('show');

  btn.addEventListener('click', () => {
    if (pw.type === 'password') {
      pw.type = 'text';
      btn.classList.remove('show');
      btn.classList.add('hide'); // 눈 감은 아이콘
    } else {
      pw.type = 'password';
      btn.classList.remove('hide');
      btn.classList.add('show'); // 눈 아이콘
    }
  });

    // 로그인 처리
    document.getElementById("login-form").addEventListener("submit", async function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const errorMsg = document.getElementById("errorMsg");
      const loginBtn = document.getElementById("loginBtn");
      errorMsg.textContent = "";

      if (!username || !password) {
        errorMsg.textContent = "아이디와 비밀번호를 입력하세요.";
        return;
      }

      // 중복 제출 방지 + 로딩 표시
      const originalBtnText = loginBtn.textContent;
      loginBtn.disabled = true;
      loginBtn.textContent = "로그인 중...";

      // 5초 타임아웃(네트워크 지연 대비)
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);

      try {
        const res = await fetch("/login-api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, password }),
          signal: controller.signal
        });

        clearTimeout(timeout);

        // 항상 JSON 기대
        const data = await res.json().catch(() => null);

        if (!res.ok || !data || data.success !== true) {
          errorMsg.textContent = (data && data.message) || "로그인 실패";
          return;
        }

        // ✅ 성공 → 백엔드가 내려준 경로 우선, 없으면 /login-view/main
        location.href = (data.redirect && typeof data.redirect === "string") ? data.redirect : "/login-view/main";

      } catch (err) {
        if (err.name === "AbortError") {
          errorMsg.textContent = "요청 시간이 초과되었습니다. 잠시 후 다시 시도하세요.";
        } else {
          errorMsg.textContent = "네트워크 오류가 발생했습니다.";
        }
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = originalBtnText;
      }
    });
  </script>
</body>
</html>
