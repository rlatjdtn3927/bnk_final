<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>IRP가입하기 - 계약등록(가입자격 확인)</title>
</head>
<body>
<!-- 가입자격 확인 -->
  <div class="card">
    <div class="title">가입자격 확인</div>
    
    <div class="row">
      <div class="col">
        <label>IRP 가입자격</label>
        <select id="irpQualType">
          <option value="">선택</option>
          <option value="근로자">근로자</option>
          <option value="자영업자">자영업자</option>
        </select>
      </div>
    </div>
    <!-- 세액공제 전용: 사업자번호 -->
    <div id="taxExtra" class="row">
      <div class="col">
        <label>사업자등록번호</label>
        <div class="row" style="gap:6px">
          <input id="biz1" maxlength="3" style="flex:0 0 90px">
          <input id="biz2" maxlength="2" style="flex:0 0 70px">
          <input id="biz3" maxlength="5" style="flex:0 0 110px">
        </div>
      </div>
    </div>

    <!-- 퇴직금수령 전용 -->
    <div id="retireExtra" class="hidden">
      <label>IRP 가입자격</label>
      <div class="row">
        <div class="col"><label>퇴직일자</label><input id="retireDate" type="date"></div>
        <div class="col"><label>퇴직사유</label><input id="retireReason" placeholder="예: 정년퇴직"></div>
        <div class="col"><label>회사명</label><input id="corpName"></div>
      </div>
      <div class="row">
        <div class="col"><label>퇴직금액</label><input id="severanceAmt" type="number"></div>
        <div class="col"><label>증빙서류 파일명</label><input id="withholdDoc" placeholder="retire-doc.pdf"></div>
      </div>
    </div>
    
	<div style="text-align:right;margin-top:10px">
      <button id="btnNext" class="btn primary">자격확인</button>
    </div>
    <div id="msg" class="err"></div>
  </div>
</body>
</html>
