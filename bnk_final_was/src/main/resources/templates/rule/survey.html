<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>퇴직연금 투자성향 설문 (단계형)</title>
<style>
:root { 
  --w: 720px;
  --brand:#f85151; --brand-700:#e04444;
  --muted:#6b7280; --line:#e5e7eb;
  --card:#fff;
}
  
body{
  font-family: 'Pretendard', sans-serif;
  margin:0;
  padding:0;
  color:#303030;
}

/* 컨테이너 */
.wrap{
  max-width:720px;
  margin:40px auto;
  background:#fff;
  border-radius:16px;
  border: 1px solid #e5e7eb;
  /*box-shadow:0 6px 24px rgba(0,0,0,.08);*/
  padding:28px;
}

/* 제목/설명 */
h1{ 
  font-size:20px; 
  margin:10px 0 8px;
  margin-bottom: 20px;
}
.desc{ 
  color:#6b7280; 
  margin-bottom:18px;
  font-size: 16px;
}

/* 진행바 */
.progress{
  height:8px; border-radius:999px; overflow:hidden;
  background:#eef1f5; margin:16px 0 24px;
}
.bar{
  height:100%; width:0%;
  background:#f85151; transition:width .25s ease;
}

/* 질문 영역 */
.q-title{ font-size:18px; font-weight:600; margin:0 0 14px; }
.opt{
  display:block; padding:12px 14px; margin:8px 0;
  border:1px solid #e5e7eb; border-radius:12px;
  cursor:pointer; transition:.15s;
  background:#fff;
}
.opt:hover{
  border-color:#e3f0fa; background:#f4f9fd;
  box-shadow:0 0 0 4px rgba(244, 249, 253, .8);
}
.opt input{ transform:translateY(1px); margin-right:10px; }
.hint{ font-size:13px; margin-top:4px; }
.summary{
  background:#f9fafb; padding:14px; border-radius:12px;
  border:1px solid #e5e7eb; font-size:14px; margin-top:8px;
}

/* 하단 네비 */
.footer{
  display:flex; justify-content:space-between; align-items:center;
  gap:10px; margin-top:16px;
}
.idx{ font-size:14px; }
.nav{ display:flex; gap:10px; }

/* 버튼 */
button{
  padding:10px 17px; border-radius:12px; border:none;
  cursor:pointer; font-weight:600; font-size:14px;
  margin-top: 10px;
}
.btn{ background:#f85151; color:#fff; }
.btn:hover{ background:#e04444; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.ghost{ background:#eef1f5; color:#111827; }
.ghost:hover{ background:#e5e7eb; }

/* 토스트 */
.toast{
  position:fixed; bottom:15px; left:50%; transform:translateX(-50%);
  background:#424242; color:#fff; padding:13px 14px; border-radius:12px;
  opacity:0; transition:opacity .25s;
}
.toast.show{ opacity:1; }
.toast[aria-live]{ visibility:hidden; }
.toast.show[aria-live]{ visibility:visible; }

.muted { 
  color: var(--muted); 
  font-size: 12px; 
  margin-top: 10px; 
  margin-bottom: 15px;
}

/* 모달 */
.modal{
  position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.35); z-index:1000;
}
.modal-content{
  background:#fff; color:#111827; border-radius:14px;
  padding:20px; width:min(420px, calc(100% - 48px));
  box-shadow:0 12px 30px rgba(0,0,0,.18);
  text-align:center;
}
.modal-content p{ margin:0 0 14px; }
#goStep2{
  background:#f85151; color:#fff; border:none; border-radius:12px;
  padding:10px 16px; font-weight:700; cursor:pointer;
}
#goStep2:hover{ background:#e04444; }

/* 반응형 */
@media (max-width:760px){
  .wrap{ margin: 32px 16px; padding:18px; border-radius:12px; }
  .modal-content{ padding:18px; }
}

.header {
  max-width: 760px;
  margin: 0 auto 12px;
}

.tabs {
  display: flex;
  gap: 80px;
  position: relative;
  padding-left: 16px;
  margin-top: 10px;
}

/* 연한 밑줄 (전체) */
.tabs::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 4px;
  background: #eee;
}

.tab {
  font-size: 16px;
  font-weight: 500;
  color: #999;
  padding-bottom: 6px;
  margin-top: 10px;
  margin-bottom: 5px;
  z-index: 1;
}

/* 활성 탭 */
.tab.active {
  color: #111;
  font-weight: 700;
  margin-left: 20px;
}

/* 활성 탭 밑줄 (검은색) */
.tab.active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;   /* 연한줄과 정확히 겹치도록 */
  height: 4px;
  background: #303030;
  width: 130px;
}

.brand {
  font-size: 22px;
  font-weight: 700;
  margin: 20px auto auto 16px; 
}

.brand .red {
  color: #D93C3C;           /* BNK 빨강 */
  font-weight: 700;
}
</style>
</head>
<body>
  <div class="header">
    <div class="brand"><span class="red">BNK</span> 퇴직연금</div>
    <div class="tabs">
      <span class="tab active">설문하기</span>
      <span class="tab">결과보기</span>
    </div>
  </div>

  <div class="wrap">
    <h1>퇴직연금 투자성향 설문</h1>
    <div class="desc">한 문항씩 답하면 자동으로 다음으로 진행돼요. 체크박스 문항은 <b>다음</b> 버튼을 눌러주세요.</div>
    <div class="progress"><div id="bar" class="bar"></div></div>
    <div id="stage"></div>
    <div class="footer">
      <div class="idx" id="idx"></div>
      <div class="nav">
        <button id="prev" class="ghost" type="button">이전</button>
        <button id="next" class="btn" type="button">다음</button>
      </div>
    </div>
    <div class="muted">진행 중 데이터는 브라우저에 임시 저장됩니다.</div>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite">저장됨</div>

  <div id="resultModal" class="modal" style="display:none;">
    <div class="modal-content">
      <p>투자성향분석이 완료되었습니다.</p>
      <button id="goStep2">확인</button>
    </div>
  </div>
  
  <script>
    // --- 설문 정의 ---
    const QUESTIONS = [
      { id:"q1", type:"radio", title:"수입원 전망", options:[
        {label:"향후 증가 예상",value:"5"},
        {label:"향후 감소 예상",value:"3"},
        {label:"일정수입 없음",value:"0"}
      ]},
      { id:"q2", type:"radio", title:"총 자산 대비 투자상품 금액", options:[
        {label:"1억 원 이상",value:"5"},
        {label:"5천만 원~1억 원 미만",value:"4"},
        {label:"3천만 원~5천만 원 미만",value:"3"},
        {label:"3천만 원 미만",value:"1"}
      ]},
      { id:"q3", type:"radio", title:"총 자산 중 투자상품 비중", options:[
        {label:"30% 이상 ",value:"5"},
        {label:"20% 이상 ",value:"4"},
        {label:"10% 이상 ",value:"3"},
        {label:"10% 미만 ",value:"1"}
      ]},
      { id:"q4", type:"radio", title:"금융투자상품에 대한 지식 수준", options:[
        {label:"거의 알지 못함 ",value:"1"},
        {label:"일정 부분 이해 ",value:"3"},
        {label:"구조 및 위험 깊이 이해 ",value:"5"},
        {label:"파생상품까지 이해 ",value:"10"}
      ]},
      { id:"q5", type:"radio", title:"투자원금에 손실이 발생할 경우 감수할 수 있는 수준", options:[
        {label:"투자원금은 반드시 보전되어야 한다 ",value:"0"},
        {label:"원금 기준 10% 미만 손실 감수 ",value:"3"},
        {label:"원금 기준 20% 미만 손실 감수 ",value:"5"},
        {label:"기대이익 초과면 20% 이상 전액 손실 감수 ",value:"10"}
      ]},
      { id:"q6", type:"radio", title:"손실 감수 수준", options:[
        {label:"원금보장 선호 ",value:"0"},
        {label:"10% 손실 감수 가능 ",value:"3"},
        {label:"20% 손실 감수 가능 ",value:"5"},
        {label:"20% 이상 손실 감수 가능 ",value:"10"}
      ]},
      { id:"q7", type:"radio", title:"목표 투자 수익 기대 수준", options:[
        {label:"연 3% 내외 ",value:"1"},
        {label:"연 6% 내외 ",value:"3"},
        {label:"연 10% 내외 ",value:"5"},
        {label:"연 10% 이상 ",value:"10"}
      ]},
      { id:"q8", type:"radio", title:"투자예정 기간", options:[
        {label:"6개월 미만 ",value:"1"},
        {label:"6개월~1년 미만 ",value:"2"},
        {label:"1년~2년 미만 ",value:"3"},
        {label:"2년~3년 미만 ",value:"4"},
        {label:"3년 이상 ",value:"5"}
      ]},
      { id:"q9", type:"checkbox", title:"투자 경험 있는 상품 ", options:[
        {label:"예적금·국채·지방채·MMF·CMA ",value:"2"},
        {label:"금융채·우량채·채권형 펀드·원금보장형 ELF ",value:"2"},
        {label:"중위등급 회사채·혼합형 펀드 ",value:"2"},
        {label:"주식·원금비보장 ELF·주식형 펀드 ",value:"2"},
        {label:"선물옵션·파생상품형 펀드·신용거래 ",value:"2"}
      ]},
      { id:"q10", type:"radio", title:"투자 경험 기간", options:[
        {label:"3년 이상 ",value:"5"},
        {label:"1~3년 미만 ",value:"4"},
        {label:"1년 미만 ",value:"2"},
        {label:"없음 ",value:"0"}
      ]},
      { id:"q11", type:"radio", title:"파생상품·원금비보장펀드 경험", options:[
        {label:"3년 이상 ",value:"10"},
        {label:"1~3년 미만 ",value:"7"},
        {label:"1년 미만 ",value:"4"},
        {label:"없음 ",value:"0"}
      ]},
      { id:"q12", type:"radio", title:"디폴트옵션 설정 여부", options:[
        {label:"예, 추천 포트폴리오 설정",value:"0"},
        {label:"아니요, 별도 지정",value:"0"}
      ]},
      { id:"q13", type:"static", title:"[정식 보고서·문서용 고지문]", html:`
        ※ 본 설문은 퇴직연금 자산 운용에 참고하기 위한 자료로서,<br>
        투자 성향에 따른 권유가 이루어지더라도 상품 선택 및 결과에 대한 최종 책임은 가입자 본인에게 있으며,<br>
        운용성과에 따라 손실이 발생할 수 있습니다.
      `}
    ];

    const STORAGE_KEY = 'retire_survey_state_v1';
    
    // 페이지 로드 시 localStorage 초기화
    localStorage.removeItem(STORAGE_KEY);
    
    let state = loadState() || { index: 0, answers: {} };

    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    function loadState(){ try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){ return null; } }
    function showToast(msg='저장됨'){
      const t=document.getElementById('toast');
      t.textContent=msg; t.classList.add('show');
      setTimeout(()=>t.classList.remove('show'), 1200);
    }

    function render(){
      const q = QUESTIONS[state.index];
      const total = QUESTIONS.length;
      document.getElementById('bar').style.width = Math.round((state.index/(total-1))*100) + '%';
      document.getElementById('idx').textContent = `${Math.min(state.index+1,total)} / ${total}`;
      const stage = document.getElementById('stage');
      if(!q){ stage.innerHTML = '<p>문항을 찾을 수 없습니다.</p>'; return; }
      const prevBtn = document.getElementById('prev');
      const nextBtn = document.getElementById('next');
      prevBtn.disabled = state.index === 0;
      nextBtn.style.display = (q.type === 'checkbox' || q.type === 'static') ? 'inline-block' : 'none';
      nextBtn.textContent = (state.index === total-1) ? '제출' : '다음';
      if(q.type === 'static'){
        stage.innerHTML = `<div class="q"><div class="q-title">${q.title}</div><div class="summary">${q.html}</div></div>`;
        return;
      }
      if(q.type === 'radio' || q.type === 'checkbox'){
        const saved = state.answers[q.id] ?? (q.type==='checkbox' ? [] : null);
        const optsHtml = q.options.map((opt,i)=>{
          const id=`${q.id}_${i}`;
          const checked=(q.type==='radio')?(saved===opt.value):(Array.isArray(saved)&&saved.includes(opt.value));
          return `<label class="opt" for="${id}"><input id="${id}" name="${q.id}" type="${q.type==='radio'?'radio':'checkbox'}" value="${opt.value}" ${checked?'checked':''}/> ${opt.label}</label>`;
        }).join('');
        const hint=q.hint?`<div class="hint">${q.hint}</div>`:'';
        stage.innerHTML=`<div class="q"><div class="q-title">${q.title}</div>${optsHtml}${hint}</div>`;
        const inputs=stage.querySelectorAll('input');
        inputs.forEach(inp=>{
          inp.addEventListener('change',()=>{
            if(q.type==='radio'){ state.answers[q.id]=inp.value; saveState(); showToast('저장됨'); goNext();}
            else{ const values=Array.from(stage.querySelectorAll('input:checked')).map(i=>i.value); state.answers[q.id]=values; saveState(); showToast('저장됨'); nextBtn.disabled=values.length===0;}
          });
        });
        if(q.type==='checkbox'){ const values=Array.isArray(saved)?saved:[]; nextBtn.disabled=values.length===0;}
      }
    }

    function goPrev(){ if(state.index>0){ state.index--; saveState(); render(); } }
    function goNext(){ const isLast=state.index===(QUESTIONS.length-1); if(isLast){ submitAll(); return; } state.index++; saveState(); render(); }

    async function submitAll(){
    	  const payload = {
    	    surveyCode: 'RETIRE-2025-01',
    	    answers: QUESTIONS.filter(q => q.type !== 'static').map(q => {
    	      const ans = state.answers[q.id];
    	      if (q.type === 'checkbox') {
    	        return { id: q.id, values: Array.isArray(ans) ? ans : [] };
    	      } else {
    	        return { id: q.id, value: ans ?? null };
    	      }
    	    }),
    	    meta: { userAgent: navigator.userAgent, submittedAt: new Date().toISOString() }
    	  };

    	  try {
    	    const res = await fetch('/survey-submit-view', {
    	      method: 'POST',
    	      headers: { 'Content-Type': 'application/json' },
    	      body: JSON.stringify(payload)
    	    });

    	    if (res.ok) {
    	      // 서버에서 Redirect(FlashAttribute → /survey-result) 시킴
    	      // fetch는 리다이렉트를 처리 못하니까 수동으로 이동
    	      window.location.href = '/survey-result';
    	    } else {
    	      alert('제출 실패: ' + res.status);
    	    }
    	  } catch (err) {
    	    alert('제출 중 오류 발생: ' + err.message);
    	  }
    	}

    document.getElementById('prev').addEventListener('click', goPrev);
    document.getElementById('next').addEventListener('click', ()=>{
      const q=QUESTIONS[state.index];
      if(!q) return;
      if(q.type==='checkbox'||q.type==='static') return goNext();
    });
    window.addEventListener('keydown',(e)=>{
      const q=QUESTIONS[state.index];
      if(!q) return;
      if(e.key==='ArrowLeft') goPrev();
      if(e.key==='ArrowRight'&&(q.type==='checkbox'||q.type==='static')) goNext();
    });

    render();
  </script>
</body>
</html>
