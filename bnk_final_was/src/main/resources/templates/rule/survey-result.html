<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>투자성향 분석 결과</title>
<style>
  body{
  font-family: 'Pretendard', sans-serif;
  margin:0;
  padding: 0;
  color: #303030;
  }
  
  /* 카드 위 제목 */
.card-title {
  max-width:560px;        /* 카드 폭과 맞춤 */
  margin:30px auto 16px;     /* 가운데 정렬 + 카드와 간격 */
  padding:0 14px;
  font-size:22px;
  font-weight:700;
  text-align:left;        /* 왼쪽 정렬 (가운데 정렬 원하면 center로 변경) */
}
  
  /* 카드 컨테이너 */
.card{
  position:relative;
  display:block;
  max-width:560px;
  width:92%;
  width:calc(100% - 60px);/* 화면 전체에서 좌우 20px씩 여백 */
  margin:26px auto;
  padding:28px 28px 22px;
  background:#fff;
  border:1px solid #eee;
  border-radius:20px;
  /*box-shadow:0 10px 24px rgba(17,24,39,.06);*/
}

/* 제목 */
h2{
  margin:8px 0 18px;
  font-size:20px;               
  font-weight:700;
  color:#111827;
}

/* key-value 스타일 행 */
.card p{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  margin:10px 0;
  font-size:15px;
  line-height:1.5;
  color:#6b7280;                 /* 라벨색 */
}
/* 값 강조 */
.card p strong{
  font-weight:700;
  color:#111827;
}

/* 점수 라인 전체 */
.score-line {
  display: flex;
  justify-content: space-between;  /* 좌우 끝 정렬 */
  align-items: center;
  font-size: 15px;
  color: #6b7280;
  margin: 10px 0;
}

/* 숫자와 '점' 묶음 */
.score-wrap {
  display: inline-flex;
  align-items: baseline;
  gap: 5px; /* 숫자와 '점' 사이 최소 간격 */
}

.score-wrap strong {
  font-size: 18px;
  font-weight: 700;
  color: #111827;
}

/* 설명문 */
.desc{
  font-size:14px;
  color:#4b5563;
  line-height:1.7;
  margin-top:6px;
}

/* 구분선 */
hr{
  height:1px;
  border:none;
  background:#eee;
  margin:24px 0 20px;
}

/* 오류 메시지 */
.error{
  margin-top:8px;
  font-size:14px;
  color:#d9534f;
  font-weight:700;
}

/* 버튼 영역 (세그먼트 탭 느낌) */
.actions{
  margin-top:18px;
  display:flex;
  justify-content:center;   /* 버튼 가운데 정렬 */
  gap:10px;
  flex-wrap:wrap;
}

/* 버튼 */
.link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:88px;
  padding:10px 14px;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
  font-size:14px;
  background:#fff;
  border:1px solid #e5e7eb;
  color:#111827;
  box-shadow:none;
  transition:transform .08s ease, background .2s ease, border-color .2s ease;
}
.link:hover{ transform:translateY(-1px); }

/* 첫 버튼 강조 */
.actions .link:first-child{
  background:#fff3f3;           
  border-color:#ffd6d6;
}

/* 나머지 버튼 hover */
.actions .link:not(:first-child):hover{
  background:#f9fafb;
}

/* 모바일 대응 */
@media (max-width:760px){
  .card{ padding:22px 18px; }
  h2{ font-size:18px; }
  .card p{ font-size:14px; }
  .link{ min-width:auto; padding:9px 12px; font-size:13px; }
}

.header {
  max-width: 760px;
  margin: 0 auto 12px;
}

.header h2 {
  font-size: 22px;
  font-weight: 700;
  margin: 20px 0 12px 16px;
}

.tabs {
  display: flex;
  gap: 60px;
  position: relative;
  padding-left: 16px;
  margin-top: 10px;
}

/* 연한 밑줄 (전체) */
.tabs::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 4px;
  background: #eee;
}

.tab {
  position: relative;
  font-size: 16px;
  font-weight: 500;
  color: #999;
  padding-bottom: 6px;
  margin-top: 10px;
  margin-bottom: 5px;
  z-index: 1;
  margin-left: 20px;
}

/* 활성 탭 */
.tab.active {
  color: #111;
  font-weight: 700;
}

/* 활성 탭 밑줄 (검은색) */
.tab.active::after {
  content: "";
  position: absolute;
  left: 50%;
  right: 0;
  transform: translateX(-50%); /* 가운데 정렬 */
  bottom: -4px;   /* 연한줄과 정확히 겹치도록 */
  height: 4px;
  background: #303030;
  width: 130px;
}

</style>
</head>
<body>
  <div class="header">
  <h2>투자 성향 분석</h2>
    <div class="tabs">
      <span class="tab">설문하기</span>
      <span class="tab active">결과보기</span>
    </div>
  </div>

  <h2 class="card-title">나의 투자성향 분석 결과는?</h2>
  <div class="card">
    <h2>📊 투자성향 분석 결과</h2>

    <!-- 점수 & 성향 -->
    <p class="score-line">
  총 점수: 
  <span class="score-wrap">
    <strong th:text="${score}">0</strong>
    <span>점</span>
  </span>
</p>
    <p>분류된 투자성향: <strong th:text="${type}">-</strong></p>

    <hr/>

    <!-- 오류가 없을 때만 성향 설명 표시 -->
    <div th:if="${error == null}">
      <div th:switch="${type}">
        <div th:case="'공격투자형'">
          <p class="desc">📈 높은 수익을 추구하며 위험도 감수 가능한 투자자입니다.</p>
        </div>
        <div th:case="'적극투자형'">
          <p class="desc">📊 적절한 위험을 감수하면서 수익을 기대하는 유형입니다.</p>
        </div>
        <div th:case="'위험중립형'">
          <p class="desc">⚖️ 안정성과 수익을 균형 있게 추구하는 투자자입니다.</p>
        </div>
        <div th:case="'안정추구형'">
          <p class="desc">🔒 원금 손실을 최소화하고자 하는 보수적인 성향입니다.</p>
        </div>
        <div th:case="'안정형'">
          <p class="desc">🛡 가능한 한 손실 없는 투자를 선호하는 초보 투자자입니다.</p>
        </div>
        <div th:case="*">
          <p class="desc">❓ 분석 결과가 존재하지 않습니다.</p>
        </div>
      </div>
    </div>

    <!-- 오류 메시지 -->
    <p class="error" th:if="${error}" th:text="${error}"></p>

    <!-- 버튼들 -->
    <div class="actions">
      <a class="link" th:if="${error == null}" th:href="@{/purchase/trade/getProfileType}">확인</a>

      <!-- 다시하기 & 메인 -->
      <a class="link" href="/survey-start">다시하기</a>
      <a class="link" href="/main">메인으로</a>
    </div>
  </div>
</body>
</html>
