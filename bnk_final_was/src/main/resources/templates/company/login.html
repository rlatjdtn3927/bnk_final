<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>기업 로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background: linear-gradient(to right, #e3f2fd, #ffffff);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-container {
      background: white;
      padding: 40px 50px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 400px;
      box-sizing: border-box;
    }

    .login-container h2 {
      margin-bottom: 24px;
      color: #1976d2;
      font-size: 26px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #1976d2;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #115293;
    }

    .error-message {
      color: #d32f2f;
      margin-top: 15px;
      text-align: center;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>기업 로그인</h2>
    <form id="loginForm">
		<div class="form-group">
		  <label for="loginId">아이디</label>
		  <input type="text" id="loginId" name="loginId" autocomplete="username" required>
		</div>
		
		<div class="form-group">
		  <label for="password">비밀번호</label>
		  <input type="password" id="password" name="password" autocomplete="current-password" required>
		</div>

      <button type="submit">로그인</button>

      <div id="error" class="error-message"></div>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();

      const loginId = document.getElementById('loginId').value;
      const password = document.getElementById('password').value;

      const response = await fetch('/company/auth/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        credentials: 'include',
        body: JSON.stringify({ loginId, password })
      });

      if (response.ok) {
        window.location.href = '/company'; // 성공 시 메인으로
      } else {
        const errorMsg = await response.text();
        document.getElementById('error').innerText = errorMsg;
      }
    });
  </script>

</body>
</html>
