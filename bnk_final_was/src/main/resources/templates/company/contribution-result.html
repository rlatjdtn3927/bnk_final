<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>DC 부담금 예정 등록 - 결과확인 | BNK 퇴직연금</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    @charset "UTF-8";

    :root {
      --pri: #c82020; --pri-h: #b01b1b; --blue: #0052cc;
      --ink: #172b4d; --ink-light: #42526e; --mut: #6b7280;
      --bg: #f4f5f7; --card: #ffffff;
      --line: #dfe1e6; --line-light: #e9ebf0;
      --ok: #00875a; --ok-light: #e3fcef; --err: #de350b;
      --shadow-sticky: 0 -2px 8px rgba(9, 30, 66, .1);
      --sticky-h: 72px;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:var(--bg); color:var(--ink);
      font-family:Pretendard, system-ui, -apple-system, Segoe UI, Arial, sans-serif;
    }
    
    .wrap {
      max-width: 100%; margin: 0 auto;
      padding-bottom: calc(var(--sticky-h) + 24px);
    }
    .page-head {
      background: var(--card); padding: 24px 32px;
      border-bottom: 1px solid var(--line);
    }
    .page-head h1 {margin: 0 0 8px; font-size: 24px; font-weight: 700;}
    .page-head .desc {margin: 0; color: var(--ink-light); font-size: 15px;}
    
    .card {
      background: var(--card); padding: 24px 32px;
      margin-bottom: 10px; border-bottom: 1px solid var(--line);
    }
    .card:last-of-type { border-bottom: none; }
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-bottom: 16px;
      border-bottom: 1px solid var(--line-light);
    }
    .card-head h2 { margin: 0; font-size: 17px; font-weight: 600; color: var(--blue); }

    .stepper{display:flex;gap:12px;align-items:center;padding:16px 0}
    .step{display:flex;align-items:center;gap:8px}
    .dot{
      width:24px;height:24px;border-radius:50%; border:2px solid var(--line);
      color:var(--mut); font-size: 13px; display:grid;place-items:center;font-weight:600;background:#fff
    }
    .step.is-active .dot{border-color:var(--pri);color:#fff;background:var(--pri)}
    .step.is-done .dot{border-color:var(--ok);color:var(--ok);background:#e3fcef}
    .step .label{font-size:15px;color:var(--mut);font-weight:500;}
    .step.is-active .label {color:var(--pri);font-weight:700;}
    .step.is-done .label {color:var(--ok);}
    .bar{flex:1;height:2px;background:var(--line)}
    
    .stats-grid {
      display: flex; align-items: stretch; background: #fafbfc;
      border: 1px solid var(--line); border-radius: 6px;
    }
    .stat {
      flex: 1; padding: 16px 20px; text-align: center;
    }
    .stat + .stat { border-left: 1px solid var(--line); }
    .stat .label { font-size: 14px; color: var(--mut); margin-bottom: 8px; }
    .stat .value { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .value.ok { color: var(--ok); }
    
    .actions-bar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .input {
      padding: 7px 12px; border:1px solid var(--line); border-radius:4px;
      background:#fff; font-size:14px;
    }
    
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line);
      font-weight: 500; cursor: pointer; text-decoration: none; font-size: 14px;
    }
    .btn-primary {background: var(--pri); color: #fff; border-color: var(--pri);}
    .chip {
      display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1px solid var(--line);
      border-radius: 4px; padding: 6px 10px; font-weight: 500; font-size: 13px;
    }
    
    .table-outer {
      border: 1px solid var(--line); border-radius: 6px;
      background: #fff; overflow: hidden;
    }
    .table-scroll {overflow: auto; max-width: 100%;}
    .tbl {
      width: 100%; border-collapse: collapse; min-width: 800px;
      font-size: 14px; line-height: 1.5;
    }
    .tbl th, .tbl td {
      padding: 12px 14px; border-bottom: 1px solid var(--line-light);
      text-align: left; vertical-align: middle;
    }
    .tbl thead th {
      background: #fafbfc; color: var(--ink-light); font-weight: 500; font-size: 13px;
      border-bottom: 1px solid var(--line);
    }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover {background: #f0f6ff;}
    .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
    .badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:12px;font-weight:500}
    .badge.ok{background:var(--ok-light);color:var(--ok);border:1px solid #abe2c8;}

    .note{font-size:14px;padding:12px;background:#fafbfc;border-radius:4px}
    .note.err{background:#fffbe6;color:#b77300;border:1px solid #ffd88a;}
    
    .sticky-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      height: var(--sticky-h); display: flex; align-items: center; justify-content: space-between;
      background: rgba(255, 255, 255, .8); backdrop-filter: blur(8px);
      border-top: 1px solid var(--line); box-shadow: var(--shadow-sticky);
      padding: 0 32px;
    }
    .sticky-bar .summary { display: flex; align-items: center; gap: 24px; font-size: 15px; }
    .sticky-bar .summary .item .label { color: var(--mut); }
    .sticky-bar .summary .item b { color: var(--pri); font-size: 18px; margin-left: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>DC 부담금 예정 등록 </span></h1>
      <p class="desc">검증이 완료된 부담금 내역을 확인하고, 출금계좌 지정 후 예정 등록을 실행합니다.</p>
    </header>

    <section class="card">
      <div class="stepper">
        <div class="step is-done"><div class="dot">✔</div><div class="label">정보입력</div></div>
        <div class="bar"></div>
        <div class="step is-done"><div class="dot">✔</div><div class="label">검증</div></div>
        <div class="bar"></div>
        <div class="step is-active"><div class="dot">3</div><div class="label">결과확인/실행</div></div>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>검증 결과 요약</h2>
      </div>
      <div class="stats-grid">
        <div class="stat"><div class="label">총 건수</div><div id="totCnt" class="value">0</div></div>
        <div class="stat"><div class="label">정상 건수</div><div id="okCnt" class="value ok">0</div></div>
        <div class="stat"><div class="label">정상 합계 금액</div><div id="okSum" class="value">0원</div></div>
      </div>
    </section>
    
    <section class="card">
       <div class="card-head">
        <h2>등록 대상 목록</h2>
        <div class="actions-bar">
          <label class="chip" for="acctSel">출금 계좌</label>
          <select id="acctSel" class="input" style="min-width:260px"></select>
          <span id="acctBal" class="chip">잔액: -원</span>
        </div>
      </div>
      <div class="table-outer">
        <div class="table-scroll">
          <table class="tbl">
            <thead>
              <tr>
                <th style="width:60px;">
                  <input type="checkbox" id="chkAll" title="전체선택">
                </th>
                <th>회원명</th>
                <th class="num">부담금액</th>
                <th style="width:120px;">상태</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
      <div id="infoBox" style="margin-top:16px;"></div>
    </section>

  </div>

  <footer class="sticky-bar">
    <div class="summary">
      <div class="item"><span class="label">선택 건수:</span><b id="selCnt">0</b></div>
      <div class="item"><span class="label">선택 합계:</span><b id="selSum">0원</b></div>
    </div>
    <button id="execBtn" class="btn btn-primary" style="padding: 12px 24px; font-size: 16px; font-weight: 700;" disabled>예정 등록 실행</button>
  </footer>

  <script>
    (function(){
      // --- 기존 로직과 동일 ---
      const qs = new URLSearchParams(location.search);
      const batchId = Number(qs.get('batchId'));
      const chipBatch = document.getElementById('chip-batch');
      const okCnt = document.getElementById('okCnt');
      const totCnt = document.getElementById('totCnt');
      const okSum = document.getElementById('okSum');
      const batchStatus = document.getElementById('batchStatus');
      const tbody = document.getElementById('tbody');
      const infoBox = document.getElementById('infoBox');

      const acctSel = document.getElementById('acctSel');
      const acctBal = document.getElementById('acctBal');
      const execBtn = document.getElementById('execBtn');
      const chkAll = document.getElementById('chkAll');
      const selCnt = document.getElementById('selCnt');
      const selSum = document.getElementById('selSum');

      chipBatch.textContent = batchId || 'N/A';
      if (!batchId) {
        alert('batchId가 없습니다. 업로드부터 다시 진행해 주세요.');
        location.href = '/company/dc/contribution/upload-page';
        return;
      }

      const fmtMoney = n => Number(n||0).toLocaleString() + '원';
      const isOk = r => (r.validationStatus||'').toUpperCase() === 'OK';

      let rows = [];
      let selected = new Set();
      let sourceAccountId = null;
      
      function setInfo(type, msg){
          infoBox.className = `note ${type}`;
          infoBox.textContent = msg;
          infoBox.style.display = 'block';
      }
      
      function clearInfo() {
    	  infoBox.className = 'note';
    	  infoBox.textContent = '';
    	  infoBox.style.display = 'none';
    	}

      function updateAcctBalance(){
        const opt = acctSel.selectedOptions[0];
        const bal = opt ? Number(opt.dataset.balance || 0) : 0;
        acctBal.textContent = `잔액: ${fmtMoney(bal)}`;
      }

      function updateSelectionUI(){
        selCnt.textContent = `${selected.size}건`;
        let sum = 0;
        rows.forEach(r => { if (selected.has(r.itemId)) sum += Number(r.amount||0); });
        selSum.textContent = fmtMoney(sum);
        execBtn.disabled = !(selected.size && (acctSel.value || sourceAccountId));
        chkAll.checked = rows.length > 0 && selected.size === rows.length;
      }

      function renderTable(){
        if (!rows.length){
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--mut);padding:32px">등록 가능한 대상이 없습니다.</td></tr>';
          return;
        }
        const frag = document.createDocumentFragment();
        rows.forEach(r=>{
          const tr = document.createElement('tr');
          const amt = Number(r.amount||0).toLocaleString();
          const checked = selected.has(r.itemId) ? 'checked' : '';
          tr.innerHTML = `
            <td style="text-align:center;"><input type="checkbox" data-id="${r.itemId}" ${checked}></td>
            <td>${r.memberName}</td>
            <td class="num">${amt}원</td>
            <td><span class="badge ok">정상</span></td>
            <td>${r.remarks || '-'}</td>`;
          frag.appendChild(tr);
        });
        tbody.innerHTML = '';
        tbody.appendChild(frag);

        tbody.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
          cb.addEventListener('change', e=>{
            const id = Number(e.target.dataset.id);
            if (e.target.checked) selected.add(id); else selected.delete(id);
            updateSelectionUI();
          });
        });
      }

      async function loadSummaryAndItems(){
    	  try{
    	    const res = await fetch(`/company/dc/contribution/result/${batchId}`);
    	    const data = await res.json();
    	    if (!res.ok) throw new Error(data.message || '검증 조회 실패');

    	    okCnt.textContent     = data.okCount ?? 0;
    	    totCnt.textContent    = data.totalRecords ?? 0;
    	    okSum.textContent     = fmtMoney(data.totalOkAmount);
    	    batchStatus.textContent = data.batchStatus ?? 'UNKNOWN';

    	    rows = (data.items || [])
    	      .filter(isOk)
    	      .map(r => ({
    	        ...r,
    	        memberName: r.memberName ?? r.name ?? r?.dcMember?.name ?? r?.member?.name ?? '-',
    	        remarks: r.remarks ?? r.errorMessage ?? ''
    	      }));

    	    selected = new Set(rows.map(r => r.itemId));
    	    renderTable();
    	    updateSelectionUI();
    	    setInfo('', '등록 대상을 확인하고 출금계좌 지정 후, 하단의 등록 실행 버튼을 클릭하세요.');
    	  } catch (e) {
    	    setInfo('err', '결과 조회 실패: ' + e.message);
    	  }
    	}


      async function fetchAndSetSourceAccount(){
    	  try{
    	    const res = await fetch('/company/dc/contribution/source-accounts');
    	    const data = await res.json();
    	    if (!res.ok) throw new Error(data.message || '출금 계좌 조회 실패');

    	    const accounts =
    	      (Array.isArray(data.accounts) && data.accounts) ||
    	      (Array.isArray(data.rows) && data.rows) ||
    	      (data.data && Array.isArray(data.data.accounts) && data.data.accounts) ||
    	      (data.data && Array.isArray(data.data.rows) && data.data.rows) ||
    	      [];

    	    if (accounts.length === 0) {
    	      acctSel.innerHTML = '<option value="">등록된 출금계좌가 없습니다</option>';
    	      acctSel.disabled = true;
    	    } else {
    	      const a = accounts[0];
    	      sourceAccountId = Number(a.accountId);
    	      const bank = a.bankName ? ` (${a.bankName})` : '';
    	      acctSel.innerHTML =
    	        `<option value="${a.accountId}" data-balance="${Number(a.balance) || 0}">
    	           ${a.accountNo}${bank}
    	         </option>`;
    	      acctSel.disabled = true; // 단일 계좌 고정이면 유지
    	    }

    	    updateAcctBalance();
    	    updateSelectionUI();
    	  } catch (e) {
    	    acctSel.innerHTML = '<option value="">계좌 조회 실패</option>';
    	    acctSel.disabled = true;
    	    setInfo('err', '출금계좌 조회에 실패했습니다.');
    	  }
    	}

      
      async function executeRegistration(){
    	  if (!Number.isFinite(batchId) || batchId <= 0) {
    	    alert('배치 정보가 없습니다. 업로드부터 다시 진행해 주세요.');
    	    return;
    	  }
    	  if (!confirm(`부담금 예정 등록 검증 통과 항목을 모두 확정하시겠습니까?`)) return;

    	  execBtn.disabled = true;
    	  const prevText = execBtn.textContent;
    	  execBtn.textContent = '확정 처리 중...';
    	  clearInfo();

    	  try {
    	    const body = new URLSearchParams({ batchId: String(batchId) });
    	    const res = await fetch('/company/dc/contribution/confirm', {
    	      method: 'POST',
    	      headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
    	      body
    	    });

    	    const result = await res.json().catch(() => ({}));
    	    if (!res.ok || result.ok === false) {
    	      throw new Error(result.message || '확정 처리에 실패했습니다.');
    	    }

    	    alert('부담금 예정 등록이 완료되었습니다.\n결과 조회 및 입금 현황 페이지로 이동합니다.');
    	    location.href = '/company/dc/contribution/payable-list-page';
    	  } catch (e) {
    	    setInfo('err', `실행 중 오류가 발생했습니다: ${e.message}`);
    	  } finally {
    	    execBtn.textContent = prevText || '예정 등록 실행';
    	    execBtn.disabled = false;
    	  }
    	}



      acctSel.addEventListener('change', updateAcctBalance);
      chkAll.addEventListener('change', (e)=>{
        const isChecked = e.target.checked;
        if (isChecked) selected = new Set(rows.map(r=>r.itemId));
        else selected.clear();
        tbody.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = isChecked);
        updateSelectionUI();
      });
      execBtn.addEventListener('click', executeRegistration);

      loadSummaryAndItems();
      fetchAndSetSourceAccount();
    })();
  </script>
</body>
</html>
