<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>DC 부담금 납입 - 검증 결과</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { --primary:#0052cc; --border:#dfe1e6; --text:#172b4d; --muted:#5e6c84; --bg:#fafbfc; --white:#fff; --danger:#de350b; --ok:#00875a; }
    body{font-family:Pretendard, system-ui, -apple-system, Segoe UI, Arial, sans-serif;background:var(--bg);margin:0;padding:40px 20px;color:var(--text)}
    .container{max-width:860px;margin:0 auto;background:var(--white);border-radius:12px;box-shadow:0 4px 10px rgba(9,30,66,.12);padding:28px}
    h2{margin:0 0 18px;font-size:22px;font-weight:700}.desc{margin-top:-6px;color:var(--muted);font-size:14px}.hr{height:1px;background:var(--border);margin:18px 0 24px}
    .stats{display:flex;gap:20px;margin-bottom:20px}.stat-box{flex:1;background:var(--bg);border-radius:8px;padding:14px;text-align:center}
    .stat-label{font-size:14px;color:var(--muted);margin-bottom:6px}.stat-value{font-size:20px;font-weight:700}
    .ok{color:var(--ok)}.err{color:var(--danger)}
    table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}th,td{border:1px solid var(--border);padding:8px 10px}th{background:var(--bg);font-weight:600}
    .actions{margin-top:24px;display:flex;gap:10px}.btn{flex:1;padding:12px;font-size:16px;font-weight:600;border-radius:10px;cursor:pointer;text-align:center;border:0}
    .btn-primary{background:var(--primary);color:#fff}.btn-danger{background:var(--danger);color:#fff}.btn:disabled{filter:grayscale(.35) brightness(.9);cursor:not-allowed}
  </style>
</head>
<body>
  <div class="container">
    <h2>DC 부담금 납입 - 검증 결과</h2>
    <p class="desc">업로드한 데이터의 검증 결과를 확인한 후, 이상이 없으면 납입을 확정하세요.</p>
    <div class="hr"></div>

    <div class="stats">
      <div class="stat-box"><div class="stat-label">정상 건수</div><div id="success-count" class="stat-value ok">0</div></div>
      <div class="stat-box"><div class="stat-label">오류 건수</div><div id="error-count" class="stat-value err">0</div></div>
      <div class="stat-box"><div class="stat-label">총 건수</div><div id="total-count" class="stat-value">0</div></div>
    </div>

    <table>
      <thead>
        <tr>
          <th>회원명</th>
          <th>금액</th>
          <th>상태</th>
          <th>사유</th>
        </tr>
      </thead>
      <tbody id="result-body">
        <tr><td colspan="4" style="text-align:center; color:var(--muted);">결과를 불러오는 중...</td></tr>
      </tbody>
    </table>

    <div class="actions">
      <button id="confirm-btn" class="btn btn-primary" disabled>납입 확정</button>
      <button id="cancel-btn" class="btn btn-danger">취소</button>
    </div>
  </div>

  <script>
    (function(){
      const qs = new URLSearchParams(location.search);
      const batchId = Number(qs.get('batchId'));
      const successCountEl = document.getElementById('success-count');
      const errorCountEl   = document.getElementById('error-count');
      const totalCountEl   = document.getElementById('total-count');
      const resultBody     = document.getElementById('result-body');
      const confirmBtn     = document.getElementById('confirm-btn');
      const cancelBtn      = document.getElementById('cancel-btn');

      if (!batchId) {
        alert('batchId가 없습니다. 업로드부터 다시 진행해 주세요.');
        location.href = '/company/dc/contribution/upload-page';
        return;
      }

      async function fetchAndRender(){
        try{
          const res = await fetch('/company/dc/contribution/validate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ batchId })
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.message || '검증 처리 실패');

          // DTO 스펙: { okCount, errorCount, totalRecords, items:[{ amount, validationStatus, errorMessage, dcMember:{name}}], ... }
          const ok  = Number(data.okCount || 0);
          const err = Number(data.errorCount || 0);
          const tot = Number(data.totalRecords || (Array.isArray(data.items) ? data.items.length : 0));
          successCountEl.textContent = ok;
          errorCountEl.textContent   = err;
          totalCountEl.textContent   = tot;

          const rows = Array.isArray(data.items) ? data.items : [];
          if (rows.length === 0) {
            resultBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#de350b;">결과 데이터가 없습니다.</td></tr>';
          } else {
            resultBody.innerHTML = '';
            rows.forEach(row => {
              const name   = (row.dcMember && row.dcMember.name) ? row.dcMember.name : '(알 수 없는 가입자)';
              const amount = Number(row.amount || 0).toLocaleString();
              const stat   = row.validationStatus || '-';
              const reason = row.errorMessage || '-';
              const tr = document.createElement('tr');
              tr.innerHTML = `<td>${name}</td><td>${amount}원</td><td>${stat}</td><td>${reason}</td>`;
              resultBody.appendChild(tr);
            });
          }

          // 오류 0건이면 확정 버튼 활성화
          confirmBtn.disabled = err > 0;

        } catch (e) {
          alert('결과 조회 실패: ' + e.message);
          resultBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color:#de350b;">결과 조회 중 오류 발생</td></tr>';
        }
      }

      confirmBtn.addEventListener('click', async () => {
    	  if (!confirm('납입을 확정하시겠습니까? 한번 확정하면 되돌릴 수 없습니다.')) return;

    	  const origText = confirmBtn.textContent;
    	  confirmBtn.disabled = true;
          cancelBtn.disabled = true; // 취소 버튼도 함께 비활성화
    	  confirmBtn.textContent = '확정 처리 중...';

    	  try {
    	    const res = await fetch(`/company/dc/contribution/confirm?batchId=${encodeURIComponent(batchId)}`, {
    	      method: 'POST'
    	    });

    	    const text = await res.text();
    	    const data = (() => { try { return JSON.parse(text); } catch { return { message: text }; } })();

    	    if (!res.ok) throw new Error(data.message || '확정 실패');

            // [수정] 성공 시 처리
    	    alert(`확정되었습니다.\n상태: ${data.status || 'CONFIRMED'}\n건수: ${data.okCount ?? '-'}\n총액: ${Number(data.totalAmount || 0).toLocaleString()}원`);

            // 버튼을 '확정 완료' 상태로 만들고 비활성화 유지
            confirmBtn.textContent = '확정 완료';
            // ※ 여기서 다음 단계(납입 실행) 페이지로 이동시키는 것도 좋은 방법입니다.
            // 예: location.href = `/company/dc/contribution/execute-page?batchId=${batchId}`;

    	  } catch (err) {
            // [수정] 실패 시에만 버튼을 다시 활성화
    	    alert('오류: ' + err.message);
    	    confirmBtn.disabled = false;
            cancelBtn.disabled = false;
            confirmBtn.textContent = origText;
    	  }
    	});

      cancelBtn.addEventListener('click', () => {
        if (confirm('작업을 취소하시겠습니까?')) location.href = '/company/dc/contribution/upload-page';
      });

      fetchAndRender();
    })();
  </script>
</body>
</html>
