<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>가입자 명부 등록 | BNK 퇴직연금</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <link th:href="@{/css/company-subscriber.css}" rel="stylesheet" />

  <style>
    .notification {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      padding: 12px 20px; border-radius: 8px; color: #fff; font-size: 14px; z-index: 1000;
      opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s, top 0.3s;
    }
    .notification.is-show { opacity: 1; visibility: visible; top: 40px; }
    .notification.is-error { background-color: #d32f2f; }
    .notification.is-success { background-color: #2e7d32; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .tr-error td { background-color: #fff5f5; }
    .tr-dup td { border-left: 2px solid #ffb822; }
    .with-tip { position: relative; cursor: help; }
    .with-tip .tip {
      position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%);
      margin-bottom: 8px; padding: 8px 12px; background: #333; color: #fff;
      border-radius: 4px; font-size: 12px; white-space: nowrap;
      visibility: hidden; opacity: 0; transition: all 0.2s;
    }
    .with-tip:hover .tip { visibility: visible; opacity: 1; }
  </style>
</head>
<body class="bnk-body">

  <main class="wrap">
    <header class="page-head">
      <h1>가입자 명부 등록</h1>
      <p class="desc">엑셀 파일을 업로드하여 가입자 명부를 검증하고, 이상이 없으면 등록을 실행합니다.</p>
    </header>

    <section class="card">
      <div class="card-head">
        <h2>파일 업로드</h2>
        <div class="actions">
          <a class="btn btn-outline" th:href="@{/file/가입자명부등록 양식.xlsx}" download>엑셀 양식 다운로드</a>
          <button type="button" class="btn btn-ghost" id="clearBtn">초기화</button>
        </div>
      </div>
      <div id="dropzone" class="dropzone" tabindex="0" aria-label="엑셀 파일 드래그 또는 클릭하여 선택">
        <div class="dz-inner">
          <div class="dz-icon">⬆</div>
          <div class="dz-title">파일을 이곳에 끌어놓거나 클릭하여 선택</div>
          <div class="dz-sub">지원 형식: .xlsx / 최대 20MB</div>
			<input type="file" id="excelFile" accept=".xlsx" hidden />        </div>
      </div>
      <div class="upload-bar">
        <div class="file-pill" id="filePill" hidden>
          <span id="fileName">선택된 파일 없음</span>
          <button type="button" class="x" id="removeFile" aria-label="파일 제거">×</button>
        </div>
        <div class="right">
          <button type="button" class="btn btn-primary" id="validateBtn">업로드 및 검증</button>
        </div>
      </div>
      <div class="note" id="noUploadMsg">엑셀을 업로드하면 표 하단에 검증 결과가 표시됩니다.</div>
    </section>

    <section class="card" id="resultSection" hidden>
      <div class="card-head">
        <h2>검증 결과</h2>
      </div>
      <div class="summary">
        <span class="chip total"><i></i>전체 <b id="totalCnt">0</b></span>
        <span class="chip ok"><i></i>정상 <b id="normalCnt">0</b></span>
        <span class="chip dup"><i></i>중복 <b id="duplicateCnt">0</b></span>
        <span class="chip err"><i></i>오류 <b id="errorCnt">0</b></span>
      </div>
	    <div class="table-outer">
	      <div class="table-scroll">
	        <table class="tbl" id="resultTable">
	          <thead>
	            <tr>
	              <th>이름</th> <th>주민번호</th> <th>입사일</th> <th>기산일</th> <th>연간임금총액</th>
	              <th>구분</th> <th>이메일</th> <th>휴대폰</th> <th>상태</th> <th>가입일</th>
	            </tr>
	          </thead>
	          <tbody></tbody>
	        </table>
	      </div>
	    </div>
	  </section>

    <div class="sticky-bar">
      <div class="left">
        <small class="muted">정상 데이터만 등록됩니다. (중복/오류 행 제외)</small>
      </div>
      <div class="right">
        <button type="button" id="registerBtn" class="btn btn-primary" disabled>등록하기</button>
      </div>
    </div>
  </main>

  <div class="spinner-mask" id="spinner" hidden>
    <div class="spinner"></div>
  </div>

  <div id="notification" class="notification"></div>

  <script>
    // 상태
    let selectedFile = null;
    let validatedData = []; // 원래 코드와 동일하게, 검증 결과를 저장할 배열

    // 엘리먼트
    const excelInput = document.getElementById('excelFile');
    const dropzone   = document.getElementById('dropzone');
    const filePill   = document.getElementById('filePill');
    const fileNameEl = document.getElementById('fileName');
    const removeFile = document.getElementById('removeFile');
    const validateBtn= document.getElementById('validateBtn');
    const registerBtn= document.getElementById('registerBtn');
    const noUploadMsg= document.getElementById('noUploadMsg');
    const resultSec  = document.getElementById('resultSection');
    const spinner    = document.getElementById('spinner');
    const clearBtn   = document.getElementById('clearBtn');
    const notification = document.getElementById('notification');

    // --- 유틸리티 함수 ---

    function showNotification(message, type = 'error') {
      notification.textContent = message;
      notification.className = `notification is-${type}`;
      notification.classList.add('is-show');
      setTimeout(() => notification.classList.remove('is-show'), 3000);
    }

    function setLoading(isLoading) {
      spinner.hidden = !isLoading;
      validateBtn.disabled = isLoading;
      if (!isLoading) {
        const normalCnt = parseInt(document.getElementById('normalCnt').textContent, 10);
        registerBtn.disabled = normalCnt === 0;
      } else {
        registerBtn.disabled = true;
      }
    }

    // --- UI 제어 함수 ---

    function showSelectedFile(file) {
      selectedFile = file;
      if (file) {
        filePill.hidden = false;
        fileNameEl.textContent = file.name;
        validateBtn.disabled = false;
      } else {
        filePill.hidden = true;
        fileNameEl.textContent = '선택된 파일 없음';
        excelInput.value = '';
        validateBtn.disabled = true;
      }
    }

    function resetResults() {
      validatedData = [];
      resultSec.hidden = true;
      noUploadMsg.hidden = false;
      setSummary(0, 0, 0, 0);
      document.querySelector('#resultTable tbody').innerHTML = '';
      registerBtn.disabled = true;
    }

    function resetAll() {
      showSelectedFile(null);
      resetResults();
    }
    
    function setSummary(total, ok, dup, err) {
      document.getElementById('totalCnt').textContent = total;
      document.getElementById('normalCnt').textContent = ok;
      document.getElementById('duplicateCnt').textContent = dup;
      document.getElementById('errorCnt').textContent = err;
    }

    function applyValidationResult(results) {
      const tbody = document.querySelector('#resultTable tbody');
      tbody.innerHTML = '';

      let ok = 0, dup = 0, err = 0;

      const createCell = (text) => {
        const td = document.createElement('td');
        td.textContent = text;
        return td;
      };

      results.forEach(r => {
        const s = r.subscriber || {};
        const tr = document.createElement('tr');

        if (!r.valid) tr.classList.add('tr-error');
        if (r.errors?.some(e => e.includes('중복'))) tr.classList.add('tr-dup');
        
        const nameCell = document.createElement('td');
        if (!r.valid && r.errors?.length) {
          nameCell.className = 'with-tip';
          nameCell.innerHTML = `${s.name || ''}<span class="tip">${r.errors.join('<br/>')}</span>`;
        } else {
          nameCell.textContent = s.name || '';
        }
        tr.appendChild(nameCell);
        
        tr.appendChild(createCell(s.ssn || ''));
        tr.appendChild(createCell(s.entryDate || ''));
        tr.appendChild(createCell(s.baseDate || ''));
        tr.appendChild(createCell(s.annualSalary ? Number(s.annualSalary).toLocaleString() : ''));
        tr.appendChild(createCell(s.employmentType || ''));
        tr.appendChild(createCell(s.email || ''));
        tr.appendChild(createCell(s.phone || ''));
        tr.appendChild(createCell(s.status || ''));
        tr.appendChild(createCell(s.joinDate || ''));
        tbody.appendChild(tr);

        if (r.valid) ok++;
        else if (r.errors?.some(e => e.includes('중복'))) dup++;
        else err++;
      });

      setSummary(results.length, ok, dup, err);
      registerBtn.disabled = ok === 0;
      resultSec.hidden = false;
      noUploadMsg.hidden = true;
    }

    // --- 이벤트 리스너 ---

    removeFile.addEventListener('click', () => showSelectedFile(null));
    clearBtn.addEventListener('click', resetAll);

    ['dragenter', 'dragover'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('is-hover'); }));
    ['dragleave', 'drop'].forEach(evt => dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('is-hover'); }));
    
    dropzone.addEventListener('drop', e => {
      const file = e.dataTransfer.files?.[0];
      if (file) { resetResults(); showSelectedFile(file); }
    });
    dropzone.addEventListener('click', () => excelInput.click());
    dropzone.addEventListener('keydown', (e) => { if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); excelInput.click(); }});

    excelInput.addEventListener('change', () => {
      const file = excelInput.files?.[0];
      resetResults();
      showSelectedFile(file || null);
    });

    // [API] 업로드 및 검증
    validateBtn.addEventListener('click', async () => {
      if (!selectedFile) { showNotification('엑셀 파일을 선택하세요.'); return; }
      if (!/\.xlsx$/i.test(selectedFile.name)) { showNotification('지원 형식은 .xlsx 입니다.'); return; }

      setLoading(true);
      try {
        const fd = new FormData();
        fd.append('file', selectedFile);

        const res = await fetch('/company/subscriber/excel-upload', { method: 'POST', body: fd });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || '서버 오류');
        }
        
        const data = await res.json();
        validatedData = data; // 검증 결과를 상태 변수에 저장
        applyValidationResult(validatedData);

      } catch (err) {
        showNotification('업로드 및 검증 실패: ' + err.message);
        resetResults();
      } finally {
        setLoading(false);
      }
    });

    // [API] 등록
    registerBtn.addEventListener('click', async () => {
      const validSubscribers = validatedData.filter(r => r.valid).map(r => r.subscriber);
      
      if (validSubscribers.length === 0) { showNotification('등록할 정상 데이터가 없습니다.'); return; }
      if (!confirm(`정상 데이터 ${validSubscribers.length}건을 등록하시겠습니까?`)) return;

      setLoading(true);
      try {
        const res = await fetch('/company/subscriber/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(validSubscribers) // 필터링된 정상 데이터 전송
        });

        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || '등록 실패');
        }

        const out = await res.json();
        showNotification(`총 ${out.success}건 등록 성공`, 'success');
        resetAll();

      } catch (err) {
        showNotification('데이터 등록 실패: ' + err.message);
      } finally {
        setLoading(false);
      }
    });

    // --- 초기화 실행 ---
    resetAll();
  </script>
</body>
</html>
