<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>가입자 명부 조회 | BNK 퇴직연금</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    @charset "UTF-8";

    /* 디자인 시스템 (등록 페이지와 동일) */
    :root {
      --pri: #c82020;              /* BNK 메인 레드 */
      --pri-h: #b01b1b;
      --blue: #0052cc;              /* 신뢰감을 주는 파란색 */
      --ink: #172b4d;               /* 텍스트 색상 */
      --ink-light: #42526e;
      --mut: #6b7280;
      --bg: #f4f5f7;                /* 배경색 */
      --card: #ffffff;
      --line: #dfe1e6;              /* 라인 색상 */
      --line-light: #e9ebf0;
      --ok: #00875a;                /* 성공 상태 */
      --ok-light: #e3fcef;
      --err: #de350b;               /* 오류 상태 */
      --dup: #ffab00;               /* 중복/주의 상태 */
      --dup-light: #fffbe6;
      --blue-light: #f0f6ff;
      --shadow-sm: 0 1px 1px rgba(0,0,0,.1);
      --shadow-sticky: 0 -2px 8px rgba(9, 30, 66, .1);
      --sticky-h: 72px;
    }

    *{box-sizing: border-box}
    html, body {height: 100%}
    body.bnk-body {
      margin: 0;
      font-family: Pretendard, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* 레이아웃 구조 */
    .wrap {
      max-width: 100%;
      margin: 0 auto;
      padding: 0;
      padding-bottom: calc(var(--sticky-h) + 24px);
    }
    .page-head {
      background: var(--card);
      padding: 24px 32px;
      border-bottom: 1px solid var(--line);
    }
    .page-head h1 {margin: 0 0 8px; font-size: 24px; font-weight: 700;}
    .page-head .desc {margin: 0; color: var(--ink-light); font-size: 15px;}

    .card {
      background: var(--card);
      padding: 24px 32px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .card:last-of-type { border-bottom: none; }
    
    /* 툴바 (필터링) */
    .toolbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .filter-group { display: flex; align-items: center; gap: 8px; }
    .filter-group .label { font-size: 14px; font-weight: 500; color: var(--mut); }
    .seg-group { display: inline-flex; }
    .seg-btn {
      padding: 6px 12px;
      border: 1px solid var(--line);
      background: #fff;
      font-size: 13px;
      color: var(--mut);
      cursor: pointer;
    }
    .seg-btn:first-of-type { border-radius: 4px 0 0 4px; }
    .seg-btn:last-of-type { border-radius: 0 4px 4px 0; }
    .seg-btn + .seg-btn { margin-left: -1px; }
    .seg-btn.is-active { background: var(--blue-light); border-color: var(--blue); color: var(--blue); font-weight: 600; z-index: 1; }
    .search-box input {
      width: 220px;
      padding: 7px 12px;
      border-radius: 4px;
      border: 1px solid var(--line);
      font-size: 14px; outline: none;
      transition: all .2s;
    }
    .search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue-light); }


    /* 버튼 */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 8px 14px; border-radius: 4px; border: 1px solid var(--line);
      font-weight: 500; cursor: pointer; text-decoration: none; user-select: none;
      transition: all .2s ease; font-size: 14px;
    }
    .btn-primary {background: var(--pri); color: #fff; border-color: var(--pri);}
    .btn-primary:hover {background: var(--pri-h); border-color: var(--pri-h);}
    .btn:disabled {opacity: .6; cursor: not-allowed; background: #fafafa !important; color: #aaa !important; border-color: var(--line) !important;}
    .btn-icon { all: unset; display: inline-flex; padding: 4px; border-radius: 4px; cursor: pointer; transition: background .2s; }
    .btn-icon:hover { background: #e9ebf0; }
    .btn-icon svg { width: 18px; height: 18px; color: var(--mut); }
    .btn-icon.primary svg { color: var(--blue); }
    .btn-icon:disabled, .btn-icon.disabled { cursor: not-allowed; }
    .btn-icon:disabled svg, .btn-icon.disabled svg { color: #ccc; }


    /* 칩 (상태 표시) */
    .chip {
      display: inline-flex; align-items: center; gap: 6px; border-radius: 4px;
      padding: 3px 8px; font-weight: 500; font-size: 12px;
      border: 1px solid transparent;
    }
    .chip.ok { background-color: var(--ok-light); color: var(--ok); border-color: #abe2c8; }
    .chip.dup { background-color: var(--dup-light); color: #b77300; border-color: #ffd88a; }
    .chip.info { background-color: var(--blue-light); color: var(--blue); border-color: #b3d4ff; }

    /* 데이터 테이블 */
    .table-outer {
      border: 1px solid var(--line);
      border-radius: 6px; background: #fff; overflow: hidden;
    }
    .table-scroll {overflow: auto; max-width: 100%;}
    .tbl {
      width: 100%; border-collapse: collapse; min-width: 1100px;
      font-size: 14px; line-height: 1.5;
    }
    .tbl th, .tbl td {
      padding: 12px 14px; border-bottom: 1px solid var(--line-light);
      text-align: left; vertical-align: middle;
    }
    .tbl thead th {
      background: #fafbfc; color: var(--ink-light); font-weight: 500; font-size: 13px;
      border-bottom: 1px solid var(--line);
    }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl tbody tr:hover {background: var(--blue-light);}
    .tbl tbody tr.is-selected { background: #fffbe6; } /* 선택된 행 스타일 */
    .tbl td .name { font-weight: 600; color: var(--ink); }
    .tbl td .sub-text { font-size: 13px; color: var(--mut); }
    .tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
    .tbl .actions { text-align: center; }
    .tbl .actions .btn-icon { margin: 0 2px; }

    /* 빈 상태 */
    .empty { padding: 60px; text-align: center; color: var(--mut); }

    /* 하단 고정 바 (일괄 처리) */
    .sticky-bar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
        height: var(--sticky-h);
        background: rgba(255, 255, 255, .8);
        backdrop-filter: blur(8px);
        border-top: 1px solid var(--line);
        box-shadow: var(--shadow-sticky);
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 32px;
        transform: translateY(100%); /* 기본적으로 숨김 */
        transition: transform .3s ease;
    }
    .sticky-bar.visible {
        transform: translateY(0); /* visible 클래스가 붙으면 나타남 */
    }
    .sticky-bar #selcount { font-weight: 500; }
    .sticky-bar #selcount b { color: var(--pri); font-weight: 700; }

    /* 디테일 드로어 (슬라이드 패널) */
    .drawer {
      position: fixed; top: 0; right: -420px; width: 420px; height: 100vh;
      background: #fff; border-left: 1px solid var(--line);
      box-shadow: var(--shadow-sticky); transition: right .3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 60;
    }
    .drawer.open { right: 0; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { font-size: 18px; font-weight: 700; }
    .drawer-head .x { all: unset; cursor: pointer; font-size: 24px; color: var(--mut); line-height: 1; }
    .drawer-body { padding: 24px; }
    .drawer-body .dl { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line-light); }
    .drawer-body .dl:last-child { border-bottom: none; }
    .drawer-body .dl span { color: var(--mut); font-size: 14px; }
    .drawer-body .dl b { font-weight: 600; font-size: 15px; }
    .drawer-body hr { border: none; border-top: 1px solid var(--line); margin: 16px 0; }
  </style>
</head>
<body class="bnk-body">

<main class="wrap">
  <header class="page-head">
    <h1>가입자 명부 조회</h1>
    <p class="desc">기업의 퇴직연금 가입자 명부를 조회하고 계좌 개설을 신청할 수 있습니다.</p>
  </header>
  
  <section class="card">
    <div class="toolbar">
      <div class="filter-group">
        <span class="label">재직상태</span>
        <div class="seg-group">
          <button class="seg-btn is-active" data-employ="ACTIVE">재직</button>
          <button class="seg-btn" data-employ="INACTIVE">퇴직</button>
          <button class="seg-btn" data-employ="ALL">전체</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="label">계좌상태</span>
        <div class="seg-group">
          <button class="seg-btn is-active" data-acc="ALL">전체</button>
          <button class="seg-btn" data-acc="POSSIBLE">신청 가능</button>
          <button class="seg-btn" data-acc="PENDING">처리중</button>
          <button class="seg-btn" data-acc="COMPLETED">개설 완료</button>
        </div>
      </div>
      <div class="filter-group" style="margin-left: auto;">
        <div class="search-box">
          <input id="q" type="search" placeholder="이름으로 검색" />
        </div>
        <button class="btn" id="searchBtn">조회</button>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="table-outer">
      <div class="table-scroll">
        <table class="tbl" id="tbl">
          <thead>
            <tr>
              <th style="width: 50px;"><input type="checkbox" id="checkall"></th>
              <th>이름/생년월일</th>
              <th style="width: 100px;">재직상태</th>
              <th style="width: 130px;">입사일</th>
              <th class="num" style="width: 150px;">연봉</th>
              <th style="width: 120px;">계좌상태</th>
              <th class="actions" style="width: 120px;">관리</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div id="empty" class="empty" hidden>해당 조건의 가입자가 없습니다.</div>
    </div>
  </section>

  <div class="sticky-bar" id="bulkbar">
    <span id="selcount"><b>0명</b> 선택됨</span>
    <button class="btn btn-primary" id="bulkRequest">선택 항목 일괄 신청</button>
  </div>
</main>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <strong id="d-name">이름</strong>
    <button class="x" id="drawerClose">×</button>
  </div>
  <div class="drawer-body">
    <div class="dl"><span>생년월일</span><b id="d-birth">-</b></div>
    <div class="dl"><span>재직상태</span><b id="d-status">-</b></div>
    <div class="dl"><span>입사일</span><b id="d-join">-</b></div>
    <div class="dl"><span>연봉</span><b id="d-salary">-</b></div>
    <hr/>
    <div class="dl"><span>계좌번호</span><b id="d-accno">-</b></div>
    <div class="dl"><span>계좌상태</span><b id="d-accst">-</b></div>
    <div class="dl"><span>잔액</span><b id="d-balance">-</b></div>
    <div class="dl"><span>계좌개설일</span><b id="d-created">-</b></div>
  </div>
</aside>

<script>
  // ---------- 상태 ----------
  let employ = 'ACTIVE', acc = 'ALL';
  let data = []; // 데이터는 load()를 통해 서버에서 받아옵니다.

  const el = (q) => document.querySelector(q);
  const $$ = (q) => Array.from(document.querySelectorAll(q));

  // ---------- 유틸 & 아이콘 ----------
  const fmt = (n) => Number(n || 0).toLocaleString(); // 콤마
  const ICONS = {
    view: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`,
    add: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
    pending: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
  };
  const chip = (s) => {
    if (s === '개설 완료') return '<span class="chip info">개설 완료</span>';
    if (s === '처리중') return '<span class="chip dup">처리중</span>';
    return '<span class="chip ok">신청 가능</span>';
  };

  // ---------- [수정] 렌더링 함수: 새 테이블 구조에 맞게 수정 ----------
  function render(rows) {
    const tb = el('#tbody');
    tb.innerHTML = '';
    el('#empty').hidden = rows && rows.length > 0;
    el('#checkall').checked = false;

    (rows || []).forEach(r => {
      const tr = document.createElement('tr');
      tr.dataset.memberId = r.memberId;
      const isRequestable = r.accountStatus === '신청 가능';

      tr.innerHTML = `
        <td><input type="checkbox" class="rowck" value="${r.memberId}" ${isRequestable ? '' : 'disabled'}></td>
        <td>
            <div class="name">${r.name}</div>
            <div class="sub-text">${r.birthDate}</div>
        </td>
        <td>${r.status}</td>
        <td>${r.startDate}</td>
        <td class="num">${fmt(r.annualSalary)}원</td>
        <td>${chip(r.accountStatus)}</td>
        <td class="actions">
          ${r.accountStatus === '개설 완료'
            ? `<button class="btn-icon" data-view="${r.memberId}" title="계좌 보기">${ICONS.view}</button>`
            : r.accountStatus === '처리중'
            ? `<button class="btn-icon disabled" disabled title="신청 처리중">${ICONS.pending}</button>`
            : `<button class="btn-icon primary" data-req="${r.memberId}" title="계좌 개설 신청">${ICONS.add}</button>`}
        </td>
      `;
      // 이벤트 리스너 바인딩
      tr.addEventListener('click', e => {
        if (e.target.closest('button, input')) return;
        openDrawer(r.memberId);
      });
      tr.querySelector('.rowck')?.addEventListener('change', e => {
        tr.classList.toggle('is-selected', e.target.checked);
        updateBulkbar();
      });
      tr.querySelector('[data-req]')?.addEventListener('click', e => {
        e.stopPropagation(); requestAccount([e.target.closest('[data-req]').dataset.req]);
      });
      tr.querySelector('[data-view]')?.addEventListener('click', e => {
        e.stopPropagation(); openDrawer(e.target.closest('[data-view]').dataset.view);
      });

      tb.appendChild(tr);
    });
    updateBulkbar();
  }

  // ---------- [수정] 하단 바 업데이트 로직 ----------
  function updateBulkbar() {
    const checked = $$('.rowck:checked');
    el('#selcount').innerHTML = `<b>${checked.length}명</b> 선택됨`; // 원본 코드에 있던 #selcount 사용
    el('#bulkbar').classList.toggle('visible', checked.length > 0);

    // 전체 선택 체크박스 상태 업데이트
    const allRequestable = $$('.rowck:not(:disabled)');
    el('#checkall').checked = allRequestable.length > 0 && checked.length === allRequestable.length;
  }

  // ---------- 데이터 로드: 원본 fetch 로직 ----------
  async function load() {
    const params = new URLSearchParams({
      name: el('#q').value || '',
      status: employ,
      accountStatus: acc
    });
    const res = await fetch(`/company/subscriber/list?${params}`);
    if (!res.ok) {
        alert('데이터를 불러오는 데 실패했습니다.');
        return;
    }
    const body = await res.json();
    data = body.data || [];
    render(data);
  }

  // ---------- 이벤트 바인딩 (일부 수정) ----------
  document.addEventListener('DOMContentLoaded', () => {
    $$('.seg-btn').forEach(b => {
      b.addEventListener('click', () => {
        b.parentElement.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('is-active'));
        b.classList.add('is-active');
        if (b.dataset.employ) employ = b.dataset.employ;
        if (b.dataset.acc) acc = b.dataset.acc;
        load();
      });
    });
    // 원본은 keydown 이벤트였으나, 별도 조회 버튼이 생겼으므로 두 가지 모두 지원
    el('#q').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
    el('#searchBtn').addEventListener('click', load);
    
    // 전체 선택 체크박스 이벤트
    el('#checkall').addEventListener('change', e => {
      const isChecked = e.target.checked;
      $$('.rowck:not(:disabled)').forEach(ck => {
        ck.checked = isChecked;
        ck.closest('tr').classList.toggle('is-selected', isChecked);
      });
      updateBulkbar();
    });

    el('#bulkRequest').addEventListener('click', () => {
      const ids = $$('.rowck:checked').map(c => c.value);
      if (ids.length === 0) return alert('대상이 없습니다.');
      if (confirm(`${ids.length}명의 계좌 개설을 일괄 신청하시겠습니까?`)) {
        requestAccount(ids);
      }
    });
    el('#drawerClose').addEventListener('click', closeDrawer);

    load(); // 초기 데이터 로드
  });

  // ---------- API 호출: 원본 fetch 로직 ----------
  async function requestAccount(memberIds) {
    const r = await fetch('/company/dc/account/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ memberIds })
    });
    const d = await r.json();
    if (!r.ok) return alert(d.message || '오류가 발생했습니다.');
    alert(`${d.successCount || memberIds.length}건 신청 접수 완료`);
    load(); // 목록 새로고침
  }

  async function openDrawer(memberId) {
  const r = await fetch(`/company/account/details/${memberId}`);
    if (!r.ok) {
        const errorBody = await r.text();
        console.error("상세 정보 로드 실패:", errorBody);
        alert('상세 정보를 불러오지 못했습니다.');
        return;
    }
    const d = await r.json();

    el('#d-name').textContent = d.memberName || '-';
    el('#d-birth').textContent = d.birthDate || '-';
    el('#d-status').textContent = d.memberStatus || '-';   // 재직 상태
    el('#d-join').textContent = d.startDate || '-';         // 입사일
    el('#d-salary').textContent = d.annualSalary ? `${fmt(d.annualSalary)}원` : '-';
    el('#d-accno').textContent = d.accountNo || '-';
    el('#d-accst').textContent = d.status || '-';           // 계좌 상태
    el('#d-balance').textContent = d.balance != null ? `${fmt(d.balance)}원` : '-';
    el('#d-created').textContent = d.createdAt ? new Date(d.createdAt).toLocaleString('ko-KR') : '-';
    el('#drawer').classList.add('open');
  }
  function closeDrawer() { el('#drawer').classList.remove('open'); }
</script>

</body>
</html>
