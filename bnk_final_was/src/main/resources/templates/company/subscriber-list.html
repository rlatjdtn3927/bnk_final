<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>가입자 명부 조회</title>
    <style>
        /* ===== CSS 변수 (테마 색상) ===== */
        :root {
            --primary-color: #0052cc;
            --border-color: #dfe1e6;
            --text-color: #172b4d;
            --text-light: #5e6c84;
            --background-light: #fafbfc;
            --background-white: #ffffff;
            --hover-light: #f0f6ff;
        }

        /* ===== 기본 및 레이아웃 ===== */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard Variable", Pretendard, Roboto, "Noto Sans KR", "Segoe UI", "Malgun Gothic", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", sans-serif;
            background-color: var(--background-light);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            background-color: var(--background-white);
            border-radius: 8px;
            box-shadow: 0 4px 8px -2px rgba(9, 30, 66, 0.25), 0 0 1px rgba(9, 30, 66, 0.31);
            padding: 32px;
        }

        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h2 {
            font-size: 24px;
            font-weight: 600;
            margin: 0;
        }
        
        /* ▼▼▼▼▼ 콤보박스 및 버튼 스타일 추가 ▼▼▼▼▼ */
        .controls-right {
            display: flex;
            align-items: center;
            gap: 12px; /* 요소 사이 간격 */
        }

        .filter-select {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            background-color: var(--background-white);
            cursor: pointer;
        }
        .filter-select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(0, 82, 204, 0.2);
        }
        
        .action-button {
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 500;
            color: var(--background-white);
            background-color: var(--primary-color);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .action-button:hover {
            background-color: #0041a3;
        }

        /* ===== 테이블 스타일 ===== */
        .table-wrapper {
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
            font-size: 14px;
        }
        
        th, td {
            padding: 12px 16px;
            text-align: left;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }
        
        /* ▼▼▼▼▼ 체크박스 컬럼 너비 고정 ▼▼▼▼▼ */
        th:first-child, td:first-child {
            width: 40px;
            text-align: center;
        }
        
        thead th {
            background-color: var(--background-light);
            font-weight: 600;
            color: var(--text-light);
        }
        
        tbody tr:nth-child(even) {
            background-color: var(--background-light);
        }

        tbody tr:hover {
            background-color: var(--hover-light);
        }

        .message-cell {
            text-align: center;
            color: var(--text-light);
            padding: 40px;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-controls">
            <h2>가입자 명부</h2>
            <div class="controls-right">
                <select id="status-filter" class="filter-select">
                    <option value="ALL">전체</option>
                    <option value="ACTIVE">재직</option>
                    <option value="INACTIVE">퇴직</option>
                </select>
                <button id="request-account-btn" class="action-button">선택 가입자 계좌 개설 신청</button>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th><input type="checkbox" id="select-all-checkbox"></th>
                        <th>성명</th>
                        <th>생년월일</th>
                        <th>가입자상태</th>
                        <th>입사일</th>
                        <th>연간임금총액</th>
                        <th>기산일</th>
                        <th>가입일</th>
                        <th>퇴직일</th>
                        <th>해지일</th>
                        <th>최초부담금납입일</th>
                        <th>DB납입비율</th>
                        <th>DC납입비율</th>
                    </tr>
                </thead>
                <tbody id="subscriber-table-body">
                </tbody>
            </table>
        </div>
    </div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const filterSelect = document.getElementById('status-filter');
        const selectAllCheckbox = document.getElementById('select-all-checkbox');

        fetchSubscribers(filterSelect.value);

        filterSelect.addEventListener('change', function() {
            fetchSubscribers(this.value);
        });

        selectAllCheckbox.addEventListener('change', function() {
            const checkboxes = document.querySelectorAll('.subscriber-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = this.checked;
            });
        });
    });

    function fetchSubscribers(status = 'ALL') {
        const tableBody = document.getElementById('subscriber-table-body');
        tableBody.innerHTML = `<tr><td colspan="13" class="message-cell">데이터를 불러오는 중입니다...</td></tr>`;
    
        fetch(`/company/subscriber/list?status=${status}`)
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => { throw new Error(text); });
                }
                return response.json();
            })
            .then(data => {
                tableBody.innerHTML = '';
                const subscriberList = data.data; 
    
                if (!subscriberList || subscriberList.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="13" class="message-cell">조회된 가입자가 없습니다.</td></tr>`;
                    return;
                }
    
                subscriberList.forEach(subscriber => {
                    const row = document.createElement('tr');
                    row.dataset.memberId = subscriber.memberId; 
                    
                    row.innerHTML = `
                        <td><input type="checkbox" class="subscriber-checkbox"></td>
                        <td>${formatValue(subscriber.name)}</td>
                        <td>${formatValue(subscriber.birthDate)}</td>
                        <td>${formatValue(subscriber.status)}</td>
                        <td>${formatValue(subscriber.startDate)}</td>
                        <td>${formatCurrency(subscriber.annualSalary)}</td>
                        <td>${formatValue(subscriber.baseDate)}</td>
                        <td>${formatValue(subscriber.joinDate)}</td>
                        <td>${formatValue(subscriber.retireDate)}</td>
                        <td>${formatValue(subscriber.cancelDate)}</td>
                        <td>${formatValue(subscriber.firstPayDate)}</td>
                        <td>${formatRatio(subscriber.dbRatio)}</td>
                        <td>${formatRatio(subscriber.dcRatio)}</td>
                    `;
                    tableBody.appendChild(row);
                });
            })
            .catch(error => {
                console.error('데이터 조회 실패:', error);
                tableBody.innerHTML = `<tr><td colspan="13" class="message-cell">데이터를 불러오는 데 실패했습니다: ${error.message}</td></tr>`;
            });
    }
    
    const requestButton = document.getElementById('request-account-btn');
    requestButton.addEventListener('click', function() {
        const selectedIds = [];
        document.querySelectorAll('.subscriber-checkbox:checked').forEach(checkbox => {
            selectedIds.push(checkbox.closest('tr').dataset.memberId);
        });

        if (selectedIds.length === 0) {
            alert('계좌를 개설할 가입자를 선택해주세요.');
            return;
        }

        if (confirm(`${selectedIds.length}명의 가입자에 대한 계좌 개설을 신청하시겠습니까?`)) {
            requestAccountOpening(selectedIds);
        }
    });

    function requestAccountOpening(memberIds) {
        console.log('계좌 개설 신청 ID 목록:', memberIds);
        
        // ▼▼▼▼▼ 수정된 부분 ▼▼▼▼▼
        // 1. API 엔드포인트를 전달해주신 주소로 변경했습니다.
        fetch('/company/dc/account/request', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({ memberIds: memberIds })
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(err => { throw new Error(err.message || '알 수 없는 오류'); });
            }
            return response.json();
        })
        .then(data => {
            // 2. 관리자 승인 절차를 안내하는 메시지로 수정했습니다.
            alert('계좌 개설 신청이 정상적으로 접수되었습니다. 관리자 승인 후 처리됩니다.');
            fetchSubscribers(document.getElementById('status-filter').value);
        })
        .catch(error => {
            console.error('계좌 개설 신청 실패:', error);
            alert(`계좌 개설 신청 중 오류가 발생했습니다: ${error.message}`);
        });
        // ▲▲▲▲▲ 수정된 부분 ▲▲▲▲▲
    }

    // --- 데이터 포맷팅을 위한 헬퍼 함수들 ---
    function formatValue(value) {
        return value != null ? value : '-';
    }
     
    function formatCurrency(value) {
        if (value == null) return '-';
        return value.toLocaleString('ko-KR') + '원';
    }

    function formatRatio(value) {
        if (value == null) return '-';
        return value + '%';
    }
</script>

</body>
</html>
