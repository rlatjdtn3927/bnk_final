<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>가입자 명부 | BNK 퇴직연금</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    @charset "UTF-8";

    :root {
      /* 새로운 색상 팔레트: 전문적이고 세련된 다크 블루 테마 */
      --pri: #4f46e5;
      --pri-light: #eef2ff;
      --pri-text: #3730a3;
      --ink: #111827;
      --mut: #6b7280;
      --bg: #f8f9fc;
      --card: #ffffff;
      --line: #e5e7eb;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.07), 0 4px 6px -4px rgba(0, 0, 0, 0.07);
      --ok: #16a34a;
      --ok-light: #f0fdf4;
      --amber: #f59e0b;
      --amber-light: #fffbeb;
      --blue: #2563eb;
      --blue-light: #eff6ff;
      --sticky: 64px;
    }

    * { box-sizing: border-box }

    html, body { height: 100% }

    body.bnk-body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Pretendard, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      letter-spacing: -0.02em;
    }

    .wrap { max-width: 1100px; margin: 32px auto; padding: 0 24px 96px }

    /* 헤더/툴바 */
    .page-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px }
    .page-head h1 { margin: 0; font-size: 28px; font-weight: 800 }
    .toolbar { display: flex; align-items: center; gap: 12px; margin-left: auto }
    .seg { display: flex; gap: 6px; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 999px }
    .seg-btn {
      border: 0;
      background: transparent;
      padding: 8px 14px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      color: var(--mut);
      transition: all 0.2s ease-in-out;
    }
    .seg-btn.is-active { background: var(--pri-light); color: var(--pri-text); font-weight: 700; }
    .search input {
      width: 240px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
      font-size: 14px;
      transition: all 0.2s;
    }
    .search input:focus {
      border-color: var(--pri);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, .15);
    }

    /* === ⭐ 핵심 개선: 카드형 목록 === */
    .datacard { background: transparent; border: none; box-shadow: none; }
    .table-wrap { border-radius: 12px; overflow: hidden; }
    .tbl { width: 100%; border-collapse: collapse; border-spacing: 0; }
    .tbl thead { display: none; } /* 테이블 헤더는 숨기고 카드 내부에 제목 표시 */
    .tbl tbody tr { display: block; margin-bottom: 12px; }
    .tbl tbody td {
        display: block;
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow);
        transition: all 0.2s ease-in-out;
    }
    .tbl tbody tr:hover td { border-color: var(--pri); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .tbl tbody tr.is-selected td { border-color: var(--pri); background: #fafaff; }

    /* 카드 내부 구조 */
    .member-card { display: flex; align-items: center; padding: 20px; gap: 20px; }
    .member-card .select-box { padding-right: 12px; }
    .member-card .select-box input { width: 18px; height: 18px; }

    .member-profile { flex-grow: 1; }
    .member-profile .name { font-size: 18px; font-weight: 700; color: var(--ink); }
    .member-profile .birth { font-size: 13px; color: var(--mut); margin-top: 4px; font-variant-numeric: tabular-nums; }

    .member-details { display: flex; gap: 24px; text-align: right; padding-right: 24px; }
    .detail-item { min-width: 120px; }
    .detail-item .label { font-size: 12px; color: var(--mut); margin-bottom: 6px; }
    .detail-item .value { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .detail-item .value.mono { white-space: nowrap; }

    .member-status .chip { font-size: 13px; padding: 6px 12px; }

    .member-actions { padding-left: 24px; border-left: 1px solid var(--line); }

    /* 칩/버튼 */
    .chip {
        display: inline-flex; align-items: center; gap: 6px; border-radius: 999px;
        padding: 6px 10px; font-weight: 600; font-size: 12px;
        border: 1px solid transparent;
    }
    .chip-green { background: var(--ok-light); color: var(--ok); }
    .chip-amber { background: var(--amber-light); color: var(--amber); }
    .chip-blue { background: var(--blue-light); color: var(--blue); }

    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:10px; font-weight:700; cursor:pointer; border:1px solid transparent; transition: all 0.2s; }
    .btn-primary { background:var(--pri); color:#fff; padding:10px 16px; font-size: 14px; }
    .btn-primary:hover { background: #4338ca; }

    .btn-icon { all: unset; display: inline-flex; padding: 8px; border-radius: 999px; cursor: pointer; transition: background 0.2s; }
    .btn-icon:hover { background: #f3f4f6; }
    .btn-icon svg { width: 20px; height: 20px; color: var(--mut); }
    .btn-icon.primary svg { color: var(--pri); }
    .btn-icon.disabled { cursor: not-allowed; }
    .btn-icon.disabled svg { color: #d1d5db; }


    /* 빈 상태 */
    .empty { padding: 60px; text-align: center; color: var(--mut); background: var(--card); border-radius: 12px; }

    /* 하단 일괄바 */
    .bulkbar {
        position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 150%);
        width: auto; max-width: 600px;
        background: var(--ink); color: #fff;
        border-radius: 12px;
        display: flex; align-items: center; justify-content: space-between;
        padding: 12px 12px 12px 24px;
        transition: transform .3s ease-in-out;
        z-index: 50;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .bulkbar.visible { transform: translate(-50%, 0); }
    .bulkbar #selcount { font-weight: 600; }
    .bulkbar .btn-primary { background: #fff; color: var(--ink); }

    /* 디테일 드로어 */
    .drawer {
        position: fixed; top: 0; right: -420px; width: 420px; height: 100vh;
        background: #fff; border-left: 1px solid var(--line);
        box-shadow: var(--shadow-lg); transition: right .3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 60;
    }
    .drawer.open { right: 0; }
    .drawer-head { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
    .drawer-head strong { font-size: 18px; font-weight: 700; }
    .drawer-head .x { all: unset; cursor: pointer; font-size: 24px; color: var(--mut); }
    .drawer-body { padding: 24px; line-height: 1.9; }
    .drawer-body .dl { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
    .drawer-body .dl span { color: var(--mut); font-size: 14px; }
    .drawer-body .dl b { font-weight: 600; font-size: 15px; }
    .drawer-body hr { border: none; border-top: 1px solid var(--line); margin: 12px 0; }
  </style>
</head>
<body class="bnk-body">

<main class="wrap">
  <header class="page-head">
    <h1>가입자 명부</h1>
    <div class="toolbar">
      <div class="seg">
        <button class="seg-btn is-active" data-employ="ACTIVE">재직</button>
        <button class="seg-btn" data-employ="INACTIVE">퇴직</button>
        <button class="seg-btn" data-employ="ALL">전체</button>
      </div>
      <div class="seg">
        <button class="seg-btn is-active" data-acc="ALL">전체</button>
        <button class="seg-btn" data-acc="POSSIBLE">신청 가능</button>
        <button class="seg-btn" data-acc="PENDING">처리중</button>
        <button class="seg-btn" data-acc="COMPLETED">개설 완료</button>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="이름 검색" />
      </div>
    </div>
  </header>

  <section class="datacard">
    <div class="table-wrap">
      <table class="tbl" id="tbl">
        <thead></thead>
        <tbody id="tbody">
          </tbody>
      </table>
      <div id="empty" class="empty" hidden>해당 조건의 가입자가 없습니다.</div>
    </div>
  </section>

  <div class="bulkbar" id="bulkbar">
    <span id="selcount">0명 선택</span>
    <button class="btn btn-primary" id="bulkRequest">선택 항목 일괄 신청</button>
  </div>
</main>

<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <strong id="d-name">이름</strong>
    <button class="x" id="drawerClose">×</button>
  </div>
  <div class="drawer-body">
    <div class="dl"><span>생년월일</span><b id="d-birth">-</b></div>
    <div class="dl"><span>재직상태</span><b id="d-status">-</b></div>
    <div class="dl"><span>입사일</span><b id="d-join">-</b></div>
    <div class="dl"><span>연봉</span><b id="d-salary">-</b></div>
    <hr/>
    <div class="dl"><span>계좌번호</span><b id="d-accno">-</b></div>
    <div class="dl"><span>계좌상태</span><b id="d-accst">-</b></div>
    <div class="dl"><span>잔액</span><b id="d-balance">-</b></div>
    <div class="dl"><span>계좌개설일</span><b id="d-created">-</b></div>
  </div>
</aside>

<script>
  // ---------- 상태 ----------
  let employ = 'ACTIVE', acc = 'ALL';
  let data = []; // 데이터는 load()를 통해 서버에서 받아옵니다.

  const el = (q) => document.querySelector(q);
  const $$ = (q) => Array.from(document.querySelectorAll(q));

  // ---------- 유틸 & 아이콘 ----------
  const fmt = (n) => Number(n || 0).toLocaleString(); // 콤마
  const ICONS = {
    view: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`,
    add: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v6m3-3H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`,
    pending: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
  };
  const chip = (s) => {
    if (s === '개설 완료') return '<span class="chip chip-blue">개설 완료</span>';
    if (s === '처리중') return '<span class="chip chip-amber">처리중</span>';
    return '<span class="chip chip-green">신청 가능</span>';
  };

  // ---------- 렌더링 함수 ----------
  function render(rows) {
    const tb = el('#tbody');
    tb.innerHTML = '';
    el('#empty').hidden = rows && rows.length > 0;

    rows.forEach(r => {
      const tr = document.createElement('tr');
      tr.dataset.memberId = r.memberId;
      tr.innerHTML = `
        <td>
          <div class="member-card">
            <div class="select-box">
              <input type="checkbox" class="rowck" value="${r.memberId}" ${r.accountStatus === '신청 가능' ? '' : 'disabled'}>
            </div>
            <div class="member-profile">
              <div class="name">${r.name}</div>
              <div class="birth">${r.birthDate}</div>
            </div>
            <div class="member-details">
              <div class="detail-item">
                <div class="label">재직상태</div>
                <div class="value">${r.status}</div>
              </div>
              <div class="detail-item">
                <div class="label">입사일</div>
                <div class="value mono">${r.startDate}</div>
              </div>
              <div class="detail-item">
                <div class="label">연봉</div>
                <div class="value mono">${fmt(r.annualSalary)}원</div>
              </div>
            </div>
            <div class="member-status">
              ${chip(r.accountStatus)}
            </div>
            <div class="member-actions">
              ${r.accountStatus === '개설 완료'
                ? `<button class="btn-icon" data-view="${r.memberId}" title="계좌 보기">${ICONS.view}</button>`
                : r.accountStatus === '처리중'
                ? `<button class="btn-icon disabled" disabled title="신청 처리중">${ICONS.pending}</button>`
                : `<button class="btn-icon primary" data-req="${r.memberId}" title="계좌 개설 신청">${ICONS.add}</button>`}
            </div>
          </div>
        </td>
      `;
      tr.addEventListener('click', e => {
        if (e.target.closest('button, input')) return;
        openDrawer(r.memberId);
      });
      tr.querySelector('.rowck')?.addEventListener('change', e => {
        tr.classList.toggle('is-selected', e.target.checked);
        updateBulkbar();
      });
      tr.querySelector('[data-req]')?.addEventListener('click', e => {
        e.stopPropagation(); requestAccount([e.target.closest('[data-req]').dataset.req]);
      });
      tr.querySelector('[data-view]')?.addEventListener('click', e => {
        e.stopPropagation(); openDrawer(e.target.closest('[data-view]').dataset.view);
      });

      tb.appendChild(tr);
    });
    updateBulkbar();
  }

  function updateBulkbar() {
    const checked = $$('.rowck:checked');
    el('#selcount').textContent = `${checked.length}명 선택`;
    el('#bulkbar').classList.toggle('visible', checked.length > 0);
  }

  // ---------- [수정] 데이터 로드: 실제 fetch 로직으로 복원 ----------
  async function load() {
    const params = new URLSearchParams({
      name: el('#q').value || '',
      status: employ,
      accountStatus: acc
    });
    const res = await fetch(`/company/subscriber/list?${params}`);
    if (!res.ok) {
        alert('데이터를 불러오는 데 실패했습니다.');
        return;
    }
    const body = await res.json();
    data = body.data || [];
    render(data);
  }

  // ---------- 이벤트 바인딩 ----------
  document.addEventListener('DOMContentLoaded', () => {
    $$('.seg-btn').forEach(b => {
      b.addEventListener('click', () => {
        const segGroup = b.parentElement;
        segGroup.querySelectorAll('.seg-btn').forEach(x => x.classList.remove('is-active'));
        b.classList.add('is-active');
        if (b.dataset.employ) employ = b.dataset.employ;
        if (b.dataset.acc) acc = b.dataset.acc;
        load();
      });
    });
    el('#q').addEventListener('keydown', e => { if (e.key === 'Enter') load(); });
    
    el('#bulkRequest').addEventListener('click', () => {
      const ids = $$('.rowck:checked').map(c => c.value);
      if (ids.length === 0) return alert('대상이 없습니다.');
      if (confirm(`${ids.length}명의 계좌 개설을 일괄 신청하시겠습니까?`)) requestAccount(ids);
    });
    el('#drawerClose').addEventListener('click', closeDrawer);

    load();
  });

  // ---------- [수정] API 호출: 실제 fetch 로직으로 복원 ----------
  async function requestAccount(memberIds) {
    const r = await fetch('/company/dc/account/request', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ memberIds })
    });
    const d = await r.json();
    if (!r.ok) return alert(d.message || '오류가 발생했습니다.');
    alert(`${d.successCount || memberIds.length}건 신청 접수 완료`);
    load(); // 목록 새로고침
  }

  async function openDrawer(memberId) {
    const r = await fetch(`/company/account/details/${memberId}`);
    if (!r.ok) return alert('상세 정보를 불러오지 못했습니다.');
    const d = await r.json();

    el('#d-name').textContent = d.memberName;
    el('#d-birth').textContent = d.birthDate;
    el('#d-status').textContent = d.status;
    el('#d-join').textContent = d.startDate;
    el('#d-salary').textContent = d.annualSalary ? `${fmt(d.annualSalary)}원` : '-';
    el('#d-accno').textContent = d.accountNo || '-';
    el('#d-accst').textContent = d.accountStatus || '-';
    el('#d-balance').textContent = d.balance != null ? `${fmt(d.balance)}원` : '-';
    el('#d-created').textContent = d.createdAt ? new Date(d.createdAt).toLocaleString() : '-';
    el('#drawer').classList.add('open');
  }
  function closeDrawer() { el('#drawer').classList.remove('open'); }
</script>

</body>
</html>
