<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>부담금 입금예정 현황 조회 (DC)</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
        :root { --primary:#0052cc; --border:#dfe1e6; --text:#172b4d; --muted:#5e6c84; --bg:#fafbfc; --white:#fff; --danger:#de350b; --ok:#00875a; --blue-light: #e7f0ff; }
        body { font-family: Pretendard, system-ui, -apple-system, Segoe UI, Arial, sans-serif; background: var(--bg); margin: 0; padding: 40px 20px; color: var(--text); }
        .container { max-width: 1200px; margin: 0 auto; background: var(--white); border-radius: 12px; box-shadow: 0 4px 10px rgba(9, 30, 66, .12); padding: 28px; }
        h2 { margin: 0 0 24px; font-size: 22px; font-weight: 700; }
        .filter-box { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 20px; background-color: var(--bg); border-radius: 8px; margin-bottom: 24px; }
        .filter-box label { font-weight: 600; font-size: 14px; }
        .filter-box input[type="date"], .filter-box select { padding: 8px 10px; border-radius: 6px; border: 1px solid var(--border); font-size: 14px; }
        .btn { padding: 8px 16px; font-size: 14px; font-weight: 600; border-radius: 6px; cursor: pointer; border: 0; transition: background-color .2s; }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: #f4f5f7; color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: #ebecf0; }
        .btn:disabled { background: #091e420a; color: #091e424f; cursor: not-allowed; }
        .btn:disabled:hover { background: #091e420a; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
        th, td { border: 1px solid var(--border); padding: 12px 10px; text-align: center; vertical-align: middle; }
        th { background: var(--bg); font-weight: 600; }
        tr.selected { background-color: var(--blue-light); }
        /* [추가] 처리 완료된 항목을 위한 스타일 */
        tr.not-payable { color: var(--muted); background-color: #fafbfc; }
        tr.not-payable .item-checkbox:disabled { cursor: not-allowed; }
        .summary-section { margin-top: 24px; padding: 20px; border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .summary-text { font-size: 16px; }
        .summary-text strong { color: var(--primary); font-size: 20px; }
        .payment-actions { display: flex; gap: 16px; align-items: center; }
        #sourceAccountInfo { font-size: 14px; background-color: var(--bg); padding: 8px 12px; border-radius: 6px; }
        .pagination { margin-top: 20px; text-align: center; }
        .pagination button { margin: 0 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>부담금 입금 (DC)</h2>
        
        <div class="filter-box">
            <label for="fromDate">부담금입금예정일자</label>
            <button class="btn btn-secondary btn-sm" id="btn1M">1개월</button>
            <button class="btn btn-secondary btn-sm" id="btn3M">3개월</button>
            <button class="btn btn-secondary btn-sm" id="btn6M">6개월</button>
            <input type="date" id="fromDate">
            <span>~</span>
            <input type="date" id="toDate">
            
            <label for="payment-status">진행상태</label>
            <select id="payment-status">
                <option value="ALL">전체</option>
                <option value="PENDING" selected>입금대기</option>
                <option value="PAID">입금완료</option>
                <option value="SKIPPED">입금제외</option>
            </select>
            
            <button id="searchBtn" class="btn btn-primary">조회</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th><input type="checkbox" id="selectAll"></th>
                    <th>진행상태</th>
                    <th>계약명(회원명)</th>
                    <th>계좌번호</th>
                    <th>입금예정일</th>
                    <th>기업부담금</th>
                </tr>
            </thead>
            <tbody id="payable-list-body">
                </tbody>
        </table>
        <div id="pagination" class="pagination"></div>

        <div class="summary-section">
            <div class="summary-text">
                총 <strong id="total-count">0</strong>건, 합계 <strong id="total-amount">0</strong>원
            </div>
            <div class="payment-actions">
                <label>출금계좌</label>
                <div id="sourceAccountInfo">(계좌 정보 없음)</div>
                <button id="payBtn" class="btn btn-primary" disabled>입금</button>
            </div>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- 요소 선택 ---
        const fromDateEl = document.getElementById('fromDate');
        const toDateEl = document.getElementById('toDate');
        const statusEl = document.getElementById('payment-status'); // [수정] ID 변경
        const searchBtn = document.getElementById('searchBtn');
        const listBody = document.getElementById('payable-list-body');
        const selectAllCheckbox = document.getElementById('selectAll');
        const totalCountEl = document.getElementById('total-count');
        const totalAmountEl = document.getElementById('total-amount');
        const sourceAccountInfoEl = document.getElementById('sourceAccountInfo');
        const payBtn = document.getElementById('payBtn');
        const paginationEl = document.getElementById('pagination');
        const btn1M = document.getElementById('btn1M');
        const btn3M = document.getElementById('btn3M');
        const btn6M = document.getElementById('btn6M');

        // --- 상태 변수 ---
        let currentPage = 0;
        let totalPages = 0;
        let sourceAccountId = null;

        // --- 초기화 ---
        function setDates(months) {
            const today = new Date();
            const pastDate = new Date();
            pastDate.setMonth(today.getMonth() - months);
            toDateEl.value = today.toISOString().split('T')[0];
            fromDateEl.value = pastDate.toISOString().split('T')[0];
        }

        async function fetchAndSetSourceAccount() {
            try {
                const res = await fetch('/company/dc/contribution/source-accounts');
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '출금 계좌 조회 실패');
                const accounts = data.rows || [];
                if (accounts.length > 0) {
                    const account = accounts[0];
                    sourceAccountId = account.accountId;
                    sourceAccountInfoEl.innerHTML = `<strong>${account.accountNo}</strong> (잔액: ${account.balance.toLocaleString()})`;
                } else {
                    sourceAccountInfoEl.textContent = '등록된 출금계좌가 없습니다.';
                    payBtn.disabled = true;
                }
            } catch (e) {
                console.error(e);
                sourceAccountInfoEl.textContent = '계좌 조회 오류';
                alert('출금 계좌를 불러오는 데 실패했습니다.');
            }
        }

        // --- 데이터 조회 및 렌더링 ---
        async function fetchAndRender(page = 0) {
            currentPage = page;
            const params = new URLSearchParams({
                fromDate: fromDateEl.value,
                toDate: toDateEl.value,
                paymentStatus: statusEl.value, // [수정] paymentStatus 파라미터 사용
                page: currentPage,
                size: 10
            });

            listBody.innerHTML = `<tr><td colspan="6" style="padding: 40px;">목록을 불러오는 중...</td></tr>`;
            selectAllCheckbox.checked = false;

            try {
                const res = await fetch(`/company/dc/contribution/payable-list?${params.toString()}`);
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || '목록 조회 실패');
                renderTable(data.items || []);
                renderPagination(data);
                updateSummary();
            } catch (e) {
                listBody.innerHTML = `<tr><td colspan="6" style="padding: 40px; color:var(--danger);">${e.message}</td></tr>`;
            }
        }

        function renderTable(items) {
            listBody.innerHTML = '';
            if (items.length === 0) {
                listBody.innerHTML = `<tr><td colspan="6" style="padding: 40px;">조회된 내역이 없습니다.</td></tr>`;
                return;
            }
            items.forEach(item => {
                const tr = document.createElement('tr');
                const isPayable = item.status === '입금대기'; // '입금대기' 상태만 입금 가능

                tr.dataset.itemId = item.itemId;
                tr.dataset.amount = item.amount;
                // [수정] 입금 불가 항목은 시각적으로 구분하고 체크박스 비활성화
                if (!isPayable) {
                    tr.classList.add('not-payable');
                }

                tr.innerHTML = `
                    <td><input type="checkbox" class="item-checkbox" ${isPayable ? '' : 'disabled'}></td>
                    <td>${item.status || '-'}</td>
                    <td>${item.memberName || '-'}</td>
                    <td>${item.accountNo || '-'}</td>
                    <td>${item.planDate || '-'}</td>
                    <td>${item.amount.toLocaleString()}원</td>
                `;
                listBody.appendChild(tr);
            });
        }

        function renderPagination(data) {
            paginationEl.innerHTML = '';
            totalPages = data.totalPages || 0;
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.textContent = '이전';
            prevBtn.className = 'btn';
            prevBtn.disabled = data.page === 0;
            prevBtn.onclick = () => fetchAndRender(currentPage - 1);
            paginationEl.appendChild(prevBtn);

            const pageInfo = document.createElement('span');
            pageInfo.textContent = ` ${data.page + 1} / ${totalPages} `;
            paginationEl.appendChild(pageInfo);

            const nextBtn = document.createElement('button');
            nextBtn.textContent = '다음';
            nextBtn.className = 'btn';
            nextBtn.disabled = data.page >= totalPages - 1;
            nextBtn.onclick = () => fetchAndRender(currentPage + 1);
            paginationEl.appendChild(nextBtn);
        }

        function updateSummary() {
            const selectedCheckboxes = listBody.querySelectorAll('.item-checkbox:checked');
            let totalCount = 0;
            let totalAmount = 0;

            selectedCheckboxes.forEach(cb => {
                const row = cb.closest('tr');
                row.classList.add('selected');
                totalCount++;
                totalAmount += Number(row.dataset.amount);
            });
            
            listBody.querySelectorAll('.item-checkbox:not(:checked)').forEach(cb => {
                cb.closest('tr').classList.remove('selected');
            });

            totalCountEl.textContent = totalCount.toLocaleString();
            totalAmountEl.textContent = totalAmount.toLocaleString();
            payBtn.disabled = totalCount === 0 || sourceAccountId === null;
        }

        // --- 이벤트 리스너 ---
        searchBtn.addEventListener('click', () => fetchAndRender(0));
        statusEl.addEventListener('change', () => fetchAndRender(0)); // [추가] 상태 변경 시 자동 조회
        
        btn1M.addEventListener('click', () => { setDates(1); fetchAndRender(0); });
        btn3M.addEventListener('click', () => { setDates(3); fetchAndRender(0); });
        btn6M.addEventListener('click', () => { setDates(6); fetchAndRender(0); });
        
        selectAllCheckbox.addEventListener('change', (e) => {
            // [수정] 활성화된 체크박스에만 전체선택/해제 적용
            listBody.querySelectorAll('.item-checkbox:not(:disabled)').forEach(cb => {
                cb.checked = e.target.checked;
            });
            updateSummary();
        });

        listBody.addEventListener('change', (e) => {
            if (e.target.classList.contains('item-checkbox')) {
                updateSummary();
            }
        });
        
        payBtn.addEventListener('click', async () => {
            const selectedItems = Array.from(listBody.querySelectorAll('.item-checkbox:checked'))
                                        .map(cb => Number(cb.closest('tr').dataset.itemId));
            
            if (selectedItems.length === 0) return alert('입금할 항목을 선택해주세요.');
            if (!sourceAccountId) return alert('출금계좌 정보가 없습니다.');

            if (!confirm(`총 ${totalCountEl.textContent}건, ${totalAmountEl.textContent}원을 입금하시겠습니까?`)) return;

            payBtn.disabled = true;
            payBtn.textContent = '입금 처리 중...';

            try {
                const res = await fetch('/company/dc/contribution/execute-items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ itemIds: selectedItems, sourceAccountId: sourceAccountId })
                });
                const result = await res.json();
                if (!res.ok) throw new Error(result.message || '입금 처리 실패');
                
                alert(`입금 처리가 성공적으로 요청되었습니다.\n- 처리 건수: ${result.processedCount}건\n- 총 입금액: ${result.totalPaidAmount.toLocaleString()}원`);
                await fetchAndRender(currentPage);
            } catch (e) {
                alert('입금 처리 중 오류가 발생했습니다: ' + e.message);
            } finally {
                payBtn.disabled = false;
                payBtn.textContent = '입금';
            }
        });

        // --- 페이지 시작 ---
        async function start() {
            setDates(1);
            await fetchAndSetSourceAccount();
            await fetchAndRender(0);
        }
        
        start();
    });
    </script>
</body>
</html>
