<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>부담금 입금 실행 (DC) | BNK 퇴직연금</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    @charset "UTF-8";
    :root {
      --pri:#c82020; --pri-h:#b01b1b; --blue:#0052cc;
      --ink:#172b4d; --ink-light:#42526e; --mut:#6b7280;
      --bg:#f4f5f7; --card:#fff;
      --line:#dfe1e6; --line-light:#e9ebf0;
      --ok:#00875a; --ok-light:#e3fcef; --err:#de350b;
      --shadow-sticky:0 -2px 8px rgba(9,30,66,.1);
      --sticky-h:72px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,Segoe UI,Arial,sans-serif}
    .wrap{max-width:100%;margin:0 auto;padding-bottom:calc(var(--sticky-h) + 24px)}
    .page-head{background:var(--card);padding:24px 32px;border-bottom:1px solid var(--line)}
    .page-head h1{margin:0 0 8px;font-size:24px;font-weight:700}
    .page-head .desc{margin:0;color:var(--ink-light);font-size:15px}
    .card{background:var(--card);padding:24px 32px;margin-bottom:10px;border-bottom:1px solid var(--line)}
    .card:last-of-type{border-bottom:none}
    .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--line-light)}
    .card-head h2{margin:0;font-size:17px;font-weight:600;color:var(--blue)}
    .toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .filter-group{display:flex;align-items:center;gap:8px}
    .input,select.input{padding:7px 12px;border:1px solid var(--line);border-radius:4px;background:#fff;font-size:14px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:4px;border:1px solid var(--line);font-weight:500;cursor:pointer;text-decoration:none;font-size:14px}
    .btn-primary{background:var(--pri);color:#fff;border-color:var(--pri)}
    .btn-ghost{background:var(--bg);color:var(--ink-light);border-color:var(--line)}
    .btn:disabled{opacity:.6;cursor:not-allowed;background:#fafafa!important;color:#aaa!important;border-color:var(--line)!important}
    .table-outer{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
    .table-scroll{overflow:auto;max-width:100%}
    .tbl{width:100%;border-collapse:collapse;min-width:1000px;font-size:14px;line-height:1.5}
    .tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--line-light);text-align:center;vertical-align:middle}
    .tbl th{text-align:center}
    .tbl td:nth-child(3){text-align:left}
    .tbl thead th{background:#fafbfc;color:var(--ink-light);font-weight:500;font-size:13px;border-bottom:1px solid var(--line)}
    .tbl tbody tr:last-child td{border-bottom:none}
    .tbl tbody tr:not(.not-payable):hover{background:#f0f6ff}
    .tbl tbody tr.selected{background-color:#fffbe6!important}
    .tbl .num{text-align:right;font-variant-numeric:tabular-nums}
    .tbl .not-payable{color:var(--mut);background-color:#fafbfc}
    .tbl .not-payable .item-checkbox:disabled{cursor:not-allowed}
    .pagination{display:flex;justify-content:center;align-items:center;margin-top:24px;gap:8px}
    .pagination .page-info{font-size:14px;color:var(--mut)}
    .sticky-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--sticky-h);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.8);backdrop-filter:blur(8px);border-top:1px solid var(--line);box-shadow:var(--shadow-sticky);padding:0 32px}
    .sticky-bar .summary{display:flex;align-items:baseline;gap:24px;font-size:15px}
    .sticky-bar .summary .item .label{color:var(--mut)}
    .sticky-bar .summary .item b{color:var(--pri);font-size:18px;margin-left:8px}
    .sticky-bar .actions{display:flex;align-items:center;gap:16px}
    .sticky-bar .account-info{font-size:14px;background:var(--bg);border:1px solid var(--line);padding:8px 12px;border-radius:4px}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>부담금 입금 실행 (DC)</h1>
      <p class="desc">입금 예정 등록이 완료된 내역을 조회하고, 계좌에서 출금하여 입금을 실행합니다.</p>
    </header>

    <section class="card">
      <div class="toolbar">
        <div class="filter-group">
          <label for="fromDate">입금예정일</label>
          <input type="date" id="fromDate" class="input">
          <span>~</span>
          <input type="date" id="toDate" class="input">
          <button class="btn btn-ghost" id="btn1M">1개월</button>
          <button class="btn btn-ghost" id="btn3M">3개월</button>
          <button class="btn btn-ghost" id="btn6M">6개월</button>
        </div>
        <div class="filter-group">
          <label for="payment-status">진행상태</label>
          <select id="payment-status" class="input">
            <option value="ALL">전체</option>
            <option value="PENDING" selected>입금대기</option>
            <option value="PAID">입금완료</option>
            <option value="SKIPPED">입금제외</option>
            <option value="FAILED">실패</option>
          </select>
        </div>
        <button id="searchBtn" class="btn btn-primary" style="margin-left:auto;">조회</button>
      </div>
    </section>

    <section class="card">
      <div class="table-outer">
        <div class="table-scroll">
          <table class="tbl">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAll"></th>
                <th>진행상태</th>
                <th>계약명(회원명)</th>
                <th>계좌번호</th>
                <th>입금예정일</th>
                <th class="num">기업부담금</th>
              </tr>
            </thead>
            <tbody id="payable-list-body"></tbody>
          </table>
        </div>
      </div>
      <div id="pagination" class="pagination"></div>
    </section>
  </div>

  <footer class="sticky-bar">
    <div class="summary">
      <div class="item"><span class="label">총 선택:</span><b id="total-count">0</b>건</div>
      <div class="item"><span class="label">선택 합계:</span><b id="total-amount">0원</b></div>
    </div>
    <div class="actions">
      <div class="account-info">출금계좌: <strong id="sourceAccountInfo">(계좌 정보 없음)</strong></div>
      <button id="payBtn" class="btn btn-primary" style="padding:12px 24px;font-size:16px;font-weight:700;" disabled>입금 실행</button>
    </div>
  </footer>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 요소
    const fromDateEl = document.getElementById('fromDate');
    const toDateEl = document.getElementById('toDate');
    const statusEl = document.getElementById('payment-status');
    const searchBtn = document.getElementById('searchBtn');
    const listBody = document.getElementById('payable-list-body');
    const selectAllCheckbox = document.getElementById('selectAll');
    const totalCountEl = document.getElementById('total-count');
    const totalAmountEl = document.getElementById('total-amount');
    const sourceAccountInfoEl = document.getElementById('sourceAccountInfo');
    const payBtn = document.getElementById('payBtn');
    const paginationEl = document.getElementById('pagination');
    const btn1M = document.getElementById('btn1M');
    const btn3M = document.getElementById('btn3M');
    const btn6M = document.getElementById('btn6M');

    // 상태
    let currentPage = 0;
    let totalPages = 0;
    let sourceAccountId = null;

    // 유틸
    const fmtMoney = n => Number(n || 0).toLocaleString();

    // 로컬 기준 YYYY-MM-DD
    function ymdLocal(d){
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    /**
     * 달 단위 윈도우 설정
     * months=1 → 기준 달 1일 ~ 기준 달 말일
     * months=3 → 기준 달 1일 ~ 기준 달+2 말일
     * months=6 → 기준 달 1일 ~ 기준 달+5 말일
     * anchorDate가 있으면 그 달을 기준, 없으면 오늘(이번 달) 기준
     */
    function setMonthWindow(months, anchorDate){
      const base = anchorDate ? new Date(anchorDate) : new Date();
      const start = new Date(base.getFullYear(), base.getMonth(), 1);
      const end   = new Date(base.getFullYear(), base.getMonth() + months, 0); // months개월 뒤 달의 0일 = 직전달 말일
      fromDateEl.value = ymdLocal(start);
      toDateEl.value   = ymdLocal(end);
    }

    // 출금계좌 조회
    async function fetchAndSetSourceAccount(){
      try{
        const res = await fetch('/company/dc/contribution/source-accounts');
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '출금 계좌 조회 실패');

        const accounts =
          (Array.isArray(data.accounts) && data.accounts) ||
          (Array.isArray(data.rows) && data.rows) ||
          (Array.isArray(data.data?.accounts) && data.data.accounts) ||
          (Array.isArray(data.data?.rows) && data.data.rows) || [];

        if (accounts.length > 0){
          const a = accounts[0];
          sourceAccountId = Number(a.accountId);
          sourceAccountInfoEl.textContent = `${a.accountNo} (잔액: ${fmtMoney(a.balance)}원)`;
          payBtn.disabled = false;
        } else {
          sourceAccountInfoEl.textContent = '등록된 출금계좌가 없습니다.';
          payBtn.disabled = true;
        }
      }catch(e){
        console.error(e);
        sourceAccountInfoEl.textContent = '계좌 조회 오류';
        payBtn.disabled = true;
      }
    }

    // 목록 조회/렌더
    async function fetchAndRender(page = 0){
      currentPage = page;
      const params = new URLSearchParams({
        fromDate: fromDateEl.value,
        toDate: toDateEl.value,
        paymentStatus: statusEl.value,   // ALL | PENDING | PAID | SKIPPED | FAILED
        page: currentPage,
        size: 10
      });

      listBody.innerHTML = `<tr><td colspan="6" style="padding:40px;">목록을 불러오는 중...</td></tr>`;
      selectAllCheckbox.checked = false;

      try{
        const res = await fetch(`/company/dc/contribution/payable-list?${params.toString()}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || '목록 조회 실패');

        const items =
          (Array.isArray(data.content) && data.content) ||
          (Array.isArray(data.items) && data.items) ||
          (Array.isArray(data.rows) && data.rows) ||
          (Array.isArray(data.data?.content) && data.data.content) ||
          (Array.isArray(data.data?.items) && data.data.items) ||
          (Array.isArray(data.data?.rows) && data.data.rows) || [];

        renderTable(items);
        renderPagination(data);
        updateSummary();
      }catch(e){
        listBody.innerHTML = `<tr><td colspan="6" style="padding:40px;color:var(--err);">${e.message}</td></tr>`;
      }
    }

    function renderTable(items){
      listBody.innerHTML = '';
      if (items.length === 0){
        listBody.innerHTML = `<tr><td colspan="6" style="padding:40px;">조회된 내역이 없습니다.</td></tr>`;
        return;
      }
      const frag = document.createDocumentFragment();
      items.forEach(item => {
        const tr = document.createElement('tr');
        const isPayable = (item.status === '입금대기') || (item.paymentStatus === 'PENDING');

        tr.dataset.itemId = item.itemId ?? item.id;
        tr.dataset.amount = item.amount ?? 0;
        if (!isPayable) tr.classList.add('not-payable');

        tr.innerHTML = `
          <td><input type="checkbox" class="item-checkbox" ${isPayable ? '' : 'disabled'}></td>
          <td>${item.status ?? item.paymentStatus ?? '-'}</td>
          <td style="text-align:left;">${item.memberName ?? '-'}</td>
          <td>${item.accountNo ?? '-'}</td>
          <td>${item.planDate ?? '-'}</td>
          <td class="num">${fmtMoney(item.amount)}원</td>
        `;
        frag.appendChild(tr);
      });
      listBody.appendChild(frag);
    }

    function renderPagination(data){
      paginationEl.innerHTML = '';
      totalPages = Number.isFinite(data.totalPages) ? data.totalPages : 0;
      const pageNumber = Number.isFinite(data.number) ? data.number : currentPage;

      if (!totalPages || totalPages <= 1) return;

      const prev = document.createElement('button');
      prev.textContent = '이전';
      prev.className = 'btn btn-ghost';
      prev.disabled = !!data.first || pageNumber <= 0;
      prev.onclick = () => fetchAndRender(pageNumber - 1);
      paginationEl.appendChild(prev);

      const info = document.createElement('span');
      info.className = 'page-info';
      info.textContent = ` ${pageNumber + 1} / ${totalPages} `;
      paginationEl.appendChild(info);

      const next = document.createElement('button');
      next.textContent = '다음';
      next.className = 'btn btn-ghost';
      next.disabled = !!data.last || pageNumber >= totalPages - 1;
      next.onclick = () => fetchAndRender(pageNumber + 1);
      paginationEl.appendChild(next);
    }

    function updateSummary(){
      const selected = listBody.querySelectorAll('.item-checkbox:checked');
      let count = 0, sum = 0;
      listBody.querySelectorAll('tr').forEach(tr => tr.classList.remove('selected'));
      selected.forEach(cb => {
        const tr = cb.closest('tr');
        tr.classList.add('selected');
        count++;
        sum += Number(tr.dataset.amount || 0);
      });
      totalCountEl.textContent = count.toLocaleString();
      totalAmountEl.textContent = `${fmtMoney(sum)}원`;
      payBtn.disabled = (count === 0) || (sourceAccountId == null);
    }

    // 이벤트
    searchBtn.addEventListener('click', () => fetchAndRender(0));

    // 달 단위 버튼: fromDate가 지정되어 있으면 그 달 기준, 아니면 이번 달 기준
    btn1M.addEventListener('click', () => { setMonthWindow(1, fromDateEl.value || undefined); fetchAndRender(0); });
    btn3M.addEventListener('click', () => { setMonthWindow(3, fromDateEl.value || undefined); fetchAndRender(0); });
    btn6M.addEventListener('click', () => { setMonthWindow(6, fromDateEl.value || undefined); fetchAndRender(0); });

    selectAllCheckbox.addEventListener('change', (e) => {
      listBody.querySelectorAll('.item-checkbox:not(:disabled)').forEach(cb => cb.checked = e.target.checked);
      updateSummary();
    });
    listBody.addEventListener('change', (e) => {
      if (e.target.classList.contains('item-checkbox')) updateSummary();
    });

    payBtn.addEventListener('click', async () => {
      const selectedIds = Array.from(listBody.querySelectorAll('.item-checkbox:checked'))
        .map(cb => Number(cb.closest('tr').dataset.itemId));
      if (selectedIds.length === 0) return;

      const amountText = totalAmountEl.textContent;
      if (!confirm(`총 ${selectedIds.length}건, ${amountText}을 입금하시겠습니까?`)) return;

      payBtn.disabled = true;
      const prevText = payBtn.textContent;
      payBtn.textContent = '입금 처리 중...';

      try{
        const res = await fetch('/company/dc/contribution/execute-items', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ itemIds: selectedIds, sourceAccountId })
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.message || '입금 처리 실패');

        alert(`입금 처리가 성공적으로 요청되었습니다.\n- 처리 건수: ${result.processedCount}건\n- 총 입금액: ${fmtMoney(result.totalPaidAmount)}원`);
        await fetchAndRender(currentPage);
      }catch(e){
        alert('입금 처리 중 오류가 발생했습니다: ' + e.message);
      }finally{
        payBtn.textContent = prevText || '입금 실행';
        payBtn.disabled = false;
      }
    });

    // 시작: 이번 달 1일 ~ 말일
    (async function start(){
      setMonthWindow(1);
      await fetchAndSetSourceAccount();
      await fetchAndRender(0);
    })();
  });
</script>

</body>
</html>
