<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>관리자 로그인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f8fafc;}
    .wrap{max-width:420px;margin:8vh auto;padding:0 16px;}
    .card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:24px 22px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
    h1{margin:0 0 12px 0;font-size:22px}
    .field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
    .input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px}
    .btn{width:100%;padding:12px;border:none;border-radius:10px;background:#111827;color:#fff;font-weight:700;margin-top:14px;cursor:pointer}
    .btn[disabled]{opacity:.6;cursor:not-allowed}
    .error{color:#dc2626;text-align:center;min-height:18px;margin-top:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>관리자 로그인</h1>

      <form id="login-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="username">아이디</label>
          <input class="input" id="username" name="username" type="text" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input class="input" id="password" name="password" type="password" required autocomplete="current-password" />
        </div>
        <button class="btn" id="loginBtn" type="submit">로그인</button>
        <div id="errorMsg" class="error" role="status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');
      errorMsg.textContent = '';
      if (!username || !password) { errorMsg.textContent = '아이디/비밀번호를 입력하세요.'; return; }

      btn.disabled = true;
      const body = new URLSearchParams({ username, password }); // 폼 바인딩에 맞춤

      try {
        const res = await fetch('/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' },
          credentials: 'include', // 다른 포트/도메인이면 필수
          body
        });

        if (!res.ok) {
          const t = await res.text().catch(()=> '');
          errorMsg.textContent = t || `로그인 실패 (HTTP ${res.status})`;
          return;
        }

        // Location 헤더 우선, 없으면 JSON의 redirectUrl
        const loc = res.headers.get('Location');
        if (loc) { location.href = loc; return; }

        const data = await res.json().catch(()=> null);
        location.href = (data && data.redirectUrl) ? data.redirectUrl : '/admin';

      } catch (err) {
        errorMsg.textContent = '네트워크 오류가 발생했습니다.';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
