<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="utf-8"/>
  <title th:text="${pageTitle} ?: '관리자'">관리자</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    .wrap{display:flex;min-height:calc(100vh - 56px);}
    aside#sidebar{width:260px;background:#0e2a4d;color:#fff;}
    .submenu a{display:block;padding:10px 14px;color:#dbe6ff;text-decoration:none;}
    .submenu a.is-active{background:#1b3b6b;font-weight:700;}
    main#content{flex:1;padding:16px;background:#f2f6fb;border:6px solid #c82020;}
  </style>
</head>
<body>

<header th:replace="~{admin/fragments/header :: header(${activeCategory})}"></header>

<div class="wrap">
	<aside id="sidebar"
       th:replace="~{admin/fragments/sidebar :: sidebar(${activeCategory}, ${subcats}, ${activeCode})}"></aside>

  <main id="content">
    <div style="text-align:center;margin-top:120px;letter-spacing:2px;">CONTENTS</div>
  </main>
</div>
<script>
  function setActiveByUrl(){
    const path = location.pathname;
    document.querySelectorAll('#sidebar .submenu a').forEach(a=>{
      const on = a.getAttribute('href') === path;
      a.classList.toggle('is-active', on);
      if (on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');
    });
  }
  // 최초 로드
  document.addEventListener('DOMContentLoaded', setActiveByUrl);
  // 콘텐츠 스왑 후 (HTMX로 화면 바뀐 뒤)
  document.body.addEventListener('htmx:afterSwap', e=>{
    if (e.detail.target && e.detail.target.id === 'content') setActiveByUrl();
  });
  // 뒤/앞으로 가기
  window.addEventListener('popstate', setActiveByUrl);
</script>
</body>
</html>
