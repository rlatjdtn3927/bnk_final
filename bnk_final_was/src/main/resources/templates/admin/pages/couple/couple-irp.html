<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="css">
  <style id="page-css" hx-swap-oob="true">
    /* 페이지 전용 스타일 */
    table { width:100%; border-collapse: collapse; margin-top: 1rem; table-layout: fixed; }
    th, td { border:1px solid #ccc; padding: 8px 6px; text-align:center; word-break: break-all; }
    .btn { padding:4px 8px; cursor:pointer; border: none; border-radius: 4px; color: white; margin: 0 2px; }
    .approve { background:#4caf50; }
    .reject { background:#f44336; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .mut { color:#777; font-size:0.9em; }
    tr.removing { opacity: 0; transition: opacity 0.5s ease-out; }
    .loader { font-style: italic; color: #888; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 1000; }
    .toast { padding: 15px 20px; background: #333; color: white; border-radius: 5px; margin-bottom: 10px; opacity: 0; transition: all 0.5s; transform: translateX(100%); }
    .toast.show { opacity: 1; transform: translateX(0); }
  </style>
</th:block>


<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <h2>부부IRP 관리</h2>

  <div style="margin-bottom:10px">
    <button id="reload" class="btn approve">새로고침</button>
    <span id="msg" class="mut"></span>
  </div>

  <table id="tbl">
    <colgroup>
        <col style="width: 7%;">
        <col style="width: 10%;">
        <col style="width: 15%;">
        <col style="width: 15%;">
        <col style="width: 18%;">
        <col style="width: 8%;">
        <col style="width: 27%;">
    </colgroup>
    <thead>
      <tr>
        <th>ID</th>
        <th>신청자ID</th>
        <th>지정된 배우자</th>
        <th>요청일</th>
        <th>사유</th>
        <th>증빙</th>
        <th>처리</th>
      </tr>
    </thead>
    <tbody id="review-tbody"></tbody>
  </table>
  
  <div id="toast-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
        const tbody = document.getElementById('review-tbody');
        const msg = document.getElementById('msg');
        const reloadBtn = document.getElementById('reload');
        const toastContainer = document.getElementById('toast-container');

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            if (isError) toast.style.backgroundColor = '#f44336';
            toastContainer.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        async function load() {
            tbody.innerHTML = `<tr><td colspan="7" class="loader">목록을 불러오는 중...</td></tr>`;
            try {
                const res = await fetch('/link-admin/pending');
                const json = await res.json();
                if (!json.success) throw new Error(json.message || '서버 오류');
                renderTable(json.data || []);
            } catch (e) {
                tbody.innerHTML = `<tr><td colspan="7" style="color:red;">불러오기 실패: ${e.message}</td></tr>`;
            }
        }
        
        function renderTable(rows) {
            tbody.innerHTML = '';
            if (rows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7">검토 대기 중인 항목이 없습니다.</td></tr>`;
            } else {
                rows.forEach(it => {
                    const tr = document.createElement('tr');
                    tr.dataset.linkId = it.linkId;
                    tr.innerHTML = `
                        <td>${it.linkId}</td>
                        <td>${it.applicantUserId ?? '-'}</td>
                        <td>${it.spouseName ?? '미지정'} (ID: ${it.spouseUserId ?? '?'})</td>
                        <td>${it.requestedAt ?? it.appliedAt ?? '-'}</td>
                        <td>${it.reviewReason ?? '-'}</td>
                        <td>${it.proofUrl ? `<a href="${it.proofUrl}" target="_blank">보기</a>` : '-'}</td>
                        <td>
                            <input type="text" placeholder="반려 사유 / 메모" class="memo-input" style="width:100px">
                            <button class="btn approve" data-action="APPROVE">승인</button>
                            <button class="btn reject" data-action="REJECT">반려</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
            msg.textContent = `대기 ${rows.length}건`;
        }

        tbody.addEventListener('click', async (event) => {
            const target = event.target;
            if (target.tagName !== 'BUTTON' || !target.dataset.action) return;

            const action = target.dataset.action;
            const tr = target.closest('tr');
            const linkId = tr.dataset.linkId;
            const memo = tr.querySelector('.memo-input').value;
            
            if (action === 'REJECT' && memo.trim() === '') {
                alert('반려 사유를 입력해주세요.');
                return;
            }
            
            tr.querySelectorAll('button').forEach(btn => btn.disabled = true);
            const originalText = target.textContent;
            target.textContent = '처리중...';

            try {
                const payload = { linkId: Number(linkId), action, reason: memo };
                
                const res = await fetch('/link-admin/decide', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                if (!json.success) throw new Error(json.message || '처리 실패');
                
                showToast(`${linkId}번 요청을 ${originalText} 처리했습니다.`);
                
                tr.classList.add('removing');
                tr.addEventListener('transitionend', () => {
                    tr.remove();
                    const remainingCount = tbody.getElementsByTagName('tr').length;
                    msg.textContent = `대기 ${remainingCount}건`;
                    if(remainingCount === 0) {
                        tbody.innerHTML = `<tr><td colspan="7">검토 대기 중인 항목이 없습니다.</td></tr>`;
                    }
                });
            } catch (e) {
                showToast(`처리 실패: ${e.message}`, true);
                tr.querySelectorAll('button').forEach(btn => btn.disabled = false);
                target.textContent = originalText;
            }
        });

        reloadBtn.addEventListener('click', load);
        load();
    });
  </script>
</th:block>
