<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="css">
  <style id="page-css" hx-swap-oob="true">
      .sales-report-container {
    max-width: 900px;
    margin: 20px auto;
    padding: 20px;
    background: #fff;
    border-radius: 8px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .sales-report-container h2 {
    color: #0e2a4d;
    font-size: 1.6rem;
    margin-bottom: 10px;
  }
  .sales-report-container p {
    color: #555;
    margin-bottom: 20px;
  }
  .sales-summary {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  .sales-summary .card {
    flex: 1;
    background: #f2f6fb;
    padding: 16px;
    border-radius: 6px;
    text-align: center;
  }
  .sales-summary .card h3 {
    font-size: 1.2rem;
    margin-bottom: 8px;
  }
  .sales-summary .card span {
    font-weight: bold;
    font-size: 1.4rem;
    color: #c82020;
  }
  .sales-table {
    width: 100%;
    border-collapse: collapse;
  }
  .sales-table th, .sales-table td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: center;
  }
  .sales-table th {
    background: #f6f8fa;
    font-weight: 600;
  }
  </style>
</th:block>

<th:block th:fragment="content">
  <div class="sales-report-container">
    <h2>판매 리포트</h2>
    <p>이번 달 판매 현황과 주요 지표를 확인하세요.</p>

    <div class="sales-summary">
      <div class="card">
        <h3>총 판매액</h3>
        <span>₩12,340,000</span>
      </div>
      <div class="card">
        <h3>총 주문 수</h3>
        <span>1,245</span>
      </div>
      <div class="card">
        <h3>재구매율</h3>
        <span>24%</span>
      </div>
    </div>

    <table class="sales-table">
      <thead>
        <tr>
          <th>날짜</th>
          <th>주문 수</th>
          <th>판매액</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2025-08-10</td>
          <td>42</td>
          <td>₩420,000</td>
        </tr>
        <tr>
          <td>2025-08-11</td>
          <td>58</td>
          <td>₩580,000</td>
        </tr>
        <tr>
          <td>2025-08-12</td>
          <td>65</td>
          <td>₩650,000</td>
        </tr>
      </tbody>
    </table>
  </div>
</th:block>
