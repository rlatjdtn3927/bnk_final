<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="css">
  <style id="page-css" hx-swap-oob="true">
    :root{ --ink:#111827; --muted:#6b7280; --bg:#f7f7fb; --card:#fff; --bd:#e5e7eb; --accent:#2563eb; }
    body{ color:var(--ink); }
    .page-wrap{ display:grid; gap:16px; }
    .page-header{ display:flex; align-items:center; justify-content:space-between; padding:8px 0 4px; border-bottom:1px solid var(--bd); }
    .page-title{ font-size:22px; font-weight:700; letter-spacing:-0.2px; }
    .page-actions{ display:flex; gap:8px; align-items:center; }
    .btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--bd); background:var(--card); padding:8px 12px; border-radius:10px; font-size:14px; cursor:pointer; }
    .btn.primary{ border-color:var(--accent); color:#fff; background:var(--accent); }
    .asof{ font-size:13px; color:var(--muted); margin-left:8px; }
    .grid-2{ display:grid; grid-template-columns: 1.2fr 1fr; gap:16px; align-items:start; }
    .col{ display:grid; gap:16px; align-content:start; }
    .card{ background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:16px; box-shadow:0 1px 0 rgba(17,24,39,0.02); }
    .card h3{ margin:0 0 10px 0; font-size:16px; }
    
    /* ✅ KPI 그리드를 4컬럼으로 변경 */
    .kpis{ display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; } 
    .kpi{ padding:12px; border:1px dashed var(--bd); border-radius:12px; }
    .kpi .label{ font-size:13px; color:var(--muted); }
    .kpi .value{ font-size:20px; font-weight:700; margin-top:2px; }
    .total{ font-size:28px; font-weight:800; }
    .note{ font-size:12px; color:var(--muted); margin-top:6px; }
    table{ width:100%; border-collapse:collapse; }
    th, td{ padding:10px 8px; border-bottom:1px solid var(--bd); font-size:14px; text-align:right; }
    th:first-child, td:first-child{ text-align:left; }
    th{ background:#fafafa; font-weight:600; }
    .charts canvas{ width:100%; height:280px; }
    
    .grid-2-sm { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .chart-sm canvas{ height: 240px; }
    
    .chart-title{ font-size:15px; font-weight:600; margin-bottom:6px; color:var(--muted); }
    .spacer{ height:4px; }
  </style>
</th:block>


<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <div class="page-wrap">

    <div class="grid-2">
      <div class="col">
        <div class="card">
          <h3>IRP & DC 총자산</h3>
          <div class="kpis">
            <div class="kpi"><div class="label">IRP 총자산</div><div class="value" th:text="${#numbers.formatDecimal(totals.irpTotal, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">IRP 원리금</div><div class="value" th:text="${#numbers.formatDecimal(totals.irpPrincipal, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">IRP 펀드</div><div class="value" th:text="${#numbers.formatDecimal(totals.irpFund, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">IRP 현금</div><div class="value" th:text="${#numbers.formatDecimal(totals.irpCash, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">DC 총자산</div><div class="value" th:text="${#numbers.formatDecimal(totals.dcTotal, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">DC 원리금</div><div class="value" th:text="${#numbers.formatDecimal(totals.dcPrincipal, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">DC 펀드</div><div class="value" th:text="${#numbers.formatDecimal(totals.dcFund, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">DC 현금</div><div class="value" th:text="${#numbers.formatDecimal(totals.dcCash, 0, 'COMMA', 0, 'POINT')}">0</div></div>
          </div>
          <div class="note">총자산 = 현금 + 원리금 + 펀드(평가)</div>
        </div>

        <div class="card">
          <div class="chart-title">상품별 운용비중 (현금 제외)</div>
          <table id="tbl-allocation">
            <thead><tr><th>카테고리</th><th>금액</th><th>비중(%)</th></tr></thead>
            <tbody></tbody>
          </table>
          <div class="note">분모: 원리금 + 펀드(ETF/TDF/FUND)</div>
        </div>

        <div class="card">
          <div class="chart-title">위험/안전 비중 (현금 제외)</div>
          <table id="tbl-risk">
            <thead><tr><th>구분</th><th>금액</th><th>비중(%)</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="col charts">
        <div class="card">
          <div class="chart-title">IRP vs DC 자산 구성</div>
          <div class="spacer"></div>
          <canvas id="barTotalAssets"></canvas>
        </div>

        <div class="grid-2-sm">
          <div class="card chart-sm">
            <div class="chart-title">상품별 운용비중</div>
            <canvas id="donutAllocation"></canvas>
          </div>
          <div class="card chart-sm">
            <div class="chart-title">위험/안전 비중</div>
            <canvas id="donutRisk"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>


  <script th:inline="javascript">
    const totalsJson     = /*[[${totalsJson}]]*/ '{}';
    const allocationJson = /*[[${allocationJson}]]*/ '[]';
    const riskJson       = /*[[${riskJson}]]*/ '[]';

    const totals     = JSON.parse(totalsJson);
    const allocation = JSON.parse(allocationJson);
    const risk       = JSON.parse(riskJson);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  <script>
    const fmtMoney = n => (Number(n)||0).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
    const fmtPct   = n => (Number(n)||0).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Render Tables
    (function renderTables(){
      document.querySelector('#tbl-allocation tbody').innerHTML =
        allocation.map(x => `<tr><td>${x.category}</td><td>${fmtMoney(x.amount)}</td><td>${fmtPct(x.percent)}</td></tr>`).join('');
      document.querySelector('#tbl-risk tbody').innerHTML =
        risk.map(x => `<tr><td>${x.bucket}</td><td>${fmtMoney(x.amount)}</td><td>${fmtPct(x.percent)}</td></tr>`).join('');
    })();

 // 막대 차트
    const barCtx = document.getElementById('barTotalAssets').getContext('2d');
    new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['IRP','DC'],
        datasets: [
          {
            label: '현금',
            data: [totals.irpCash, totals.dcCash],
            backgroundColor: '#36a2eb'
          },
          {
            label: '원리금',
            data: [totals.irpPrincipal, totals.dcPrincipal],
            backgroundColor: '#ff6384'
          },
          {
            label: '펀드',
            data: [totals.irpFund, totals.dcFund],
            backgroundColor: '#ffce56'
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          y: {
            beginAtZero: true,
            ticks: {
              callback: v => `${(v/10000).toLocaleString()}만`
            }
          }
        },
        plugins:{
          legend:{ position:'top' },
          tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${fmtMoney(c.parsed.y)}` } }
        }
      }
    });

    // Doughnut Charts
    new Chart(document.getElementById('donutAllocation').getContext('2d'), {
      type:'doughnut',
      data:{ labels: allocation.map(x=>x.category), datasets:[{ data: allocation.map(x=>x.amount) }] },
      options:{ responsive:true, cutout:'60%', plugins:{ legend:{ position:'right' }, tooltip:{ callbacks:{ label:c=>`${c.label}: ${fmtMoney(c.parsed)} (${fmtPct(allocation[c.dataIndex]?.percent||0)}%)` } } } }
    });

    new Chart(document.getElementById('donutRisk').getContext('2d'), {
      type:'doughnut',
      data:{ labels: risk.map(x=>x.bucket), datasets:[{ data: risk.map(x=>x.amount) }] },
      options:{ responsive:true, cutout:'60%', plugins:{ legend:{ position:'right' }, tooltip:{ callbacks:{ label:c=>`${c.label}: ${fmtMoney(c.parsed)} (${fmtPct(risk[c.dataIndex]?.percent||0)}%)` } } } }
    });

    // CSV Download
    document.getElementById('btn-download').addEventListener('click', () => {
      const totalsCsv = [
        ['type','cash','principal','fund','total'],
        ['IRP', totals.irpCash, totals.irpPrincipal, totals.irpFund, totals.irpTotal],
        ['DC',  totals.dcCash,  totals.dcPrincipal,  totals.dcFund,  totals.dcTotal]
      ].map(row => row.join(',')).join('\n');
      const allocCsv = [['category','amount','percent'], ...allocation.map(x=>[x.category,x.amount,x.percent??0])].map(r=>r.join(',')).join('\n');
      const riskCsv  = [['bucket','amount','percent'],  ...risk.map(x=>[x.bucket,x.amount,x.percent??0])].map(r=>r.join(',')).join('\n');
      [{name:'totals.csv', data:totalsCsv},{name:'allocation.csv', data:allocCsv},{name:'risk.csv', data:riskCsv}]
        .forEach(f=>{
          const blob = new Blob([f.data], { type:'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href=url; a.download=f.name; a.click(); URL.revokeObjectURL(url);
        });
    });
  </script>
</th:block>
