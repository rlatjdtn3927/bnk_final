<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="css">
  <style id="page-css" hx-swap-oob="true">
    :root{ --ink:#111827; --muted:#6b7280; --bg:#f7f7fb; --card:#fff; --bd:#e5e7eb; --accent:#2563eb; }
    body{ color:var(--ink); }
    .page-wrap{ display:grid; gap:16px; }
    .page-header{ display:flex; align-items:center; justify-content:space-between; padding:8px 0 4px; border-bottom:1px solid var(--bd); }
    .page-title{ font-size:22px; font-weight:700; letter-spacing:-0.2px; }
    .page-actions{ display:flex; gap:8px; align-items:center; }
    .btn{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--bd); background:var(--card); padding:8px 12px; border-radius:10px; font-size:14px; cursor:pointer; }
    .btn.primary{ border-color:var(--accent); color:#fff; background:var(--accent); }
    .asof{ font-size:13px; color:var(--muted); margin-left:8px; }
    .grid-2{ display:grid; grid-template-columns: 1.2fr 1fr; gap:16px; }
    .col{ display:grid; gap:16px; align-content:start; }
    .card{ background:var(--card); border:1px solid var(--bd); border-radius:14px; padding:16px; box-shadow:0 1px 0 rgba(17,24,39,0.02); }
    .card h3{ margin:0 0 10px 0; font-size:16px; }
    .kpis{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .kpi{ padding:12px; border:1px dashed var(--bd); border-radius:12px; }
    .kpi .label{ font-size:13px; color:var(--muted); }
    .kpi .value{ font-size:20px; font-weight:700; margin-top:2px; }
    .total{ font-size:28px; font-weight:800; }
    .note{ font-size:12px; color:var(--muted); margin-top:6px; }
    table{ width:100%; border-collapse:collapse; }
    th, td{ padding:10px 8px; border-bottom:1px solid var(--bd); font-size:14px; text-align:right; }
    th:first-child, td:first-child{ text-align:left; }
    th{ background:#fafafa; font-weight:600; }
    .charts canvas{ width:100%; height:280px; } /* ✅ 기본 차트 높이 조정 */
    
    /* ✅ 작은 차트 2개를 가로로 묶기 위한 스타일 추가 */
    .grid-2-sm { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    
    /* ✅ 작은 차트 높이 조정 */
    .chart-sm canvas{ height: 240px; }
    
    .chart-title{ font-size:15px; font-weight:600; margin-bottom:6px; color:var(--muted); }
    .spacer{ height:4px; }
  </style>
</th:block>

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <div class="page-wrap">
    <div class="page-header">
      <div class="page-title">관리자 통계</div>
      <div class="page-actions">
        <button class="btn" type="button" onclick="location.reload()">🔄 새로고침</button>
        <button class="btn" type="button" id="btn-download">⬇️ 다운로드</button>
        <div class="asof">기준시각: <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm:ss')}"></span></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="col">
        <div class="card">
          <h3>IRP 총자산</h3>
          <div class="total" id="irpTotal" th:text="${#numbers.formatDecimal(totals.irpTotal, 0, 'COMMA', 0, 'POINT')}">0</div>
          <div class="kpis">
            <div class="kpi"><div class="label">현금</div><div class="value" id="irpCash" th:text="${#numbers.formatDecimal(totals.irpCash, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">원리금</div><div class="value" id="irpPrincipal" th:text="${#numbers.formatDecimal(totals.irpPrincipal, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">펀드</div><div class="value" id="irpFund" th:text="${#numbers.formatDecimal(totals.irpFund, 0, 'COMMA', 0, 'POINT')}">0</div></div>
          </div>
          <div class="note">총자산 = 현금 + 원리금 + 펀드(평가)</div>
        </div>

        <div class="card">
          <h3>DC 총자산</h3>
          <div class="total" id="dcTotal" th:text="${#numbers.formatDecimal(totals.dcTotal, 0, 'COMMA', 0, 'POINT')}">0</div>
          <div class="kpis">
            <div class="kpi"><div class="label">현금</div><div class="value" id="dcCash" th:text="${#numbers.formatDecimal(totals.dcCash, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">원리금</div><div class="value" id="dcPrincipal" th:text="${#numbers.formatDecimal(totals.dcPrincipal, 0, 'COMMA', 0, 'POINT')}">0</div></div>
            <div class="kpi"><div class="label">펀드</div><div class="value" id="dcFund" th:text="${#numbers.formatDecimal(totals.dcFund, 0, 'COMMA', 0, 'POINT')}">0</div></div>
          </div>
        </div>

        <div class="card">
          <div class="chart-title">상품별 운용비중 (현금 제외)</div>
          <table id="tbl-allocation">
            <thead><tr><th>카테고리</th><th>금액</th><th>비중(%)</th></tr></thead>
            <tbody></tbody>
          </table>
          <div class="note">분모: 원리금 + 펀드(ETF/TDF/FUND)</div>
        </div>

        <div class="card">
          <div class="chart-title">위험/안전 비중 (현금 제외)</div>
          <table id="tbl-risk">
            <thead><tr><th>구분</th><th>금액</th><th>비중(%)</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="col charts">
        <div class="card">
          <div class="chart-title">IRP vs DC 자산 구성</div>
          <div class="spacer"></div>
          <canvas id="barTotalAssets"></canvas>
        </div>

        <div class="grid-2-sm">
          <div class="card chart-sm">
            <div class="chart-title">상품별 운용비중</div>
            <canvas id="donutAllocation"></canvas>
          </div>
          <div class="card chart-sm">
            <div class="chart-title">위험/안전 비중</div>
            <canvas id="donutRisk"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    const RAW = {
      irp: {
        cash:      '/*[[${totals.irpCash}]]*/',
        principal: '/*[[${totals.irpPrincipal}]]*/',
        fund:      '/*[[${totals.irpFund}]]*/',
        total:     '/*[[${totals.irpTotal}]]*/'
      },
      dc: {
        cash:      '/*[[${totals.dcCash}]]*/',
        principal: '/*[[${totals.dcPrincipal}]]*/',
        fund:      '/*[[${totals.dcFund}]]*/',
        total:     '/*[[${totals.dcTotal}]]*/'
      }
    };

    const toNum = v => {
      const n = Number(String(v ?? '0').replace(/,/g,'').trim());
      return Number.isFinite(n) ? n : 0;
    };

    const totals = {
      irp: { cash: toNum(RAW.irp.cash), principal: toNum(RAW.irp.principal), fund: toNum(RAW.irp.fund), total: toNum(RAW.irp.total) },
      dc:  { cash: toNum(RAW.dc.cash),  principal: toNum(RAW.dc.principal),  fund: toNum(RAW.dc.fund),  total: toNum(RAW.dc.total)  }
    };

    const allocation = /*[[${allocationJson}]]*/ '[]';
    const risk       = /*[[${riskJson}]]*/ '[]';
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script>
    const fmtMoney = n => (Number(n)||0).toLocaleString('ko-KR', { maximumFractionDigits: 0 });
    const fmtPct   = n => (Number(n)||0).toLocaleString('ko-KR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    // Render Tables
    (function renderTables(){
      const a = JSON.parse(allocation || '[]');
      const r = JSON.parse(risk || '[]');

      document.querySelector('#tbl-allocation tbody').innerHTML =
        a.map(x => `<tr><td>${x.category}</td><td>${fmtMoney(x.amount)}</td><td>${fmtPct(x.percent)}</td></tr>`).join('');

      document.querySelector('#tbl-risk tbody').innerHTML =
        r.map(x => `<tr><td>${x.bucket}</td><td>${fmtMoney(x.amount)}</td><td>${fmtPct(x.percent)}</td></tr>`).join('');
    })();

 // 막대 차트 (코드 보완 버전)
    const barCtx = document.getElementById('barTotalAssets').getContext('2d');
    new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['IRP','DC'],
        datasets: [
          {
            label: '현금',
            data: [totals.irp.cash, totals.dc.cash],
            backgroundColor: '#36a2eb' // 파란색 계열
          },
          {
            label: '원리금',
            data: [totals.irp.principal, totals.dc.principal],
            backgroundColor: '#ff6384' // 붉은색 계열
          },
          {
            label: '펀드',
            data: [totals.irp.fund, totals.dc.fund],
            backgroundColor: '#ffce56' // 노란색 계열
          }
        ]
      },
      options: {
        responsive: true,
        scales: {
          x: {
            stacked: true,
          },
          y: {
            stacked: true,
            beginAtZero: true,
            ticks: {
              callback: v => `${(v/10000).toLocaleString()}만`
            }
          }
        },
        plugins:{
          legend:{ position:'top' },
          // 툴팁 값 참조를 c.raw에서 c.parsed.y로 명확하게 변경
          tooltip:{ callbacks:{ label: c => `${c.dataset.label}: ${fmtMoney(c.parsed.y)}` } }
        }
      }
    });

    // Doughnut Charts
    const allocData = JSON.parse(allocation || '[]');
    new Chart(document.getElementById('donutAllocation').getContext('2d'), {
      type:'doughnut',
      data:{ labels: allocData.map(x=>x.category), datasets:[{ data: allocData.map(x=>x.amount) }] },
      options:{ responsive:true, cutout:'60%',
        plugins:{ legend:{ position:'right' }, tooltip:{ callbacks:{ label:c=>`${c.label}: ${fmtMoney(c.parsed)} (${fmtPct(allocData[c.dataIndex]?.percent||0)}%)` } } }
      }
    });

    const riskData = JSON.parse(risk || '[]');
    new Chart(document.getElementById('donutRisk').getContext('2d'), {
      type:'doughnut',
      data:{ labels: riskData.map(x=>x.bucket), datasets:[{ data: riskData.map(x=>x.amount) }] },
      options:{ responsive:true, cutout:'60%',
        plugins:{ legend:{ position:'right' }, tooltip:{ callbacks:{ label:c=>`${c.label}: ${fmtMoney(c.parsed)} (${fmtPct(riskData[c.dataIndex]?.percent||0)}%)` } } }
      }
    });

    // CSV Download
    document.getElementById('btn-download').addEventListener('click', () => {
      const a = JSON.parse(allocation || '[]');
      const r = JSON.parse(risk || '[]');

      const totalsCsv = [
        ['type','cash','principal','fund','total'],
        ['IRP', totals.irp.cash, totals.irp.principal, totals.irp.fund, totals.irp.total],
        ['DC',  totals.dc.cash,  totals.dc.principal,  totals.dc.fund,  totals.dc.total]
      ].map(row => row.join(',')).join('\n');

      const allocCsv = [['category','amount','percent'], ...a.map(x=>[x.category,x.amount,x.percent??0])].map(r=>r.join(',')).join('\n');
      const riskCsv  = [['bucket','amount','percent'],  ...r.map(x=>[x.bucket,x.amount,x.percent??0])].map(r=>r.join(',')).join('\n');

      [{name:'totals.csv', data:totalsCsv},{name:'allocation.csv', data:allocCsv},{name:'risk.csv', data:riskCsv}]
        .forEach(f=>{
          const blob = new Blob([f.data], { type:'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href=url; a.download=f.name; a.click(); URL.revokeObjectURL(url);
        });
    });
  </script>
</th:block>
