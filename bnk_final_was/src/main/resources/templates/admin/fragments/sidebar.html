<!-- templates/admin/fragments/sidebar.html -->
<aside id="sidebar" hx-swap-oob="true"
       th:fragment="sidebar(activeCategory, subcats, activeCode)">
  <div style="padding:16px 14px 8px 14px;font-weight:700;">
	<span th:switch="${activeCategory}">
	  <span th:case="'dashboard'">대시보드</span>
	  <span th:case="'stat'">통계</span>
	  <span th:case="'commodity'">상품 관리</span>
	  <span th:case="'customers'">고객 관리</span>
	  <span th:case="'review'">후기 관리</span>
	  <span th:case="'account'">계좌 개설 관리</span>
	  <span th:case="*">대시보드</span>
	</span>
  </div>

  <ul class="submenu" style="list-style:none;margin:0;padding:8px 0;">
    <li th:each="s : ${subcats}">
	<a th:text="${s.label}"
	   th:href="@{|/admin/page/${s.code}|}"
	   hx-target="#content"
	   th:attr="hx-get=@{|/admin/ui/page/${s.code}|},
	            hx-push-url=@{|/admin/page/${s.code}|}"
	   th:classappend="${s.code}==${activeCode} ? ' is-active' : ''"
	   th:attrappend="aria-current=${s.code}==${activeCode} ? 'page' : null">
	</a>
    </li>
  </ul>
</aside>
