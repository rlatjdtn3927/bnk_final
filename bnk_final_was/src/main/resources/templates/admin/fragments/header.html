<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="header(activeCategory, headerCategories)">
  <nav style="background:#fff; border-bottom:1px solid #e5e7eb;
              display:flex; align-items:center; padding:0 24px;
              flex-wrap:wrap; min-height:56px;">

    <!-- 왼쪽 로고 -->
    <div style="display:flex; align-items:center; gap:8px; margin-right:32px; flex:0 0 auto;">
      <a href="/admin" style="display:flex; align-items:center; text-decoration:none;">
        <img src="/images/logo.png" alt="로고" style="height:22px;"/>
      </a>
    </div>

    <!-- 카테고리 메뉴 -->
    <div style="flex:1 1 auto; display:flex; justify-content:center; align-items:center;
                gap:45px; flex-wrap:wrap; min-width:0;">
		<a th:each="cat : ${#lists.isEmpty(headerCategories) ? @sidebarService.getHeaderCategories() : headerCategories}"
		   th:text="${cat.categoryName()}"
		   th:href="@{/admin/page/{code}(code=${cat.defaultPageCode()})}"
		   th:attr="hx-get=@{/admin/ui/category/{category}(category=${cat.categoryCode()})},
		            hx-target='#content',
		            hx-push-url=@{/admin/page/{code}(code=${cat.defaultPageCode()})}" 
		   th:classappend="${activeCategory == cat.categoryCode()} ? 'is-active'"
	       style="text-decoration:none; color:#333; font-weight:500; padding:0 4px; white-space:nowrap;">
		   
		</a>
    </div>

    <!-- 오른쪽 로그인 -->
    <div style="flex:0 0 auto; margin-left:auto; font-size: 12px;">
      <a href="#" style="text-decoration:none; color:#333;">로그인</a>
    </div>
  </nav>
</th:block>
