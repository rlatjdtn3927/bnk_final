<th:block xmlns:th="http://www.thymeleaf.org"
          th:fragment="header(activeCategory, headerCategories)">
  <nav style="height:56px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;gap:24px;padding:0 16px;">

    <!-- 모델 값이 비었으면 @sidebarService.getHeaderCategories() 사용 -->
	<a th:each="cat : ${#lists.isEmpty(headerCategories) ? @sidebarService.getHeaderCategories() : headerCategories}"
	   th:text="${cat.categoryName()}"
	   th:href="@{/admin/page/{code}(code=${cat.defaultPageCode()})}"
	   th:attr="hx-get=@{/admin/ui/category/{category}(category=${cat.categoryCode()})},
	            hx-target='#content',
	            hx-push-url=@{/admin/page/{code}(code=${cat.defaultPageCode()})}"
	   th:classappend="${activeCategory == cat.categoryCode()} ? 'is-active'">
	</a>


    <div style="margin-left:auto;">로그아웃</div>
  </nav>
</th:block>
