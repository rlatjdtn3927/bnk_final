<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <title hx-swap-oob="true" th:text="${pageTitle}">관리자</title>
  <!-- 페이지별 CSS를 OOB로 교체 -->
  <style id="page-css" hx-swap-oob="true"
         th:replace="~{${initialView} :: css}"></style>
</head>
<body>
  <!-- 사이드바 OOB 교체 -->
  <aside id="sidebar" hx-swap-oob="true"
         th:replace="~{admin/fragments/sidebar :: sidebar(${activeCategory}, ${subcats}, ${activeCode})}"></aside>

  <!-- 콘텐츠 교체(이 부분이 #content로 스왑됨) -->
  <div th:replace="~{${initialView} :: content}"></div>
</body>
</html>
