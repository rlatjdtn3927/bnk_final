<div class="w-full">
  <h2 class="text-xl font-semibold mb-3">신청내역 조회/취소</h2>
  <table class="w-full text-sm">
    <thead>
      <tr class="text-left text-neutral-500 border-b">
        <th class="py-2">유형</th><th>내용</th><th>신청일시</th><th>상태</th><th></th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="r : ${requests}" class="border-b">
        <td class="py-2" th:text="${r.type}">유형</td>
        <td th:text="${r.detail}">내용</td>
        <td th:text="${#temporals.format(r.requestedAt, 'yyyy-MM-dd HH:mm')}">시간</td>
        <td th:text="${r.status}">상태</td>
        <td>
          <button class="px-2 py-1 border rounded-xl" th:if="${r.status == '접수'}">취소</button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
