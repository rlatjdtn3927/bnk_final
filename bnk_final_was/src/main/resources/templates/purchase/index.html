<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>BNK 퇴직연금</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 text-neutral-900">
<div class="max-w-6xl mx-auto p-4">
  <header class="mb-4">
    <h1 class="text-2xl font-bold">BNK 퇴직연금</h1>
  </header>

  <!-- 1차 탭 -->
  <nav class="flex gap-2 mb-3">
    <button class="lv1 px-4 py-2 rounded-xl bg-white shadow" data-lv1="status">보유현황</button>
    <button class="lv1 px-4 py-2 rounded-xl bg-white shadow" data-lv1="mgmt">상품관리</button>
  </nav>

  <!-- 2차 탭 -->
  <div id="lv2" class="flex flex-wrap gap-2 mb-4"></div>

  <!-- 콘텐츠 -->
  <section id="content" class="bg-white rounded-2xl shadow p-4 min-h-[460px]">
    <div class="text-neutral-400">로딩중…</div>
  </section>
</div>

<!-- 외부 JS: 프래그먼트 초기화 스크립트(여기에 mount 함수들이 있음) -->
<script src="/js/purchase-planned.js"></script>

<script>
  const subTabs = {
    status: [
      {key:"deposit-form",   name:"계좌 입금",             url:"/purchase/fragment/status/deposit-form"},
      {key:"deposit-history",name:"계좌 입금내역 조회",     url:"/purchase/fragment/status/deposit-history"},
      {key:"tx",             name:"거래내역 조회",          url:"/purchase/fragment/status/tx"},
    ],
    mgmt: [
      {key:"planned",        name:"매수예정상품 등록/변경", url:"/purchase/fragment/mgmt/planned"},
      {key:"holding",        name:"보유상품 변경",          url:"/purchase/fragment/mgmt/holding"},
      {key:"maturity",       name:"만기상품 변경",          url:"/purchase/fragment/mgmt/maturity"},
      {key:"requests",       name:"신청내역 조회/취소",     url:"/purchase/fragment/mgmt/requests"},
      {key:"default-option", name:"디폴트옵션 등록/변경",   url:"/purchase/fragment/mgmt/default-option"},
    ],
  };

  let currentLv1 = "status";
  let currentLv2 = subTabs.status[0].key;

  const lv2Wrap = document.getElementById('lv2');
  const content = document.getElementById('content');

  function renderLv2() {
    lv2Wrap.innerHTML = "";
    subTabs[currentLv1].forEach(tab => {
      const btn = document.createElement('button');
      btn.className = "lv2 px-3 py-2 rounded-xl bg-white shadow";
      btn.dataset.key = tab.key;
      btn.textContent = tab.name;
      btn.onclick = ()=> { currentLv2 = tab.key; load(); highlight(); };
      lv2Wrap.appendChild(btn);
    });
  }

  async function load() {
    const tab = subTabs[currentLv1].find(t => t.key === currentLv2);
    content.innerHTML = '<div class="text-neutral-400">로딩중…</div>';
    const res = await fetch(tab.url, { headers: { "X-Requested-With":"fetch" }});
    content.innerHTML = await res.text();

    // ▼▼ 프래그먼트 부착 후, 해당 화면 초기화 호출 ▼▼
    if (currentLv1 === 'mgmt' && currentLv2 === 'planned' && window.mountPlanned) {
      window.mountPlanned(document.getElementById('content'));
    }
    // 다른 탭도 비동기 로직 필요하면 같은 방식으로:
    // if (currentLv1==='mgmt' && currentLv2==='holding' && window.mountHolding) { window.mountHolding(content); }
  }

  function highlight() {
    document.querySelectorAll('.lv1').forEach(b=>{
      const on = b.dataset.lv1 === currentLv1;
      b.classList.toggle('bg-blue-600', on);
      b.classList.toggle('text-white', on);
    });
    document.querySelectorAll('.lv2').forEach(b=>{
      const on = b.dataset.key === currentLv2;
      b.classList.toggle('bg-blue-600', on);
      b.classList.toggle('text-white', on);
    });
  }

  document.querySelectorAll('.lv1').forEach(b=>{
    b.onclick = () => {
      currentLv1 = b.dataset.lv1;
      currentLv2 = subTabs[currentLv1][0].key;
      renderLv2(); load(); highlight();
    };
  });

  // 초기: 보유현황/계좌 입금
  renderLv2(); load(); highlight();
</script>
</body>
</html>
