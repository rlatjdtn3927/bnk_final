<div class="w-full" data-mode="IRP">
  <div class="flex items-center justify-between mb-3">
    <div class="flex items-center gap-2">
      <h2 class="text-xl font-semibold">매수예정상품 등록/변경</h2>
      <span id="mode-badge" class="ml-3 text-sm px-2 py-1 rounded bg-neutral-200">본인부담금(IRP)</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="btn-toggle" class="px-3 py-1 border rounded-xl">퇴직금으로 전환</button>
      <button id="btn-next" class="px-3 py-1 bg-blue-600 text-white rounded-xl">다음</button>
    </div>
  </div>

  <div class="flex items-center justify-between mb-2 text-sm text-neutral-600">
    <div>총 비율 합계: <b id="totalRatio">0%</b> <span class="text-neutral-400">(100%이어야 다음 가능)</span></div>
    <div class="flex gap-2">
      <button id="btn-replace-all" class="px-3 py-1 border rounded-xl">변경</button>
      <button id="btn-add" class="px-3 py-1 border rounded-xl">+ 상품 추가</button>
    </div>
  </div>

  <div id="list-empty" class="p-6 text-center text-neutral-500 border rounded-xl hidden">아직 등록된 예정상품이 없습니다.</div>
  <div id="item-list" class="grid grid-cols-1 gap-3"></div>

  <!-- STEP 2: 서류 동의 -->
  <div id="agree-panel" class="hidden mt-4 border rounded-xl p-4">
    <div class="font-medium mb-3">서류 동의</div>
    <label class="flex items-center gap-2 mb-2"><input type="checkbox" id="ag1"/> 투자설명서(간이) 확인 및 동의</label>
    <label class="flex items-center gap-2 mb-2"><input type="checkbox" id="ag2"/> 상품약관 확인 및 동의</label>
    <label class="flex items-center gap-2"><input type="checkbox" id="ag3"/> 투자설명서(본) 확인 및 동의</label>
    <div class="flex justify-end mt-3">
      <button id="btn-review" class="px-3 py-2 bg-blue-600 text-white rounded-xl">다음</button>
    </div>
  </div>

  <!-- STEP 3: 검토 -->
  <div id="review-panel" class="hidden mt-4">
    <div class="grid md:grid-cols-2 gap-4">
      <div class="border rounded-xl p-4">
        <div class="font-medium mb-2">변경 전 운용비율</div>
        <table class="w-full text-sm"><thead><tr class="text-left text-neutral-500 border-b">
          <th class="py-2">상품</th><th class="text-right">비율(%)</th></tr></thead><tbody id="tbl-before"></tbody></table>
      </div>
      <div class="border rounded-xl p-4">
        <div class="font-medium mb-2">변경 후 운용비율</div>
        <table class="w-full text-sm"><thead><tr class="text-left text-neutral-500 border-b">
          <th class="py-2">상품</th><th class="text-right">비율(%)</th></tr></thead><tbody id="tbl-after"></tbody>
          <tfoot><tr><td class="py-2 text-right font-medium">합계</td><td id="after-sum" class="text-right font-medium">0</td></tr></tfoot>
        </table>
      </div>
    </div>
    <div class="flex justify-end mt-3">
      <button id="btn-submit" class="px-3 py-2 bg-blue-600 text-white rounded-xl">등록</button>
    </div>
  </div>

  <!-- 완료 -->
  <div id="done-panel" class="hidden mt-4 border rounded-xl p-6 text-center">
    <div class="text-2xl font-bold mb-2">등록/변경이 완료되었습니다.</div>
    <div class="text-neutral-600">확인을 누르면 다음 운용구분으로 진행합니다.</div>
    <div class="mt-3"><button id="btn-done-ok" class="px-4 py-2 bg-blue-600 text-white rounded-xl">확인</button></div>
  </div>

  <!-- 상품 선택 모달 -->
  <div id="picker" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white w-[720px] max-w-[94vw] rounded-2xl shadow p-4">
      <div class="flex items-center justify-between mb-3">
        <div class="font-semibold">상품 선택</div>
        <button id="picker-close" class="px-2 py-1 border rounded-xl">닫기</button>
      </div>
      <div class="flex flex-wrap gap-2 mb-3" id="cat-buttons"></div>
      <div class="max-h-[360px] overflow-auto border rounded-xl">
        <div id="picker-list" class="divide-y"></div>
        <div id="picker-empty" class="p-6 text-center text-neutral-500 hidden">해당 카테고리 상품 없음</div>
      </div>
      <div class="flex items-center justify-between mt-3">
        <div class="text-sm text-neutral-500">선택 비율:
          <input id="pick-ratio" type="number" min="1" max="100" class="ml-1 w-20 border rounded px-2 py-1" placeholder="%" />
          · 현재 합계: <span id="cur-sum">0</span>%</div>
        <div class="flex gap-2">
          <button id="picker-cancel" class="px-3 py-1 border rounded-xl">취소</button>
          <button id="picker-apply-all" class="px-3 py-1 bg-blue-600 text-white rounded-xl hidden">모두 변경 적용</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 토스트 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 hidden">
    <div class="px-4 py-2 rounded-xl shadow bg-black/80 text-white" id="toast-msg"></div>
  </div>
</div>

<script>
(() => {
  const root = document.currentScript.previousElementSibling;
  let mode = 'IRP';   // IRP | DC
  let pickerAll = false;
  let currentCat = '예금';
  const categories = ['예금','TDF','펀드','ETF','현금성자산'];

  const el = sel => root.querySelector(sel);
  const show = (x, on) => x.classList.toggle('hidden', !on);
  const toast = (msg)=>{ const t=el('#toast'); el('#toast-msg').textContent=msg; show(t,true); setTimeout(()=>show(t,false),1500); };

  // ---------- 렌더/로드 ----------
  async function loadState(){
    const res = await fetch(`/api/purchase/planned/state?mode=${mode}`);
    const data = await res.json();
    renderList(data.items);
    el('#totalRatio').textContent = data.totalRatio + '%';
    el('#cur-sum').textContent = data.totalRatio;
  }

  function renderList(items){
    const list = el('#item-list');
    const empty = el('#list-empty');
    list.innerHTML = '';
    if(!items || items.length===0){ show(empty,true); return; }
    show(empty,false);
    items.forEach((it, idx)=>{
      const row = document.createElement('div');
      row.className = 'border rounded-xl p-3';
      row.innerHTML = `
        <div class="flex items-start justify-between">
          <div>
            <div class="text-xs uppercase tracking-wider text-neutral-500">${it.category}</div>
            <div class="font-medium">${it.name}</div>
            <div class="text-sm text-neutral-500">${it.note || '-'}</div>
          </div>
          <div class="flex items-center gap-4">
            <div>
              <div class="text-xs text-neutral-500">비율(%)</div>
              <input type="number" min="0" max="100" class="w-24 border rounded px-2 py-1" value="${it.ratio}" data-idx="${idx}" data-type="ratio">
            </div>
            <div>
              <div class="text-xs text-neutral-500">금액(원)</div>
              <input type="number" class="w-32 border rounded px-2 py-1" value="${it.amount||0}" data-idx="${idx}" data-type="amount">
            </div>
            <button class="px-3 py-1 border rounded-xl" data-idx="${idx}" data-type="remove">삭제</button>
          </div>
        </div>`;
      list.appendChild(row);
    });
  }

  // ---------- 제품 선택 모달 ----------
  async function openPicker(all){
    pickerAll = !!all;
    el('#picker-apply-all').classList.toggle('hidden', !pickerAll);
    currentCat = '예금';
    buildCatButtons();
    await loadProducts(currentCat);
    el('#pick-ratio').value = '';
    root.querySelector('#cur-sum').textContent = el('#totalRatio').textContent.replace('%','');
    show(el('#picker'), true);
  }
  function closePicker(){ show(el('#picker'), false); }

  function buildCatButtons(){
    const wrap = el('#cat-buttons');
    wrap.innerHTML = '';
    categories.forEach(c=>{
      const b = document.createElement('button');
      b.className = 'px-3 py-1 rounded-xl border';
      b.textContent = c;
      if(c===currentCat){ b.classList.add('bg-blue-600','text-white'); }
      b.onclick = async () => { currentCat=c; buildCatButtons(); await loadProducts(c); };
      wrap.appendChild(b);
    });
  }

  async function loadProducts(cat){
    const res = await fetch(`/api/purchase/planned/products?category=${encodeURIComponent(cat)}`);
    const data = await res.json();
    const list = el('#picker-list');
    list.innerHTML = '';
    const none = el('#picker-empty');
    if(!data.products || data.products.length===0){ show(none,true); return; }
    show(none,false);
    data.products.forEach(p=>{
      const row = document.createElement('div');
      row.className = 'p-3 flex items-center justify-between';
      row.innerHTML = `
        <div>
          <div class="text-xs text-neutral-500">${p.category}</div>
          <div class="font-medium">${p.name}</div>
          <div class="text-sm text-neutral-500">${p.note||'-'}</div>
        </div>
        <button class="px-3 py-1 bg-blue-600 text-white rounded-xl">선택</button>`;
      row.querySelector('button').onclick = async () => {
        const ratio = +el('#pick-ratio').value || 0;
        if(ratio<=0 || ratio>100) return toast('비율은 1~100');
        const body = {
          mode, ratio,
          op: pickerAll ? 'replaceAll' : 'add',
          product: p
        };
        const r = await fetch('/api/purchase/planned/change', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
        const res = await r.json();
        if(r.ok){
          closePicker();
          await loadState();
        } else {
          toast(res.error || '오류');
        }
      };
      list.appendChild(row);
    });
  }

  // ---------- 이벤트 바인딩 ----------
  el('#btn-add').onclick = ()=> openPicker(false);
  el('#btn-replace-all').onclick = ()=> openPicker(true);
  el('#picker-close').onclick = closePicker;
  el('#picker-cancel').onclick = closePicker;

  el('#item-list').addEventListener('input', async (e)=>{
    const t = e.target;
    const idx = +t.dataset.idx;
    if(Number.isNaN(idx)) return;
    if(t.dataset.type==='ratio'){
      const body = {mode, op:'updateRatio', index: idx, ratio: +t.value || 0};
      const r = await fetch('/api/purchase/planned/change', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const data = await r.json();
      if(r.ok){ el('#totalRatio').textContent = data.totalRatio + '%'; el('#cur-sum').textContent = data.totalRatio; }
      else toast(data.error||'오류');
    } else if(t.dataset.type==='amount'){
      const body = {mode, op:'updateAmount', index: idx, amount: +t.value || 0};
      await fetch('/api/purchase/planned/change', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    }
  });

  el('#item-list').addEventListener('click', async (e)=>{
    const t = e.target;
    if(t.dataset.type==='remove'){
      const idx = +t.dataset.idx;
      const body = {mode, op:'remove', index: idx};
      const r = await fetch('/api/purchase/planned/change', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
      const data = await r.json();
      if(r.ok){ await loadState(); } else toast(data.error||'오류');
    }
  });

  el('#btn-next').onclick = async ()=>{
    // step 1 → 2
    const r = await fetch('/api/purchase/planned/next', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({mode})});
    const data = await r.json();
    if(r.ok){
      show(el('#agree-panel'), true);
      el('#btn-next').disabled = true;
    } else {
      toast(data.error || '합계 100%가 아닙니다.');
    }
  };

  el('#btn-review').onclick = async ()=>{
    // 동의 체크
    const agr = { mode,
      summary: el('#ag1').checked,
      terms: el('#ag2').checked,
      prospectus: el('#ag3').checked
    };
    const r1 = await fetch('/api/purchase/planned/agreements', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(agr)});
    const d1 = await r1.json();
    if(!r1.ok) return toast(d1.error || '동의가 필요합니다.');

    // 리뷰 데이터
    const r2 = await fetch(`/api/purchase/planned/review?mode=${mode}`);
    const d2 = await r2.json();
    const tb = el('#tbl-before'); tb.innerHTML='';
    const ta = el('#tbl-after');  ta.innerHTML='';
    (d2.before||[]).forEach(b=>{
      tb.insertAdjacentHTML('beforeend', `<tr class="border-b"><td class="py-2"><div class="text-xs text-neutral-500">${b.category}</div><div class="font-medium">${b.name}</div></td><td class="text-right">${b.ratio}</td></tr>`);
    });
    (d2.after||[]).forEach(a=>{
      ta.insertAdjacentHTML('beforeend', `<tr class="border-b"><td class="py-2"><div class="text-xs text-neutral-500">${a.category}</div><div class="font-medium">${a.name}</div></td><td class="text-right">${a.ratio}</td></tr>`);
    });
    el('#after-sum').textContent = d2.totalAfter;
    show(el('#review-panel'), true);
  };

  el('#btn-submit').onclick = async ()=>{
    const r = await fetch('/api/purchase/planned/submit', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({mode})});
    const d = await r.json();
    if(r.ok){
      toast(d.message || '완료');
      show(el('#done-panel'), true);
    } else {
      toast(d.error || '오류');
    }
  };

  el('#btn-done-ok').onclick = async ()=>{
    // IRP 완료 후 DC로 넘어가도록
    if(mode==='IRP'){
      mode = 'DC';
      el('#mode-badge').textContent = '퇴직금(DC)';
      el('#btn-toggle').textContent = '본인부담금으로 전환';
    }else{
      mode = 'IRP';
      el('#mode-badge').textContent = '본인부담금(IRP)';
      el('#btn-toggle').textContent = '퇴직금으로 전환';
    }
    // 초기화
    show(el('#agree-panel'), false);
    show(el('#review-panel'), false);
    show(el('#done-panel'), false);
    el('#btn-next').disabled = false;
    await loadState();
  };

  el('#btn-toggle').onclick = async ()=>{
    mode = (mode==='IRP') ? 'DC' : 'IRP';
    el('#mode-badge').textContent = (mode==='IRP') ? '본인부담금(IRP)' : '퇴직금(DC)';
    el('#btn-toggle').textContent = (mode==='IRP') ? '퇴직금으로 전환' : '본인부담금으로 전환';
    show(el('#agree-panel'), false);
    show(el('#review-panel'), false);
    show(el('#done-panel'), false);
    el('#btn-next').disabled = false;
    await loadState();
  };

  // 초기 로드
  loadState();
})();
</script>
