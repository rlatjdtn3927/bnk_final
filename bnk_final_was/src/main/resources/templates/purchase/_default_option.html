<div class="w-full">
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-xl font-semibold">디폴트옵션 등록/변경</h2>
    <button class="px-3 py-1 bg-blue-600 text-white rounded-xl">저장</button>
  </div>

  <div class="grid gap-3" th:if="${defaults}">
    <div th:each="d : ${defaults}" class="border rounded-xl p-3 flex items-center justify-between">
      <div class="font-medium" th:text="${d.name}">상품명</div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-neutral-500">비율(%)</span>
        <input type="number" class="w-20 border rounded px-2 py-1" th:value="${d.ratio}" min="0" max="100"/>
      </div>
    </div>
  </div>

  <div class="mt-4"><button class="px-3 py-2 border rounded-xl">+ 상품 추가</button></div>
</div>
