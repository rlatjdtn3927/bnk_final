<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>상품관리</title>
  <link th:href="@{/css/purchase.css}" rel="stylesheet"/>
</head>
<body>
<header class="header">
  <div class="brand"><span class="dot"></span> 상품관리</div>
  <nav class="tabs">
    <a th:href="@{/purchase/holdings}" class="tab">보유현황</a>
    <a th:href="@{/purchase/products}" class="tab active">상품관리</a>
    <a th:href="@{/purchase/trade}" class="tab">매수/변경</a>
    <a th:href="@{/purchase/trade/history}" class="tab">변경내역</a>
  </nav>
</header>

<main class="container">

  <!-- 1) 업무 선택 -->
  <section class="card">
    <div class="section-title">원하시는 업무를 선택하세요</div>
    <div class="tiles">
      <div class="tile" id="goChange">
        <div class="tit">보유상품 변경</div>
        <div class="muted mt-4">현재 보유 중인 상품을 다른 상품으로 변경</div>
      </div>
      <div class="tile" id="goMaturity">
        <div class="tit">만기상품 변경예약</div>
        <div class="muted mt-4">예금(원리금보장) 만기분을 다른 상품으로 전환</div>
      </div>
      <div class="tile" id="goPending">
        <div class="tit">매수예정상품 등록/변경</div>
        <div class="muted mt-4">본인부담금 운용 비율 설정 후 매수</div>
      </div>
    </div>
  </section>

  <!-- 2) 계정/계좌 선택 + 보유상품 목록 -->
  <section class="card mt-16">
    <div class="section-title">계정/계좌 선택</div>
    <div class="grid grid-3">
      <div>
        <label>계좌 유형</label>
        <select id="accountType" class="input">
          <option value="IRP">IRP</option>
          <option value="DC">DC</option>
        </select>
      </div>
      <div>
        <label>계좌 식별자 (acountId)</label>
        <input id="acountId" class="input" type="text" placeholder="IRP: 계좌번호 / DC: dc_account.id"/>
      </div>
      <div class="row" style="margin-top:22px">
        <button class="btn" id="loadPortfolio">보유상품 보기</button>
        <span class="badge" id="statusBadge">대기</span>
      </div>
    </div>

    <div class="mt-16">
      <table class="table">
        <thead>
        <tr><th>상품ID</th><th>유형</th><th class="num">수량</th><th class="num">평가금액</th></tr>
        </thead>
        <tbody id="portfolioBody"><tr><td colspan="4">데이터 없음</td></tr></tbody>
      </table>
    </div>
  </section>

</main>

<!-- 외부 스크립트 -->
<script th:src="@{/js/purchase/products.js}"></script>
</body>
</html>
