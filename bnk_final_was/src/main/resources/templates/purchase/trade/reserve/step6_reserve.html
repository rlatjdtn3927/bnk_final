<!-- src/main/resources/templates/purchase/trade/step6.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>STEP6. 완료</title>
<style>
/* ===== 레이아웃 ===== */
html, body { height:100%; }
body{ font-family:'Pretendard',sans-serif; margin:0; color:#222; background:#f9fafb;}
.layout{ height:100vh; display:flex; flex-direction:column; }

/* 헤더 고정 */
.header-wrap{ position:sticky; top:0; z-index:1000; background:#fff; border-bottom:1px solid #eee; }
.header{ max-width:960px; margin:0 auto; padding:14px 16px; }
.page-title{ font-size:20px; font-weight:700; margin:6px 0; }

/* 본문만 스크롤 */
.content{ flex:1 1 auto; overflow:auto; min-height:0; -webkit-overflow-scrolling:touch; padding-bottom:120px; }
.divider{ height:4px; background:#eee; border-radius:1px; }

/* 섹션/카드 */
.section{ max-width:960px; margin:0 auto; padding:12px 16px 28px; }
.section h1{ font-size:20px; font-weight:700; margin:8px 0 12px; }
.muted{ color:#6b7280; font-size:14px; }

.card{
  background:#fff; border:1px solid #f0f0f0; border-radius:18px;
  padding:20px; box-shadow:0 4px 8px rgba(0,0,0,.03);
}
.card > div:first-child { font-weight:700; margin-bottom:12px; font-size:16px; }

/* 항목 스타일 */
.row{ margin-bottom:16px; }
.row:last-child{ margin-bottom:0; }
.name{ font-size:15px; font-weight:600; }
.ratio{ font-weight:700; font-size:15px; margin-top:4px; text-align:right; }

/* progress bar */
.bar-wrap{width:100%; background:#f3f4f6; height:8px; border-radius:6px; overflow:hidden; margin-top:6px;}
.bar{height:100%; background:#3b82f6; border-radius:6px;}

/* 작은 버튼 (적용) */
.row-actions{ margin-top:16px; display:flex; justify-content:flex-end; }
.btn{ display:inline-flex; align-items:center; justify-content:center; cursor:pointer; user-select:none; }
.btn-primary{
  height:38px; padding:0 16px; border-radius:10px; border:none;
  background:#fff3f3; color:#f85151; font-weight:700; font-size:14px;
  border:1px solid #f85151; transition:all .2s ease;
}
.btn-primary:hover{ filter:brightness(.98); }

/* 하단 고정 버튼 (보유현황으로) */
.actions{
  position:fixed; left:0; right:0; bottom:0; z-index:1100;
  background:#fff; border-top:1px solid #eee;
  padding:14px 16px 22px; margin:0 auto;
  max-width:960px; display:grid; grid-template-columns:1fr; gap:12px;
}
.actions a{
  display:flex; align-items:center; justify-content:center;
  height:56px; border-radius:14px; font-size:18px; font-weight:700;
  text-decoration:none; color:#fff; background:#f85151;
}

/* 모달 */
.modal{
  display:none; position:fixed; z-index:2000;
  left:0; top:0; right:0; bottom:0;
  background:rgba(0,0,0,0.4);
  align-items:center; justify-content:center;
}
.modal-content{
  background:#fff; padding:24px 20px; border-radius:14px;
  max-width:300px; width:80%; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.15);
}
.modal-content p{ margin:0 0 16px; font-size:16px; font-weight:600; }
.modal-content button{
  background:#f85151; border:none; color:#fff;
  padding:10px 20px; border-radius:10px;
  font-weight:700; font-size:15px; cursor:pointer;
}
.modal-content button:hover{ filter:brightness(.95); }

/* 반응형 */
@media (max-width:500px){
  .page-title{ font-size:18px; }
  .section h1{ font-size:18px; }
  .card > div:first-child { font-size:15px; }
  .name{ font-size:14px; }
  .ratio{ font-size:14px; }
}
@supports(padding:max(0px)){
  .actions{ padding-bottom:max(22px, env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<!-- 전체 레이아웃 랩 -->
<div class="layout">
  <!-- 헤더 부분 -->
  <div class="header-wrap">
    <div class="header">
      <h2 class="page-title">매수상품관리</h2>
    </div>
  </div>
  
  <main class="content">
    <div class="divider"></div>

	<div class="section">
	  <h1>완료</h1>
	
	  <!-- 세션 JSON 원문(escape 없이) -->
	  <script id="json-source" type="application/json"
	          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].sourceProdIdList : '[]'}"></script>
	  <script id="json-target" type="application/json"
	          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].targetProdIdList : '[]'}"></script>
	
	  <div id="sumBanner" class="banner" style="display:none"></div>
	
	  <section class="card">
	    <div style="font-weight:700;margin-bottom:6px">적용 내역</div>
	    <div id="afterList">
	      <div class="muted">표시할 항목이 없습니다.</div>
	    </div>
	
	    <div class="row-actions">
	      <button id="applyBtn" class="btn btn-primary">적용</button>
	    </div>
	  </section>
	  
	  <div class="actions">
	    <a class="btn btn-link" th:href="@{/purchase/products}">상품관리</a>
	  </div>
	</div> <!-- section -->
  </main>
</div><!-- layout -->

<!-- ✅ 모달 -->
<div id="applyModal" class="modal">
  <div class="modal-content">
    <p>적용되었습니다.</p>
    <button id="modalOkBtn">확인</button>
  </div>
</div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);

  function parseDeep(text){
    try{
      let v = JSON.parse(text||'[]');
      if (typeof v === 'string') { try{ v = JSON.parse(v); }catch{} }
      return v;
    }catch{return []}
  }

  const source = parseDeep($("json-source").textContent); // [{product:{productId,productName},ratio},...]
  const afterList = $("afterList");
  const sumBanner = $("sumBanner");

  // 렌더 + 합계/현금성자산
  let sum = 0;
  const items = [];
  source.forEach(x=>{
    const id = x?.product?.productId || x?.prodId;
    const nm = x?.product?.productName || id;
    const r  = Number(x?.ratio ?? 0);
    if (!id) return;
    sum += isFinite(r) ? r : 0;
    items.push({id, name:nm, ratio:r, type: id.startsWith("PG") ? "원리금보장" : "펀드/ETF/TDF"});
  });
  const cash = Math.max(0, 100 - sum);
  if (cash > 0) items.push({id:"CASH", name:"현금성자산", ratio:cash, type:"현금"});

  if (items.length === 0) {
    afterList.innerHTML = '<div class="muted">표시할 항목이 없습니다.</div>';
  } else {
    afterList.innerHTML = items.map(it => `
      <div class="row">
        <div class="name">${it.name}${it.id!=="CASH" ? `<span class="chip">${it.type}</span>` : ""}</div>
        <div class="ratio">${it.ratio}%</div>
      </div>
    `).join("");
  }

  // 적용 버튼 → AP 호출
  $("applyBtn").addEventListener("click", async ()=>{
    try{
      const res = await fetch('/purchase/api/trade/reserve/apply', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: '{}'   // 세션 기반 처리라 바디 불필요
      });
      const json = await res.json();
      if(json.success){
        $("applyModal").style.display = "flex"; // 모달 열기
      }else{
        alert("적용 실패: " + (json.message || "알 수 없는 오류"));
      }
    }catch(e){
      alert("적용 중 오류: " + e);
    }
  });

  // 모달 확인 버튼 → 페이지 이동
  $("modalOkBtn").addEventListener("click", ()=>{
    window.location.href = "/purchase/products";
  });
})();
</script>
</body>
</html>
