<!-- templates/purchase/trade/step4.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>서류 동의 - Step 4</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* ===== Theme & utilities ===== */
:root{
  --bg:#fff;                 /* 페이지 배경 */
  --text:#111827;               /* 본문 텍스트 */
  --muted:#6B7280;              /* 보조 텍스트 */
  --card:#FFFFFF;               /* 카드 배경 */
  --card-border:#EEE;
  --shadow:0 10px 30px rgba(0,0,0,.10);

  --btn-gray:#8e94a6;           /* 이전(회색) 버튼 */
  --btn-red:#f85151;            /* 다음(빨강) 버튼 */
}

body{
  font-family: 'Pretendard', sans-serif;
  margin:0;
  padding: 0;
  color: #222;
}

/* Tailwind 비의존 유틸 덮어쓰기 */
.bg-neutral-100{background:var(--bg)!important;}
.text-neutral-900{color:var(--text)!important;}
.max-w-3xl{max-width:768px;margin-left:auto;margin-right:auto;}
.mx-auto{margin-left:auto;margin-right:auto;}
.div{
  margin: 0 auto;
  padding:16px 16px;
}
.mb-4{margin-bottom:16px;}
.mb-5{margin-bottom:20px;}
.mb-6{margin-bottom:24px;}
.space-y-3>*+*{margin-top:12px;}
.rounded-2xl{border-radius:20px;}
.rounded-xl{border-radius:14px;}
.shadow-sm{box-shadow:var(--shadow); border:1px solid var(--card-border);}
.bg-white{background:var(--card);}

.muted{color:var(--muted);}

/* 제목 영역 톤 */
header h1{font-size:20px;font-weight:800;margin:0 0 6px;}
header .muted{font-size:13px}

/* 세션 pill (계좌유형/ID/투자성향) */
.pill{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 10px;border-radius:999px;
  background:#F1F5F9;color:#475569;font-size:12px;font-weight:600;
  border:1px solid #E5E7EB;
}

/* 문서 리스트(동적 주입 대비 기본 카드 톤) */
#docList .doc, #docList .card, #docList > *{
  background:var(--card); border:1px solid var(--card-border);
  border-radius:16px; padding:14px;
}

/* 전체 동의 카드 */
#checkAll{width:18px;height:18px}
#progress{color:var(--muted);font-weight:600}

/* ===== 하단 고정 CTA 바 (원본 버튼을 그대로 사용) ===== */
#consentForm{position:relative; padding-bottom:110px;} /* 버튼바와 겹침 방지 */

#consentForm > .flex{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(768px, calc(100% - 24px));
  background:rgba(255,255,255,.92);
  backdrop-filter:saturate(1.2) blur(6px);
  border:1px solid var(--card-border);
  border-radius:20px; padding:12px;
  box-shadow:0 18px 40px rgba(0,0,0,.12);
  display:grid!important; grid-template-columns:1fr 1fr; gap:12px;
  z-index:50;
}

/* 왼쪽: '이전으로' 링크를 큼직한 회색 버튼처럼 */
#consentForm > .flex a{
  display:inline-flex; align-items:center; justify-content:center;
  height:56px; width:100%;
  border-radius:14px; font-size:16px; font-weight:800;
  background:var(--btn-gray); color:#fff; border:none;
  box-shadow:0 6px 16px rgba(0,0,0,.08);
  text-decoration:none;
  transition:transform .05s ease, filter .15s ease;
}

/* 하단 고정 CTA 바: 꽉차게 + 라운드/그림자 제거 */
#consentForm > .flex{
  position:fixed;
  left:0; right:0; bottom:calc(0px + env(safe-area-inset-bottom));
  transform:none;
  width:100%; max-width:none;

  background:#fff;               /* 전체 폭 배경 */
  border-top:1px solid #eee;     /* 위쪽 경계선만 */
  border-radius:0;               /* 라운드 제거 */
  box-shadow:none;               /* 그림자 제거 */
  backdrop-filter:none;

  padding:14px 16px 30px 16px;             /* 좌우 여백 */
  display:grid !important;
  grid-template-columns:1fr 1fr; /* 이전 / 다음 */
  gap:12px;
  z-index:50;
}
#consentForm > .flex a:hover{filter:brightness(.98)}
#consentForm > .flex a:active{transform:translateY(1px)}
/* 내용이 바와 겹치지 않도록 여백 유지 */
#consentForm{ padding-bottom:110px; }

/* 오른쪽: '다음' 버튼을 빨간 CTA로 */
#nextBtn{
  height:56px; width:100%;
  border-radius:14px; font-size:16px; font-weight:800;
  background:var(--btn-red); color:#fff; border:none;
  box-shadow:0 6px 16px rgba(0,0,0,.10);
  transition:transform .05s ease, filter .15s ease, opacity .2s ease;
}
#nextBtn:hover{filter:brightness(.98)}
#nextBtn:active{transform:translateY(1px)}
#nextBtn.disabled, #nextBtn:disabled{opacity:.55; cursor:not-allowed; filter:grayscale(6%)}

/* 카드들 톤 맞추기 */
section.bg-white.rounded-2xl{border:1px solid var(--card-border)}

/* 모바일 안전영역 대응 */
@supports (bottom: env(safe-area-inset-bottom)){
  body{padding-bottom:env(safe-area-inset-bottom);}
}
@supports (padding: max(0px)) {
  body {
    padding-bottom: max(16px, env(safe-area-inset-bottom));
  }
}
</style>
</head>
<body class="">
<div class="div">

  <header class="mb-5">
    <h1 class="font-bold">서류 확인 및 동의</h1>
    <p class="muted mt-1">아래 문서를 확인하고 동의해 주세요. 모든 문서에 동의해야 다음 단계로 이동할 수 있습니다.</p>
  </header>

  <!-- 진행 요약 (세션 표시) -->
  <section class="mb-4">
    <div class="flex gap-2 items-center text-sm">
      <span class="pill" th:text="${session.ReserveValueDto.accountType}">계좌유형</span>
      <span class="pill" th:text="${session.ReserveValueDto.accountId}">계좌ID</span>
      <span class="pill" th:if="${session.ReserveValueDto.riskGrade != null}"
            th:text="${session.ReserveValueDto.riskGrade}">투자성향</span>
    </div>
  </section>

  <!-- 문서 리스트 -->
  <section id="docList" class="space-y-3 mb-6"></section>

  <!-- 하단 컨트롤 -->
  <section class="bg-white rounded-2xl p-4 shadow-sm mb-4">
    <label class="inline-flex items-center gap-2 cursor-pointer">
      <input type="checkbox" id="checkAll" class="w-5 h-5">
      <span class="font-medium">전체 동의</span>
      <span id="progress" class="muted">(0/0)</span>
    </label>
  </section>

  <!-- 제출 폼: 컨트롤러 이미 존재 -->
  <form id="consentForm" method="post" action="/purchase/trade/reserve/step4/next"
        class="bg-white rounded-2xl p-4 shadow-sm">
    <!-- 세션 값 그대로 실어 보냄 -->
    <input type="hidden" name="targetProdIdList" th:value="${session.ReserveValueDto.targetProdIdList}">
    <input type="hidden" name="sourceProdIdList" th:value="${session.ReserveValueDto.sourceProdIdList}">
    <!-- 동의 결과 포함 fileUrlList(JSON) -->
    <input type="hidden" id="fileUrlListField" name="fileUrlList" th:value="${session.ReserveValueDto.fileUrlList}">

    <div class="flex items-center justify-between">
      <a href="/purchase/trade/reserve/step1/after-risk" class="px-4 py-2 rounded-xl border border-neutral-300">이전</a>
      <button id="nextBtn" type="submit" class="px-5 py-2 rounded-xl bg-blue-600 text-white disabled">
        다음
      </button>
    </div>
  </form>

  <p class="muted text-xs mt-3">* “미리보기”는 새 탭에서 열립니다. 모든 문서에 동의해야 다음 단계로 이동할 수 있습니다.</p>
</div>

<!-- ✅ JSON을 안전하게 주입: Thymeleaf가 HTML escape 하지 않도록 utext 사용 -->
<script id="fileListJson" type="application/json"
        th:utext="${session.ReserveValueDto.fileUrlList}">[]</script>

<script>
(function(){
  const listEl = document.getElementById('docList');
  const checkAllEl = document.getElementById('checkAll');
  const nextBtn = document.getElementById('nextBtn');
  const progressEl = document.getElementById('progress');
  const fileUrlListField = document.getElementById('fileUrlListField');

  // ✅ JSON 파싱 (Thymeleaf가 그대로 넣어준 JSON을 읽음)
  let files = [];
  try {
    const raw = document.getElementById('fileListJson').textContent || '[]';
    files = JSON.parse(raw);
  } catch (e) {
    console.error('fileUrlList JSON parse error:', e);
    files = [];
  }

  // 렌더링
  if (!files || !files.length) {
    listEl.innerHTML = `
      <div class="doc-card bg-white">
        <div class="doc-title">표시할 문서가 없습니다.</div>
        <div class="muted">이 화면은 문서가 있을 때만 진입해야 합니다.</div>
      </div>
    `;
    nextBtn.classList.remove('disabled'); // 안전망
  } else {
    files.forEach((f, idx) => {
      const href = (f.fileUrl || '').startsWith('/') ? f.fileUrl : '/' + (f.fileUrl || '');
      const row = document.createElement('div');
      row.className = 'doc-card bg-white flex items-start justify-between gap-4';

      row.innerHTML = `
        <div class="flex-1">
          <div class="doc-title">${escapeHtml(f.prodName || '-')}
            <span class="muted">| ${escapeHtml(f.docType || '')}</span>
          </div>
          <div class="mt-2 flex gap-2">
            <a class="px-3 py-1 rounded-lg border" href="${href}" target="_blank" rel="noopener">미리보기</a>
            <a class="px-3 py-1 rounded-lg border" href="${href}" download>다운로드</a>
          </div>
        </div>
        <label class="flex items-center gap-2">
          <input type="checkbox" class="doc-check w-5 h-5">
          <span class="text-sm">동의</span>
        </label>
      `;
      listEl.appendChild(row);
    });
  }

  // 진행률 & 버튼 활성화
  function refreshProgress() {
    const checks = Array.from(document.querySelectorAll('.doc-check'));
    const total = checks.length;
    const checked = checks.filter(c => c.checked).length;
    progressEl.textContent = `(${checked}/${total})`;
    if (!total || checked === total) nextBtn.classList.remove('disabled');
    else nextBtn.classList.add('disabled');

    // 동의 여부를 fileUrlList에 반영해 hidden 필드 갱신
    const enriched = (files || []).map((f, i) => ({...f, consented: !!(document.querySelectorAll('.doc-check')[i]?.checked)}));
    try {
      fileUrlListField.value = JSON.stringify(enriched);
    } catch(e) { /* noop */ }
  }

  // 전체동의
  checkAllEl?.addEventListener('change', () => {
    document.querySelectorAll('.doc-check').forEach(c => c.checked = checkAllEl.checked);
    refreshProgress();
  });

  // 개별 체크
  listEl.addEventListener('change', (e) => {
    if (e.target && e.target.classList.contains('doc-check')) {
      const checks = Array.from(document.querySelectorAll('.doc-check'));
      checkAllEl.checked = checks.length && checks.every(c => c.checked);
      refreshProgress();
    }
  });

  // 제출 가드
  document.getElementById('consentForm').addEventListener('submit', (e) => {
    if (nextBtn.classList.contains('disabled')) {
      e.preventDefault();
      alert('모든 문서에 동의해야 다음 단계로 이동할 수 있습니다.');
    }
  });

  // 초기 상태 반영
  refreshProgress();

  // util
  function escapeHtml(s){
    return (s ?? '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
})();
</script>
</body>
</html>
