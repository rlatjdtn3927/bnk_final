<!-- templates/purchase/trade/step4.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>서류 동의 - Step 4</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .doc-card { border:1px solid #e5e7eb; border-radius:14px; padding:14px; }
    .doc-title { font-weight:600; }
    .muted { color:#6b7280; font-size:0.9rem; }
    .pill { background:#f3f4f6; border-radius:9999px; padding:2px 10px; font-size:12px; }
    .disabled { opacity:.5; pointer-events:none; }
  </style>
</head>
<body class="bg-neutral-100 text-neutral-900">
<div class="max-w-3xl mx-auto p-5">

  <header class="mb-5">
    <h1 class="text-2xl font-bold">서류 확인 및 동의</h1>
    <p class="muted mt-1">아래 문서를 확인하고 동의해 주세요. 모든 문서에 동의해야 다음 단계로 이동할 수 있습니다.</p>
  </header>

  <!-- 진행 요약 (세션 표시) -->
  <section class="mb-4">
    <div class="flex gap-2 items-center text-sm">
      <span class="pill" th:text="'계좌유형: ' + ${session.ReserveValueDto.accountType}">계좌유형</span>
      <span class="pill" th:text="'계좌ID: ' + ${session.ReserveValueDto.accountId}">계좌ID</span>
      <span class="pill" th:if="${session.ReserveValueDto.riskGrade != null}"
            th:text="'투자성향: ' + ${session.ReserveValueDto.riskGrade}">투자성향</span>
    </div>
  </section>

  <!-- 문서 리스트 -->
  <section id="docList" class="space-y-3 mb-6"></section>

  <!-- 하단 컨트롤 -->
  <section class="bg-white rounded-2xl p-4 shadow-sm mb-4">
    <label class="inline-flex items-center gap-2 cursor-pointer">
      <input type="checkbox" id="checkAll" class="w-5 h-5">
      <span class="font-medium">전체 동의</span>
      <span id="progress" class="muted">(0/0)</span>
    </label>
  </section>

  <!-- 제출 폼: 컨트롤러 이미 존재 -->
  <form id="consentForm" method="post" action="/purchase/trade/reserve/step4/next"
        class="bg-white rounded-2xl p-4 shadow-sm">
    <!-- 세션 값 그대로 실어 보냄 -->
    <input type="hidden" name="targetProdIdList" th:value="${session.ReserveValueDto.targetProdIdList}">
    <input type="hidden" name="sourceProdIdList" th:value="${session.ReserveValueDto.sourceProdIdList}">
    <!-- 동의 결과 포함 fileUrlList(JSON) -->
    <input type="hidden" id="fileUrlListField" name="fileUrlList" th:value="${session.ReserveValueDto.fileUrlList}">

    <div class="flex items-center justify-between">
      <a href="/purchase/trade/reserve/step1/after-risk" class="px-4 py-2 rounded-xl border border-neutral-300">이전으로</a>
      <button id="nextBtn" type="submit" class="px-5 py-2 rounded-xl bg-blue-600 text-white disabled">
        다음 (비교로 이동)
      </button>
    </div>
  </form>

  <p class="muted text-xs mt-3">* “미리보기”는 새 탭에서 열립니다. 모든 문서에 동의해야 다음 단계로 이동합니다.</p>
</div>

<!-- ✅ JSON을 안전하게 주입: Thymeleaf가 HTML escape 하지 않도록 utext 사용 -->
<script id="fileListJson" type="application/json"
        th:utext="${session.ReserveValueDto.fileUrlList}">[]</script>

<script>
(function(){
  const listEl = document.getElementById('docList');
  const checkAllEl = document.getElementById('checkAll');
  const nextBtn = document.getElementById('nextBtn');
  const progressEl = document.getElementById('progress');
  const fileUrlListField = document.getElementById('fileUrlListField');

  // ✅ JSON 파싱 (Thymeleaf가 그대로 넣어준 JSON을 읽음)
  let files = [];
  try {
    const raw = document.getElementById('fileListJson').textContent || '[]';
    files = JSON.parse(raw);
  } catch (e) {
    console.error('fileUrlList JSON parse error:', e);
    files = [];
  }

  // 렌더링
  if (!files || !files.length) {
    listEl.innerHTML = `
      <div class="doc-card bg-white">
        <div class="doc-title">표시할 문서가 없습니다.</div>
        <div class="muted">이 화면은 문서가 있을 때만 진입해야 합니다.</div>
      </div>
    `;
    nextBtn.classList.remove('disabled'); // 안전망
  } else {
    files.forEach((f, idx) => {
      const href = (f.fileUrl || '').startsWith('/') ? f.fileUrl : '/' + (f.fileUrl || '');
      const row = document.createElement('div');
      row.className = 'doc-card bg-white flex items-start justify-between gap-4';

      row.innerHTML = `
        <div class="flex-1">
          <div class="doc-title">${escapeHtml(f.prodName || '-')}
            <span class="muted">| ${escapeHtml(f.docType || '')}</span>
          </div>
          <div class="muted mt-1 break-all">${escapeHtml(f.fileUrl || '')}</div>
          <div class="mt-2 flex gap-2">
            <a class="px-3 py-1 rounded-lg border" href="${href}" target="_blank" rel="noopener">미리보기</a>
            <a class="px-3 py-1 rounded-lg border" href="${href}" download>다운로드</a>
          </div>
        </div>
        <label class="flex items-center gap-2">
          <input type="checkbox" class="doc-check w-5 h-5">
          <span class="text-sm">동의</span>
        </label>
      `;
      listEl.appendChild(row);
    });
  }

  // 진행률 & 버튼 활성화
  function refreshProgress() {
    const checks = Array.from(document.querySelectorAll('.doc-check'));
    const total = checks.length;
    const checked = checks.filter(c => c.checked).length;
    progressEl.textContent = `(${checked}/${total})`;
    if (!total || checked === total) nextBtn.classList.remove('disabled');
    else nextBtn.classList.add('disabled');

    // 동의 여부를 fileUrlList에 반영해 hidden 필드 갱신
    const enriched = (files || []).map((f, i) => ({...f, consented: !!(document.querySelectorAll('.doc-check')[i]?.checked)}));
    try {
      fileUrlListField.value = JSON.stringify(enriched);
    } catch(e) { /* noop */ }
  }

  // 전체동의
  checkAllEl?.addEventListener('change', () => {
    document.querySelectorAll('.doc-check').forEach(c => c.checked = checkAllEl.checked);
    refreshProgress();
  });

  // 개별 체크
  listEl.addEventListener('change', (e) => {
    if (e.target && e.target.classList.contains('doc-check')) {
      const checks = Array.from(document.querySelectorAll('.doc-check'));
      checkAllEl.checked = checks.length && checks.every(c => c.checked);
      refreshProgress();
    }
  });

  // 제출 가드
  document.getElementById('consentForm').addEventListener('submit', (e) => {
    if (nextBtn.classList.contains('disabled')) {
      e.preventDefault();
      alert('모든 문서에 동의해야 다음 단계로 이동할 수 있습니다.');
    }
  });

  // 초기 상태 반영
  refreshProgress();

  // util
  function escapeHtml(s){
    return (s ?? '').toString()
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
})();
</script>
</body>
</html>
