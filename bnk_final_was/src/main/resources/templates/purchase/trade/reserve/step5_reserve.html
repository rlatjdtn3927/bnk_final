<!-- src/main/resources/templates/purchase/trade/step5.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="UTF-8"/>
<title>Step 5. 비교·확인</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
/* ===== 공통 레이아웃 ===== */
html, body { height:100%; }
body{
  font-family:'Pretendard', sans-serif;
  margin:0; padding:0;
  color:#222; background:#f9fafb;
}
.layout{ height:100vh; display:flex; flex-direction:column; }

/* ===== 헤더 ===== */
.header-wrap{
  position:sticky; top:0; z-index:1000;
  background:#fff; border-bottom:1px solid #eee;
}
.header{ max-width:960px; margin:0 auto; padding:14px 16px; }
.page-title{ font-size:20px; font-weight:700; margin:6px 0; }

/* ===== 본문 ===== */
.content{
  flex:1 1 auto;
  overflow:auto;
  min-height:0;
  -webkit-overflow-scrolling:touch;
  padding-bottom:120px;          
}
.divider{ height:4px; background:#eee; border-radius:1px; }

/* ===== 카드 ===== */
.section{ max-width:960px; margin:0 auto; padding:12px 16px }
.grid{ display:grid; gap:28px; grid-template-columns:1fr; }
@media (min-width:760px){ .grid{ grid-template-columns:1fr 1fr; } }

.card{
  background:#fff; border:1px solid #f0f0f0; border-radius:18px;
  padding:24px 20px;
  box-shadow:0 4px 8px rgba(0,0,0,.03);
}
.card h3{ margin:0 0 16px; font-size:17px; font-weight:800; }
.muted{ color:#6b7280; font-size:14px; }

/* ===== 리스트 항목 ===== */
.row{ margin-bottom:16px; }
.row:last-child{ margin-bottom:0; }
.name{ font-size:15px; font-weight:600; }
.ratio{ font-weight:700; font-size:15px; margin-top:4px; text-align:right; }
.ratio.up{ color:#dc2626; }    
.ratio.down{ color:#2563eb; }

/* ===== progress bar ===== */
.bar-wrap{width:100%; background:#f3f4f6; height:8px; border-radius:6px; overflow:hidden; margin-top:6px;}
.bar{height:100%; background:#3b82f6; border-radius:6px;}

/* ===== 안내 배너 ===== */
.section h1 { font-size: 20px; font-weight: 700; }
.banner{
  padding:10px 12px;
  border-radius:10px;
  border:1px solid #fde68a;
  background:#fffbeb;
  color:#92400e;
  margin-bottom: 25px;
  font-size:14px;
}

/* ===== 버튼바 ===== */
.actions{
  position:fixed; left:0; right:0; bottom:0; z-index:1100;
  background:#fff; border-top:1px solid #eee;
  padding:14px 16px 30px;
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  max-width:960px; margin:0 auto;
}
.actions form{ display:contents; }
.actions .btn{
  width:100%; height:56px;
  border-radius:14px; font-size:17px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  border:none; padding:0;
}
.actions .btn.btn-link{ background:#8d94a6; color:#fff; }
.actions .btn.btn-link > a{
  display:flex; align-items:center; justify-content:center;
  width:100%; height:100%;
  border-radius:inherit; text-decoration:none; color:#fff;
}
.actions .btn-primary{ background:#f85151; color:#fff; }

/* ===== 모바일 대응 ===== */
@media (max-width:500px){
  .page-title{ font-size:18px; }
  .card h3{ font-size:15px; }
  .name{ font-size:14px; }
  .ratio{ font-size:14px; }
}
@supports (padding: max(0px)){
  .actions{ padding-bottom:max(22px, env(safe-area-inset-bottom)); }
}
</style>

</head>
<body>

<!-- 전체 레이아웃 랩 -->
<div class="layout">

<!-- 헤더 부분 -->
  <div class="header-wrap">
    <div class="header">
      <h2 class="page-title">매수상품관리</h2>
    </div>
  </div>
  
  <main class="content">
  	<div class="divider"></div>

	<div class="section">
	  <h1>비교·확인</h1>
	  <div class="banner" id="infoBanner" style="display:none"></div>
	
	  <!-- 세션 JSON (escape 금지) -->
	  <script id="json-source" type="application/json"
	          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].sourceProdIdList : '[]'}"></script>
	  <script id="json-target" type="application/json"
	          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].targetProdIdList : '[]'}"></script>
	  <script id="json-files" type="application/json"
	          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].fileUrlList : '[]'}"></script>
	
	  <section class="grid">
	    <div class="card">
	      <h3>변경 전</h3>
	      <div id="beforeList" class="list">
	        <div class="muted">표시할 항목이 없습니다.</div>
	      </div>
	    </div>
	
	    <div class="card">
	      <h3>변경 후</h3>
	      <div id="afterList" class="list">
	        <div class="muted">표시할 항목이 없습니다.</div>
	      </div>
	    </div>
	  </section>

	  <div class="actions">
	    <div class="btn btn-link"><a th:href="@{/purchase/trade/reserve/step4}">이전</a></div>
	    <form th:action="@{/purchase/trade/reserve/step5/next}" method="post">
	      <button class="btn btn-primary" type="submit">확정</button>
	    </form>
	  </div>
  
	</div> <!-- section -->
  </main>
</div> <!-- layout -->


<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const banner = $("infoBanner");
  const beforeList = $("beforeList");
  const afterList  = $("afterList");

  // JSON 안전 파서 (문자열 안의 JSON까지 2단계 시도)
  function safeParseDeep(text){
    try{
      if(!text) return [];
      let v = JSON.parse(text);
      if (typeof v === 'string') {
        try { v = JSON.parse(v); } catch {}
      }
      return v;
    }catch{return []}
  }

  // 세션 JSON 읽기
  const sourceArr = safeParseDeep($("json-source").textContent); // [{product:{productId,productName}, ratio}, ...]
  const targetIds = safeParseDeep($("json-target").textContent); // ["PG3","K55..."]
  const fileDocs  = safeParseDeep($("json-files").textContent);  // [{prodId, prodName, ...}, ...]

  // prodId → name 매핑(문서 + source 모두 반영)
  const nameById = {};
  (Array.isArray(fileDocs) ? fileDocs : []).forEach(d=>{
    if (d && d.prodId && d.prodName) nameById[d.prodId] = d.prodName;
  });
  (Array.isArray(sourceArr) ? sourceArr : []).forEach(p=>{
    const id = p?.product?.productId, nm = p?.product?.productName;
    if (id && nm) nameById[id] = nm;
  });

  // ---------------- 변경 후 렌더링 ----------------
  function renderAfter(){
    const items = [];
    let sum = 0;

    (sourceArr || []).forEach(p=>{
      const id = p?.product?.productId;
      const nm = p?.product?.productName || nameById[id] || id;
      const r  = Number(p?.ratio ?? 0);
      if (!id) return;
      sum += (isFinite(r) ? r : 0);
      items.push({id, name:nm, ratio:r, type: id.startsWith("PG") ? "원리금보장" : "펀드/ETF/TDF"});
    });

    // 현금성자산 보정(합계 < 100)
    const cash = Math.max(0, 100 - sum);
    if (cash > 0) items.push({id:"CASH", name:"현금성자산", ratio:cash, type:"현금"});

    if (items.length === 0){
      afterList.innerHTML = '<div class="muted">표시할 항목이 없습니다.</div>';
    } else {
      afterList.innerHTML = items.map(it => `
        <div class="row">
          <div class="name">${it.name}${it.id!=="CASH" ? `<span class="chip">${it.type}</span>` : ""}</div>
          <div class="ratio">${it.ratio}%</div>
        </div>
      `).join("");
    }

    // 배너 안내
  }

  // ---------------- 변경 전 렌더링 ----------------
  function renderBefore(){
    if (!Array.isArray(targetIds) || targetIds.length === 0){
      beforeList.innerHTML = '<div class="muted">표시할 항목이 없습니다.</div>';
      return;
    }
    beforeList.innerHTML = targetIds.map(id=>{
      const nm = nameById[id] || id;
      const type = id && id.startsWith("PG") ? "원리금보장" : "펀드/ETF/TDF";
      return `
        <div class="row">
          <div class="name">${nm}<span class="chip">${type}</span></div>
          <div class="muted">-</div>
        </div>
      `;
    }).join("");
  }

  renderBefore();
  renderAfter();
})();
</script>
</body>
</html>
