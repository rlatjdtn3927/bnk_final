<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>STEP5. 비밀번호 입력 & 적용</title>
  <link th:href="@{/css/purchase.css}" rel="stylesheet"/>
</head>
<body>
<header class="header">
  <div class="brand">BNK 퇴직연금</div>
  <nav class="tabs">
    <a th:href="@{/purchase/holdings}" class="tab">보유현황</a>
    <a th:href="@{/purchase/products}" class="tab">상품관리</a>
    <a th:href="@{|/purchase/trade?flow=${flow}|}" class="tab active">상품/매수 변경</a>
  </nav>
</header>

<main class="container">
  <section class="card">
    <div class="section-title">STEP5. 비밀번호 입력 & 적용</div>

    <input type="hidden" id="flow"        th:value="${flow}">
    <input type="hidden" id="accountType" th:value="${accountType}">
    <input type="hidden" id="acountId"    th:value="${acountId}">
    <input type="hidden" id="items"       th:value="${items}">
    <input type="hidden" id="maturityProductId" th:value="${maturityProductId}">
    <input type="hidden" id="changeDate"        th:value="${changeDate}">

    <div class="row">
      <input id="acctPwd" type="password" class="input" placeholder="계좌 비밀번호 (IRP만 검증)">
      <button id="applyBtn" class="btn primary">즉시 적용</button>
    </div>

    <span class="badge mt-8" id="applyStatus">대기</span>
    <pre id="resultBox" class="mt-8" style="white-space:pre-wrap"></pre>

    <!-- PRG용 done POST -->
    <form th:action="@{|/purchase/trade/${flow}/step5/done|}" method="post" id="doneForm"></form>
  </section>
</main>

<script>
  document.getElementById('applyBtn').addEventListener('click', async ()=>{
    const flow        = document.getElementById('flow').value;
    const accountType = document.getElementById('accountType').value;
    const acountId    = document.getElementById('acountId').value;
    const items       = JSON.parse(document.getElementById('items').value);
    const acctPwd     = document.getElementById('acctPwd').value;

    let url, payload;
    if(flow === 'MATURITY'){
      const productId  = document.getElementById('maturityProductId').value;
      const changeDate = document.getElementById('changeDate').value;
      if(!productId || !changeDate){ alert('원본 예금과 전환일을 확인하세요.'); return; }
      url = '/purchase/api/trade/maturity/apply';
      payload = { accountType, acountId, productId, changeDate, items };
    }else{
      url = '/purchase/api/trade/apply';
      payload = { accountType, acountId, acctPwd, items };
      if(accountType==='IRP' && !acctPwd){ alert('IRP는 비밀번호가 필요합니다.'); return; }
    }

    document.getElementById('applyStatus').textContent = '진행중...';

    const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
    const json = await res.json();
    document.getElementById('resultBox').textContent = JSON.stringify(json, null, 2);
    document.getElementById('applyStatus').textContent = '완료';

    // PRG: 완료 페이지
    setTimeout(()=> document.getElementById('doneForm').submit(), 500);
  });
</script>
</body>
</html>
