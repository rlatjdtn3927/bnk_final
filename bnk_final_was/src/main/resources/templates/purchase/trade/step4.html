<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>Step 4. 서류 확인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{--bg:#f5f5f7;--fg:#111827;--muted:#6b7280;--brand:#b30000;--border:#e5e7eb;--primary:#ffd6d6;--primary-600:#ffb3b3}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .container{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
    .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
    .brand{font-weight:700;color:var(--brand)}.tabs{display:flex;gap:10px}
    .tab{padding:8px 12px;border-radius:10px;border:1px solid transparent;text-decoration:none;color:#374151}
    .tab.active{border-color:var(--border);background:#fff;font-weight:600}
    h1{font-size:22px;margin:18px 0 8px}
    .flow-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:#e5f0ff;color:#1e40af;font-size:12px}

    .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:768px){.cards{grid-template-columns:1fr}}
    .card{border:1px solid var(--border);border-radius:16px;background:#fff;overflow:hidden}
    .card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer}
    .card-title{font-weight:700}
    .ratio{margin-left:8px;font-size:12px;color:#374151;background:#fff2f2;border:1px solid #ffe3e3;padding:2px 6px;border-radius:8px}
    .cat{margin-left:8px;font-size:11px;color:#374151;background:#f3f4f6;border:1px solid #e7e7e7;padding:2px 6px;border-radius:999px}
    .caret{font-size:18px;transition:transform .15s}
    .open .caret{transform:rotate(180deg)}
    .card-body{display:none;border-top:1px solid var(--border);padding:8px 16px 14px}
    .open .card-body{display:block}
    .doc-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:10px;margin:8px 0;padding:10px 12px;background:#fafafa}
    .doc-type{font-weight:600}
    .doc-actions{display:flex;gap:10px;align-items:center}
    .btn{appearance:none;border:0;border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:600}
    .btn-link{background:transparent;text-decoration:underline;color:#374151}
    .btn-primary{background:var(--primary);color:#111827}
    .btn-primary:hover{background:var(--primary-600)}
    .row{display:flex;gap:10px;align-items:center;margin-top:20px}
    @media(max-width:768px){.row{flex-direction:column;align-items:stretch}.btn{width:100%}}
    .muted{color:var(--muted);font-size:12px}
    .banner{margin:12px 0;padding:10px 12px;border-radius:10px;border:1px solid #fde68a;background:#fffbeb;color:#92400e}
    .agree-all{margin-top:8px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
  </style>
</head>
<body>
<header class="header">
  <div class="brand">BNK 퇴직연금</div>
  <nav class="tabs">
    <a th:href="@{/purchase/holdings}" class="tab">보유현황</a>
    <a th:href="@{/purchase/products}" class="tab">상품관리</a>
  </nav>
</header>

<div class="container">
  <h1>Step 4. 서류 확인</h1>
  <div class="flow-badge" id="flowBadge" th:text="${session['PassValueDto']?.flow} ?: 'FLOW 미지정'">FLOW</div>
  <p class="muted">각 상품 카드를 눌러 필수 서류를 확인·동의하세요. 모든 문서에 동의해야 다음 단계로 이동할 수 있습니다.</p>

  <div id="infoBanner" class="banner" style="display:none"></div>

  <div style="text-align:right; margin:12px 0;">
    <button type="button" id="agreeAllBtn" class="btn btn-primary">모두 동의</button>
  </div>

  
  <section id="cards" class="cards">
    <!-- JS가 카드 렌더링 -->
    <div class="card"><div class="card-body"><div class="muted">불러오는 중…</div></div></div>
  </section>

  <form th:action="@{/purchase/trade/step4/next}" method="post" class="row">
    <a th:href="@{/purchase/trade/step3}" class="btn btn-link">이전</a>
    <button id="nextBtn" type="submit" class="btn btn-primary" disabled>비교·확인으로 이동</button>
  </form>
</div>

<script>
(function(){
  const cards = document.getElementById('cards');
  const nextBtn = document.getElementById('nextBtn');
  const banner = document.getElementById('infoBanner');

  let totalRequired = 0;
  let totalChecked = 0;

  function catLabel(prodId){
    return (prodId && prodId.startsWith('PG')) ? '원리금보장상품' : '펀드/ETF/TDF';
  }

  function updateNext(){
    nextBtn.disabled = (totalRequired > 0) ? (totalChecked !== totalRequired) : false;
  }

  const agreeAllBtn = document.getElementById('agreeAllBtn');
   let agreeAllState = false; // false = 아직 동의 안함, true = 모두 동의 상태

   if (agreeAllBtn){
     agreeAllBtn.addEventListener('click', () => {
       const allCheckboxes = cards.querySelectorAll('input[type="checkbox"][id^="agree_"]');
       if (!agreeAllState) {
         // 모두 동의
         allCheckboxes.forEach(chk => {
           if (!chk.checked){
             chk.checked = true;
             totalChecked += 1;
           }
         });
         // per-card 전체 동의 체크박스도 동기화
         const perAll = cards.querySelectorAll('input[type="checkbox"][id^="agree_all_"]');
         perAll.forEach(all => all.checked = true);

         agreeAllBtn.textContent = "모두 취소"; // 버튼 라벨 변경
         agreeAllState = true;
       } else {
         // 모두 취소
         allCheckboxes.forEach(chk => {
           if (chk.checked){
             chk.checked = false;
             totalChecked -= 1;
           }
         });
         // per-card 전체 동의 체크박스도 해제
         const perAll = cards.querySelectorAll('input[type="checkbox"][id^="agree_all_"]');
         perAll.forEach(all => all.checked = false);

         agreeAllBtn.textContent = "모두 동의"; // 버튼 라벨 변경
         agreeAllState = false;
       }
       updateNext();
     });
   }
   
  function render(docs, ratios){
    // prodId별 그룹핑
    const byProd = docs.reduce((m, d) => {
      const k = d.prodId || 'UNKNOWN';
      if (!m[k]) m[k] = { prodId: k, prodName: d.prodName || k, items: [] };
      m[k].items.push(d);
      return m;
    }, {});

    const groups = Object.values(byProd);
    if (groups.length === 0){
      cards.innerHTML = `<div class="card"><div class="card-body"><div class="muted">표시할 문서가 없습니다.</div></div></div>`;
      nextBtn.disabled = false; // 문서가 없으면 통과
      return;
    }

    cards.innerHTML = '';
    totalRequired = 0;
    totalChecked = 0;

    groups.forEach((g, gi) => {
      const ratio = ratios && ratios[g.prodId] != null ? ratios[g.prodId] : null;
      const card = document.createElement('div');
      card.className = 'card';

      // header
      card.innerHTML = `
        <div class="card-head">
          <div class="card-title">
            ${g.prodName} <span class="muted">(${g.prodId})</span>
            ${ratio != null ? `<span class="ratio">${ratio}%</span>` : ''}
            <span class="cat">${catLabel(g.prodId)}</span>
          </div>
          <div class="caret">▾</div>
        </div>
        <div class="card-body"></div>
      `;

      const bodyEl = card.querySelector('.card-body');

      if (g.items.length === 0){
        bodyEl.innerHTML = `<div class="muted">문서가 없습니다.</div>`;
      } else {
        // 문서 rows + 체크박스
        const rows = g.items.map((it, idx) => {
          const id = `agree_${gi}_${idx}`;
          return `
            <div class="doc-row">
              <div class="doc-type">${it.docType || '문서'}</div>
              <div class="doc-actions">
                <a class="btn btn-link" href="${it.fileUrl || '#'}" target="_blank" rel="noopener">열기</a>
                <label for="${id}" class="muted">동의</label>
                <input type="checkbox" id="${id}" data-prod="${g.prodId}" />
              </div>
            </div>
          `;
        }).join('');
        const allId = `agree_all_${gi}`;
        bodyEl.innerHTML = rows + `
          <div class="agree-all">
            <input type="checkbox" id="${allId}" />
            <label for="${allId}" class="muted">해당 상품의 모든 문서에 동의합니다</label>
          </div>
        `;

        // 체크 수 합산
        const checkboxes = bodyEl.querySelectorAll('input[type="checkbox"][id^="agree_"]');
        totalRequired += checkboxes.length;

        checkboxes.forEach(chk => {
          chk.addEventListener('change', () => {
            totalChecked += (chk.checked ? 1 : -1);
            // per-card 전체동의 동기화
            const all = bodyEl.querySelector(`#${allId}`);
            const nowAll = Array.from(checkboxes).every(c => c.checked);
            all.checked = nowAll;
            updateNext();
          });
        });

        // 전체 동의
        const agreeAll = bodyEl.querySelector(`#${allId}`);
        agreeAll.addEventListener('change', () => {
          const checked = agreeAll.checked;
          checkboxes.forEach(c => {
            if (c.checked !== checked) {
              c.checked = checked;
              totalChecked += (checked ? 1 : -1);
            }
          });
          updateNext();
        });
      }

      // 토글
      card.querySelector('.card-head').addEventListener('click', () => {
        card.classList.toggle('open');
      });

      // 첫 카드 펼침
      if (gi === 0) card.classList.add('open');

      cards.appendChild(card);
    });

    updateNext();
  }

  async function load(){
    try{
      const res = await fetch('/purchase/api/documents/step4');
      const body = await res.json();

      if (body.message){
        banner.style.display = 'block';
        banner.textContent = body.message;
      }

      const docs = Array.isArray(body.docs) ? body.docs : [];
      const ratios = body.ratios || null;

      render(docs, ratios);
    } catch(e){
      cards.innerHTML = `<div class="card"><div class="card-body"><div class="muted">문서 조회 오류: ${e}</div></div></div>`;
    }
  }

  load();
})();
</script>
</body>
</html>
