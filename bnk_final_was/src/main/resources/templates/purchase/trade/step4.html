<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>서류동의</title>
  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      background: #fff5f5;
      margin: 0;
      padding: 24px;
    }
    .wrap {
      max-width: 980px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #b11217;
      margin: 8px 0 18px;
      font-size: 26px;
    }
    .notice {
      background: #fff;
      border: 2px solid #ffd6d6;
      border-radius: 12px;
      padding: 14px 16px;
      color: #374151;
      margin-bottom: 16px;
    }
    .card {
      background: #fff;
      border: 2px solid #ffd6d6;
      border-radius: 16px;
      padding: 16px 18px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.06);
    }
    .prod-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 10px;
      color: #111827;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #ffe9e9;
      color: #b11217;
      border: 1px solid #ffd6d6;
    }
    .doc-row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px dashed #ffd6d6;
      margin-bottom: 8px;
    }
    .doc-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .doc-name {
      font-weight: 600;
      color: #111827;
    }
    .doc-type {
      font-size: 12px;
      color: #6b7280;
    }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 10px;
      background: #ffd6d6;
      color: #111;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid #ffc1c1;
      transition: transform .15s ease, background .2s ease;
    }
    .btn:hover { background: #ffb6b6; transform: translateY(-1px); }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 20px;
    }
    .all-agree {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 2px solid #ffd6d6;
      border-radius: 12px;
      padding: 12px 14px;
      color: #111827;
      font-weight: 600;
    }
    .error {
      color: #d9534f;
      margin-top: 10px;
      font-weight: 700;
    }
    .empty {
      text-align: center;
      color: #6b7280;
      padding: 24px 0;
      border: 2px dashed #ffd6d6;
      border-radius: 12px;
      background: #fff;
    }
    form { margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>서류 동의</h1>

    <div class="notice">
      선택하신 상품 관련 **설명서/약관**을 확인하고 동의해 주세요. 모든 문서 동의 후 다음 단계로 진행됩니다.
    </div>

    <!-- 세션에 저장된 JSON 문자열을 data-attributes로 전달 -->
    <div id="data-holder"
         th:attr="data-files=${session.PassValueDto != null ? session.PassValueDto.fileUrlList : '[]'}">
    </div>

    <!-- 문서 리스트 렌더 영역 -->
    <div id="docs-container"></div>

    <!-- 폼: 모든 동의 체크 시에만 제출 가능 -->
    <form th:action="@{/purchase/trade/step4/next}" method="post" id="consent-form">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
      <div class="footer-actions">
        <label class="all-agree">
          <input type="checkbox" id="check-all"/>
          전체 동의
        </label>
        <div style="display:flex; gap:8px;">
          <a class="btn" href="/purchase/trade/step5" id="skip-btn" style="display:none;">비교로 이동</a>
          <button type="submit" class="btn" id="submit-btn" disabled>다음 (상품 비교)</button>
        </div>
      </div>
      <p class="error" id="error-msg" style="display:none;">모든 문서에 동의해야 다음 단계로 진행할 수 있어요.</p>
    </form>
  </div>

  <script>
    (function () {
      const holder = document.getElementById('data-holder');
      let raw = holder.dataset.files || '[]';

      // session에 문자열로 들어왔을 때/이미 배열로 그려졌을 때 안전 파싱
      let files;
      try {
        files = typeof raw === 'string' ? JSON.parse(raw) : raw;
      } catch (e) {
        files = [];
      }

      const container = document.getElementById('docs-container');
      const submitBtn = document.getElementById('submit-btn');
      const checkAll  = document.getElementById('check-all');
      const errorMsg  = document.getElementById('error-msg');
      const skipBtn   = document.getElementById('skip-btn');

      // 빈 리스트면: step5로 바로 갈 수 있도록 스킵 버튼 노출, 안내 표시
      if (!Array.isArray(files) || files.length === 0) {
        container.innerHTML = `
          <div class="empty">
            동의할 문서가 없습니다. 바로 비교 단계로 이동할 수 있어요.
          </div>
        `;
        submitBtn.style.display = 'none';
        checkAll.closest('label').style.display = 'none';
        skipBtn.style.display = 'inline-block';
        return;
      }

      // 같은 상품(prodId/prodName)끼리 그룹핑
      const groups = {};
      for (const f of files) {
        const key = (f.prodId || '') + '|' + (f.prodName || '');
        if (!groups[key]) groups[key] = [];
        groups[key].push(f);
      }

      // 그룹별 카드 렌더
      container.innerHTML = '';
      Object.entries(groups).forEach(([key, list]) => {
        const [prodId, prodName] = key.split('|');
        const card = document.createElement('div');
        card.className = 'card';

        const header = document.createElement('div');
        header.className = 'prod-title';
        header.innerHTML = `
          <span class="badge">상품ID: ${prodId || '-'}</span>
          <span>${prodName || '-'}</span>
        `;
        card.appendChild(header);

        list.forEach((doc, idx) => {
          const row = document.createElement('div');
          row.className = 'doc-row';

          const cb = document.createElement('input');
          cb.type = 'checkbox';
          cb.name = 'agreed';
          // 서버로 전달할 값(선택적으로 활용 가능)
          cb.value = `${prodId}|${doc.docType || ''}|${doc.fileUrl || ''}`;
          cb.className = 'doc-check';

          const meta = document.createElement('div');
          meta.className = 'doc-meta';
          const name = document.createElement('div');
          name.className = 'doc-name';
          name.textContent = doc.docType || '문서';
          const type = document.createElement('div');
          type.className = 'doc-type';
          type.textContent = doc.fileUrl || '';

          meta.appendChild(name);
          meta.appendChild(type);

          const a = document.createElement('a');
          a.className = 'btn';
          a.href = doc.fileUrl || '#';
          a.target = '_blank';
          a.rel = 'noopener';
          a.textContent = '보기';

          row.appendChild(cb);
          row.appendChild(meta);
          row.appendChild(a);
          card.appendChild(row);
        });

        container.appendChild(card);
      });

      // 체크박스 로직
      const allChecks = Array.from(document.querySelectorAll('.doc-check'));
      function refreshState() {
        const allChecked = allChecks.length > 0 && allChecks.every(c => c.checked);
        submitBtn.disabled = !allChecked;
        checkAll.checked = allChecked;
        errorMsg.style.display = allChecked ? 'none' : 'none'; // 기본은 숨김
      }

      // 전체 동의 토글
      checkAll.addEventListener('change', (e) => {
        allChecks.forEach(c => c.checked = e.target.checked);
        refreshState();
      });

      // 개별 문서 체크 시 상태 반영
      allChecks.forEach(c => c.addEventListener('change', refreshState));

      // 제출 시 검증(서버 라운드트립 방지)
      document.getElementById('consent-form').addEventListener('submit', (e) => {
        const allChecked = allChecks.length > 0 && allChecks.every(c => c.checked);
        if (!allChecked) {
          e.preventDefault();
          errorMsg.style.display = 'block';
          errorMsg.textContent = '모든 문서에 동의해야 다음 단계로 진행할 수 있어요.';
        }
      });

      refreshState();
    })();
  </script>
</body>
</html>
