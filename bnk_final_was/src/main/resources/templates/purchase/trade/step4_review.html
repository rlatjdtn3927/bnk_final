<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>STEP4. 변경 전/후 미리보기</title>
  <link th:href="@{/css/purchase.css}" rel="stylesheet"/>
</head>
<body>
<header class="header">
  <div class="brand">BNK 퇴직연금</div>
  <nav class="tabs">
    <a th:href="@{/purchase/holdings}" class="tab">보유현황</a>
    <a th:href="@{/purchase/products}" class="tab">상품관리</a>
    <a th:href="@{|/purchase/trade?flow=${flow}|}" class="tab active">상품/매수 변경</a>
  </nav>
</header>

<main class="container">
  <section class="card">
    <div class="section-title">STEP4. 변경 전/후 확인</div>

    <input type="hidden" id="flow"        th:value="${flow}">
    <input type="hidden" id="accountType" th:value="${accountType}">
    <input type="hidden" id="acountId"    th:value="${acountId}">
    <input type="hidden" id="items"       th:value="${items}">
    <input type="hidden" id="docs"        th:value="${docs}">
    <input type="hidden" id="maturityProductId" th:value="${maturityProductId}">
    <input type="hidden" id="changeDate"        th:value="${changeDate}">

    <div class="grid grid-2">
      <div>
        <div class="badge">변경 전</div>
        <pre id="beforeBox" style="white-space:pre-wrap"></pre>
      </div>
      <div>
        <div class="badge">변경 후(미리보기)</div>
        <pre id="afterBox" style="white-space:pre-wrap"></pre>
      </div>
    </div>

    <form th:action="@{|/purchase/trade/${flow}/step4/next|}" method="post">
      <input type="hidden" name="userId" th:value="${userId}">
      <input type="hidden" name="accountType" th:value="${accountType}">
      <input type="hidden" name="acountId" th:value="${acountId}">
      <input type="hidden" name="items" th:value="${items}">
      <input type="hidden" name="docs" th:value="${docs}">
      <input type="hidden" name="maturityProductId" th:value="${maturityProductId}">
      <input type="hidden" name="changeDate" th:value="${changeDate}">
      <button class="btn primary mt-8" type="submit">다음(비밀번호 입력)</button>
    </form>
  </section>
</main>

<script>
  (async function(){
    const flow = document.getElementById('flow').value;
    const accountType = document.getElementById('accountType').value;
    const acountId    = document.getElementById('acountId').value;
    const items       = JSON.parse(document.getElementById('items').value);

    if(flow === 'MATURITY'){
      // 간이 표시
      const pid = document.getElementById('maturityProductId').value;
      const cd  = document.getElementById('changeDate').value;
      document.getElementById('beforeBox').textContent =
        `만기 변경예약 대상 예금: ${pid}\n전환일: ${cd}\n\n(보유 상세/월별 내역은 만기목록 화면을 참고하세요)`;
      document.getElementById('afterBox').textContent =
        '전환금액을 아래 비율로 재배분 예정:\n' + JSON.stringify(items, null, 2);
      return;
    }

    // 일반 PENDING/CHANGE: 미리보기 호출
    const res = await fetch('/purchase/api/trade/preview', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({accountType, acountId, items})
    });
    const json = await res.json();
    document.getElementById('beforeBox').textContent = JSON.stringify(json.before, null, 2);
    document.getElementById('afterBox').textContent  = JSON.stringify(json.after,  null, 2);
  })();
</script>
</body>
</html>
