<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Step 3. 상품 선택</title>
  <link rel="stylesheet" href="/css/common.css" />
</head>
<body>
<header class="header">
  <div class="brand">BNK 퇴직연금</div>
  <nav class="tabs">
    <a th:href="@{/purchase/holdings}" class="tab">보유현황</a>
    <a th:href="@{/purchase/products}" class="tab">상품관리</a>
  </nav>
</header>

<main>
  <h1>Step 3. 상품 선택</h1>
  <div class="flow-badge"
       th:text="${PassValueDto.flow != null} ? ${PassValueDto.flow} : 'FLOW 미지정'">FLOW</div>

  <form th:action="@{/purchase/trade/step3/next}" method="post">
    <!-- 예시: 상품 ID 선택 -->
    <label>
      <input type="checkbox" name="productIds" value="FUND_001"> 펀드 상품 1
    </label>
    <label>
      <input type="checkbox" name="productIds" value="ETF_002"> ETF 상품 2
    </label>

    <input type="hidden" th:name="accountId" th:value="${PassValueDto.accountId}" />
    <input type="hidden" th:name="accountType" th:value="${PassValueDto.accountType}" />
    <input type="hidden" th:name="flow" th:value="${PassValueDto.flow}" />

    <button type="submit">다음 단계</button>
  </form>
</main>
</body>
</html>
