<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>매도상품 추가</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 text-neutral-900">
  <div class="max-w-xl mx-auto p-4">
    <header class="mb-4">
      <h1 class="text-xl font-semibold">매도상품 추가</h1>
      <p class="text-sm text-neutral-500">추가로 매도할 상품을 선택해 비율을 입력하세요.</p>
    </header>

    <section id="holdingsList" class="space-y-3"></section>

    <div class="mt-6 flex gap-3">
      <a href="/purchase/trade/change/step2_soldList" class="flex-1 h-12 inline-flex items-center justify-center rounded-xl border border-neutral-300 bg-white">돌아가기</a>
      <button id="btnAdd" class="flex-1 h-12 rounded-xl bg-rose-500 text-white text-base font-semibold">선택 추가</button>
    </div>
  </div>

  <template id="row">
    <div class="bg-white rounded-2xl shadow-sm border border-neutral-200 p-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-medium name"></div>
          <div class="text-xs text-neutral-500 type"></div>
        </div>
        <div class="text-right text-sm">
          <div class="text-neutral-500">매도가능금액</div>
          <div class="avail font-medium"></div>
        </div>
      </div>
      <div class="mt-3 flex items-center gap-2">
        <input type="checkbox" class="sel w-4 h-4 accent-rose-500" />
        <span class="text-sm">선택</span>
        <input type="number" min="0" max="100" step="1" class="ratio w-20 border rounded-lg px-2 py-1 text-right ml-auto" placeholder="0" />
        <span class="text-sm">%</span>
      </div>
    </div>
  </template>

  <script>
    const fmtWon = (n) => new Intl.NumberFormat('ko-KR').format(n) + ' 원';
    let all = [];

    // 이미 선택된 항목을 제외한 추가 후보만 서버에서 제공
    const load = async () => {
      const r = await fetch('/retain-api/change/holdings-for-add', { method: 'POST' });
      const j = await r.json();
      all = j.items || [];
      const wrap = document.getElementById('holdingsList');
      const tpl = document.getElementById('row');
      wrap.innerHTML = '';
      all.forEach(it => {
        const node = tpl.content.cloneNode(true);
        node.querySelector('.name').textContent = it.name;
        node.querySelector('.type').textContent = it.itemType;
        node.querySelector('.avail').textContent = fmtWon(it.availableAmount || 0);
        wrap.appendChild(node);
      });
    };

    const add = async () => {
      const rows = Array.from(document.querySelectorAll('#holdingsList > div'));
      const items = [];
      rows.forEach((row, i) => {
        if (row.querySelector('.sel').checked) {
          const ratio = Number(row.querySelector('.ratio').value || 0);
          items.push({
            itemType: all[i].itemType,
            itemId: all[i].itemId,
            name: all[i].name,
            availableAmount: all[i].availableAmount,
            ratio
          });
        }
      });
      if (!items.length) { window.location.href = '/purchase/trade/change/step2_soldList'; return; }

      const r = await fetch('/retain-api/change/append-selection', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      if (r.ok) {
        window.location.href = '/purchase/trade/change/step2_soldList';
      } else {
        alert('추가 실패');
      }
    };

    document.addEventListener('DOMContentLoaded', load);
    document.getElementById('btnAdd').addEventListener('click', add);
  </script>
</body>
</html>
