<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>매도할 상품 목록</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 text-neutral-900">
  <div class="max-w-xl mx-auto p-4">
    <header class="mb-4">
      <h1 class="text-xl font-semibold">매도할 상품 목록</h1>
      <p class="text-sm text-neutral-500">각 상품의 매도 비율을 입력/수정하면 합계액이 자동 계산됩니다.</p>
    </header>

    <section id="sellList" class="space-y-3"></section>

    <div class="mt-4 bg-white border border-neutral-200 rounded-2xl p-4">
      <div class="flex justify-between text-sm">
        <div class="text-neutral-500">매도상품 합계액</div>
        <div id="total" class="font-semibold">0 원</div>
      </div>
    </div>

    <div class="mt-6 flex gap-2">
      <a href="/purchase/trade/change/step2_changeAddRatio" class="flex-1 h-12 inline-flex items-center justify-center rounded-xl border border-neutral-300 bg-white">매도상품추가</a>
      <button id="btnSave" class="flex-1 h-12 rounded-xl bg-rose-500 text-white text-base font-semibold">저장</button>
    </div>
  </div>

  <template id="row">
    <div class="bg-white rounded-2xl shadow-sm border border-neutral-200 p-4">
      <div class="flex items-center justify-between">
        <div>
          <div class="font-medium name"></div>
          <div class="text-xs text-neutral-500 type"></div>
        </div>
        <div class="text-right text-sm">
          <div class="text-neutral-500">매도가능금액</div>
          <div class="avail font-medium"></div>
        </div>
      </div>
      <div class="mt-3 flex items-center gap-2">
        <input type="number" min="0" max="100" step="1" class="ratio w-20 border rounded-lg px-2 py-1 text-right" />
        <span class="text-sm">%</span>
        <div class="ml-auto text-sm"><span class="text-neutral-500">매도금액</span> <span class="amount font-medium">0 원</span></div>
      </div>
      <div class="mt-2 text-right">
        <button class="remove text-xs text-neutral-500 underline">제외</button>
      </div>
    </div>
  </template>

  <script>
    const fmtWon = (n) => new Intl.NumberFormat('ko-KR').format(n) + ' 원';
    let items = [];

    const recalc = () => {
      let sum = 0;
      document.querySelectorAll('#sellList > div').forEach((row, i) => {
        const ratio = Number(row.querySelector('.ratio').value || 0);
        const avail = Number(items[i].availableAmount || 0);
        const amt = Math.floor(avail * ratio / 100);
        row.querySelector('.amount').textContent = fmtWon(amt);
        sum += amt;
        items[i].ratio = ratio;
        items[i].sellAmount = amt;
      });
      document.getElementById('total').textContent = fmtWon(sum);
    };

    const render = () => {
      const wrap = document.getElementById('sellList');
      wrap.innerHTML = '';
      const tpl = document.getElementById('row');
      items.forEach((it, idx) => {
        const node = tpl.content.cloneNode(true);
        node.querySelector('.name').textContent = it.name;
        node.querySelector('.type').textContent = it.itemType;
        node.querySelector('.avail').textContent = fmtWon(it.availableAmount || 0);
        const ratio = node.querySelector('.ratio');
        ratio.value = it.ratio ?? 0;
        ratio.addEventListener('input', recalc);
        node.querySelector('.remove').addEventListener('click', () => {
          items.splice(idx, 1); // UI 상태에서 제거
          render();
          recalc();
        });
        wrap.appendChild(node);
      });
      recalc();
    };

    const load = async () => {
      const r = await fetch('/retain-api/change/sell-items', { method: 'POST' });
      const j = await r.json();
      items = j.items || [];
      render();
    };

    // 저장은 전체 교체 방식으로 처리하여 제거도 반영
    const save = async () => {
      const r = await fetch('/retain-api/change/save-selection', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ items })
      });
      if (!r.ok) alert('저장 실패');
    };

    document.addEventListener('DOMContentLoaded', load);
    document.getElementById('btnSave').addEventListener('click', save);
  </script>
</body>
</html>
