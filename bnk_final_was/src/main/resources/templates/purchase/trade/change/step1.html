<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>계좌 선택 - Step 1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{
      --bg:#f5f5f7;--fg:#111827;--muted:#6b7280;--brand:#b30000;
      --primary:#ffd6d6;--primary-600:#ffb3b3;
      --border:#e5e7eb;--ring:#ffd6d6;
      --warn-bg:#fffbeb;--warn-fg:#92400e;--warn-bd:#fde68a;
      --err-bg:#fef2f2;--err-fg:#991b1b;--err-bd:#fecaca
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .container{max-width:1000px;margin:0 auto;padding:16px 16px 40px}
    .header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10;flex-wrap:wrap}
    .brand{font-weight:700;color:var(--brand)}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
    .tab{padding:8px 12px;border-radius:10px;border:1px solid transparent;text-decoration:none;color:#374151}
    .tab:hover{background:#f3f4f6}
    .tab.active{border-color:var(--border);background:#fff;font-weight:600}
    h1{font-size:22px;margin:18px 0 8px}
    .flow-badge{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:#e5f0ff;color:#1e40af;font-size:12px}
    .subtle{font-size:12px;color:var(--muted)}
    .mt-8{margin-top:24px}.mt-4{margin-top:12px}
    .row{display:flex;gap:10px;align-items:center}
    .row-right{margin-left:auto}
    .grid{display:grid;grid-template-columns:1fr;gap:16px}
    @media(min-width:769px){.grid{grid-template-columns:1fr 1fr}}
    .card{background:#fff;border-radius:16px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.04);padding:16px}
    .card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .badge{font-size:11px;background:#f3f4f6;padding:2px 8px;border-radius:999px;color:#374151}
    .radio{display:flex;align-items:center;gap:12px}
    .radio-card{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--border);border-radius:12px;padding:12px 14px;cursor:pointer;transition:background .15s,border-color .15s,box-shadow .15s;margin-bottom:8px}
    .radio-card:hover{background:#f9fafb}
    .radio-card.selected{border-color:var(--ring);box-shadow:0 0 0 3px rgba(255,214,214,.4)}
    .radio-card.disabled{opacity:.6;cursor:not-allowed}
    .title-sm{font-size:14px;font-weight:600}
    .banner{display:none;margin:12px 0;padding:10px 12px;border-radius:10px;border:1px solid}
    .banner.show{display:block}
    .banner.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
    .btn{appearance:none;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:600}
    .btn-link{background:transparent;color:#374151;text-decoration:underline}
    .btn-primary{background:var(--primary);color:#111827}
    .btn-primary:hover{background:var(--primary-600)}
    .btn[disabled]{opacity:.4;cursor:not-allowed}
  </style>
</head>
<body>
<header class="header">
  <div class="brand">BNK 퇴직연금</div>
  <nav class="tabs">
    <a th:href="@{/purchase/holdings}" class="tab">보유현황</a>
    <a th:href="@{/purchase/products}" class="tab active">상품관리</a>
  </nav>
</header>

<div class="container">
  <h1>Step 1. 계좌 선택</h1>

  <!-- ✅ 삼항 연산자만 사용 -->
  <div class="flow-badge"
       th:text="${session.ChangeValueDto?.flow} ?: 'FLOW 미지정'">FLOW 미지정</div>

  <p class="subtle mt-4">IRP는 필수이며, DC 계좌가 있으면 선택할 수 있습니다.</p>

  <!-- IRP 없을 때 안내 -->
  <div class="banner warn" th:classappend="${session.hasIrp} ? '' : ' show'">
    IRP 계좌가 없습니다. 먼저 IRP를 개설해주세요.
    <a href="/account/open/irp" style="margin-left:6px;text-decoration:underline;color:#1e40af">IRP 개설</a>
  </div>

  <div class="grid mt-4">
    <!-- IRP -->
    <section class="card">
      <div class="card-head">
        <div class="title-sm">IRP (필수)</div><span class="badge">Required</span>
      </div>

      <!-- IRP 있음 -->
      <div th:if="${session.hasIrp}">
        <label class="radio-card selected">
          <div class="radio">
            <input type="radio" name="accountChoice"
                   th:value="${'IRP|' + session.irpAcctNo}"
                   checked="checked">
            <div>
              <div class="title-sm">IRP 계좌</div>
              <div class="subtle">IRP · 번호: <span th:text="${session.irpAcctNo}">-</span></div>
            </div>
          </div>
          <div class="badge">선택</div>
        </label>
      </div>

      <!-- IRP 없음 -->
      <div th:if="${!session.hasIrp}">
        <div class="radio-card disabled">
          <div>
            <div class="title-sm">IRP 계좌 없음</div>
            <div class="subtle">다음 단계로 진행하려면 IRP 계좌가 필요합니다.</div>
          </div>
          <a href="/account/open/irp" class="badge">IRP 개설</a>
        </div>
      </div>
    </section>

    <!-- DC -->
    <section class="card">
      <div class="card-head">
        <div class="title-sm">DC (선택)</div><span class="badge">Optional</span>
      </div>

      <!-- DC 목록 -->
      <div th:if="${session.hasDc}">
        <div th:each="no : ${session.dcAccounts}">
          <label class="radio-card">
            <div class="radio">
              <input type="radio" name="accountChoice" th:value="${'DC|' + no}">
              <div>
                <div class="title-sm">DC 계좌</div>
                <div class="subtle">DC · 번호: <span th:text="${no}">-</span></div>
              </div>
            </div>
            <div class="badge">선택</div>
          </label>
        </div>
      </div>

      <!-- DC 없음 -->
      <div th:if="${!session.hasDc}">
        <div class="radio-card disabled">
          <div class="title-sm">DC 계좌 없음</div>
          <div class="subtle">선택 불가</div>
        </div>
      </div>
    </section>
  </div>

  <!-- 제출 -->
  <form th:action="@{/purchase/trade/change/step1/next}" method="post" class="mt-8 row" id="acctForm">
    <!-- ✅ CSRF 토큰은 있을 때만 렌더 (없으면 이 줄 자체가 사라짐) -->
    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

    <input type="hidden" id="accountType" name="accountType" value="">
    <input type="hidden" id="accountId"   name="accountId"   value="">
    <a th:href="@{/purchase/holdings}" class="btn btn-link">이전</a>
    <button id="nextBtn" type="submit" class="btn btn-primary row-right" disabled>다음</button>
  </form>

  <div class="subtle mt-4">* IRP가 없으면 먼저 IRP를 개설해야 다음 단계로 진행할 수 있습니다.</div>
</div>

<script>
  (function(){
    const nextBtn   = document.getElementById('nextBtn');
    const accountTypeInput = document.getElementById('accountType');
    const accountIdInput   = document.getElementById('accountId');

    function setSelected(value){
      if(!value) return;
      const parts = value.split('|');
      const type = parts.length > 0 ? parts[0] : '';
      const id   = parts.length > 1 ? parts[1] : '';
      accountTypeInput.value = type;
      accountIdInput.value   = id;
      document.querySelectorAll('.radio-card').forEach(el => el.classList.remove('selected'));
      const sel = document.querySelector(`input[name="accountChoice"][value="${value.replace(/([.*+?^${}()|[\]\\])/g,'\\$1')}"]`);
      if(sel){ sel.closest('.radio-card').classList.add('selected'); }
      nextBtn.disabled = !(type && id);
    }

    // 초기 선택(보통 IRP) 반영
    const checked = document.querySelector('input[name="accountChoice"]:checked');
    if(checked){ setSelected(checked.value); }

    // 선택 변경 시 반영
    document.querySelectorAll('input[name="accountChoice"]').forEach(r=>{
      r.addEventListener('change', e => setSelected(e.target.value));
    });
  })();
</script>
</body>
</html>
