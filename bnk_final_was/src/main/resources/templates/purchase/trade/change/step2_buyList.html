<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<title>매수 상품 배분 (변경 Step2-3)</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{
  font-family: 'Pretendard', sans-serif;
  margin:0;
  padding: 0;
  color: #222;
  background:#F7F8FB;
}
/* ===== 페이지 배경/타이포 ===== */
html, body { height:100%; }

/* 컨테이너 패딩 & 하단 바와 겹침 방지 */
div > section { margin:0 auto 4px; max-width:768px; }

/* 카드 섹션(아주 약한 그림자) */
section.bg-white{
  padding-bottom: 40px;
  width: 100%;
}
section.bg-white > .text-xl { font-weight:700; } 
.text-neutral-500{ color:#6b7280!important; }


.layout { 
  height:100vh; 
  display:flex; 
  flex-direction:column;  
}
/* 본문만 스크롤 */
.content {
  flex:1 1 auto;
  overflow:auto;
  min-height:0;
  -webkit-overflow-scrolling:touch;
}

/* 하단 고정 버튼바 */
.footer{
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  background:#fff; border-top:1px solid #eee;
  padding:14px 16px 40px 16px;
}
.footer a,
.footer button{
  height:56px;
  border-radius:14px;
  font-size:18px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  text-decoration:none; border:none; cursor:pointer;
}
.footer a{ background:#8e94a6; color:#fff; }
.footer button{ background:#ff5252; color:#fff; }
.footer button:disabled{ background:#f8c9c9; color:#fff; }

/* 상단 3칸 요약 박스 */
.grid .p-3{
  background:#F3F4F6!important; border-radius:10px;
  border:1px solid #ececec;
  font-weight:600;
}

/* ── 매수 목록 헤더 영역 ── */
section .flex.items-center.justify-between h3{ font-weight:800; }
section .flex.items-center.justify-between .flex.gap-2 > button{
  height:34px; padding:0 12px; border-radius:999px;
  border:1px solid #e5e7eb; background:#fff; font-weight:700; cursor:pointer;
  box-shadow:0 4px 12px rgba(0,0,0,.02);
}
#addRow{ background:#F4F7FF; border-color:#DCE6FF; }
#addRow:hover{ background:#EEF3FF; }
#clearAll:hover{ background:#F9FAFB; }

/* ── 표 전체 ── */
.overflow-x-auto{ border-radius:16px; }
.min-w-full{
  width:100%; border-collapse:separate; border-spacing:0;
  background:#fff; border:1px solid #eee; border-radius:16px;
  box-shadow:0 8px 24px rgba(0,0,0,.03); overflow:hidden;
}

/* 헤더(th) 컴팩트 + 둥근 상단 */
.min-w-full thead tr{ background:#F7F8FB; }
.min-w-full th{
  padding:8px 12px;                /* ← 위아래 여백 줄임 */
  font-size:13px; font-weight:800; color:#374151;
  border-bottom:1px solid #eee;
}
.min-w-full thead th:first-child{ border-top-left-radius:16px; }
.min-w-full thead th:last-child { border-top-right-radius:16px; }

/* 바디 셀/행 */
.min-w-full td{
  padding:10px 12px; font-size:14px; vertical-align:middle;
  border-bottom:1px solid #f2f2f2;
}
.min-w-full tbody tr:last-child td{ border-bottom:none; }
.min-w-full tbody tr:nth-child(odd){ background:#FCFCFD; }
.min-w-full tbody tr:hover{ background:#F6F7FB; }

/* 행 추가 시 부드럽게 */
.min-w-full tbody tr{ animation:rowIn .16s ease-out; }
@keyframes rowIn { from{opacity:0; transform:translateY(2px);} to{opacity:1; transform:none;} }

/* 입력 필드 톤 */
.min-w-full input.pid,
.min-w-full input.pname,
.min-w-full input.ratio,
.min-w-full input.border{ 
  width:100%; height:36px; padding:0 10px;
  border:1px solid #e5e7eb; border-radius:10px; background:#fff; outline:none;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.min-w-full input:focus{
  border-color:#c9cfdb; box-shadow:0 0 0 3px rgba(17,24,39,.06);
}
.min-w-full input[type=number]::-webkit-outer-spin-button,
.min-w-full input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
.min-w-full input[type=number]{ -moz-appearance:textfield; }

/* 금액 표시 */
.amountVal{ font-weight:800; color:#111827; }

/* 삭제 버튼 */
.min-w-full button.del{
  height:32px; padding:0 12px; border-radius:999px;
  border:1px solid #f1c7c7; background:#fff5f5; color:#d23c3c; font-weight:700;
  white-space:nowrap;   /* ← 줄바꿈 방지 */
}
.min-w-full button.del:hover{ background:#ffecec; }

/* ── 하단 고정 버튼 바(전체폭, 라운드/그림자 없음) ── */
section .flex.gap-2:has(#nextBtn){
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:#fff; border-top:1px solid #eee; border-radius:0; box-shadow:none;
  padding:14px 16px; margin:0!important;
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
section .flex.gap-2:has(#nextBtn) > a{
  display:inline-flex; align-items:center; justify-content:center;
  height:56px; width:100%; border:none; border-radius:14px;
  background:#8e94a6; color:#fff; font-size:16px; font-weight:800; text-decoration:none;
} 
#nextBtn{
  height:56px; width:100%; border:none; border-radius:14px;
  background:#ff5252; color:#fff; font-size:16px; font-weight:800;
}
#nextBtn:disabled{ background:#f8c9c9; color:#fff; opacity:1; }

#errorBox {
  margin-bottom: 45px;
}

/* iOS 안전영역 대응 */
@supports (padding: max(0px)){
  body{ padding-bottom:max(0px, env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>

<div class="layout">

  <!-- 상단 합계/잔여 안내 -->
  <section class="bg-white p-4">
    <h2 class="text-xl font-semibold">매수 상품 배분</h2>
    <p class="text-sm text-neutral-500">비율 총합이 100%가 되도록 배분하세요. (금액은 자동 계산)</p>
    <div class="mt-3 grid grid-cols-1 md:grid-cols-3 gap-2 text-sm">
      <div class="p-3 rounded-lg bg-neutral-100">
        매도 합계액: <b id="soldTotal">0원</b>
      </div>
      <div class="p-3 rounded-lg bg-neutral-100">
        매수 합계액: <b id="buyTotal">0원</b>
      </div>
      <div class="p-3 rounded-lg bg-neutral-100">
        남은 금액: <b id="remain">0원</b>
      </div>
    </div>
  </section>

<!-- 매수 목록 -->
<!-- 본문 스크롤 영역 -->
  <div class="content">
    <section class="bg-white p-4 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold">매수 목록</h3>
        <div class="flex gap-2">
          <button id="addRow" class="rounded-xl bg-neutral-200">행 추가</button>
          <button id="clearAll" class="rounded-xl bg-neutral-200">초기화</button>
        </div>
      </div>

      <div class="overflow-x-auto">
        <table class="min-w-full text-sm">
          <thead>
            <tr class="text-left text-neutral-500 border-b">
              <th class="py-2 pr-3">상품ID</th>
              <th class="py-2 pr-3">상품명</th>
              <th class="py-2 pr-3">배분비율(%)</th>
              <th class="py-2 pr-3">매수금액</th>
              <th class="py-2 pr-3"><span class="sr-only">삭제</span></th>
            </tr>
          </thead>
          <tbody id="buyBody"></tbody>
        </table>
      </div>

      <div class="text-lg">비율 합계: <b id="sumRatio">0%</b></div>
      <div id="errorBox" class="text-sm text-red-600 hidden">유효하지 않은 항목이 있습니다.</div>
    </section>
  </div>

  <!-- 하단 고정 버튼바 -->
  <div class="footer">
    <a href="/purchase/trade/change/step2/changeProdList">이전</a>
    <button id="nextBtn" disabled>다음</button>
  </div>
 
</div>

<script>
  // ===== 유틸 =====
  const toKRW = n => (Number(n||0)).toLocaleString('ko-KR') + '원';
  const fmtNum = n => (Number(n||0)).toLocaleString('ko-KR');

  // 행 템플릿
  function rowTemplate(idx, item){
    return `
      <tr class="border-b" data-idx="${idx}">
        <td class="py-2 pr-3">
          <input class="pid w-40 px-2 py-1 border rounded" value="${item.prodId ?? ''}">
        </td>
        <td class="py-2 pr-3">
          <input class="pname w-64 px-2 py-1 border rounded" value="${item.name ?? ''}">
        </td>
        <td class="py-2 pr-3">
          <input type="number" min="0" max="100" step="1"
                 class="ratio w-24 px-2 py-1 border rounded text-right" value="${item.ratio ?? 0}">
        </td>
        <td class="py-2 pr-3">
          <div class="flex items-center gap-2">
            <span class="amountVal">${fmtNum(item.amount ?? 0)}원</span>
          </div>
        </td>
        <td class="py-2 pr-3">
          <button class="del px-2 py-1 rounded bg-red-100 text-red-700">삭제</button>
        </td>
      </tr>
    `;
  }

  function render(all, soldTotal){
    const tbody = document.getElementById('buyBody');
    tbody.innerHTML = all.map((it, idx)=> rowTemplate(idx, it)).join('');

    // 비율 입력 → 금액 자동 계산
    tbody.querySelectorAll('.ratio').forEach(inp=>{
      inp.addEventListener('input', ()=>{
        const tr  = inp.closest('tr');
        const idx = Number(tr.dataset.idx);
        let v = Number(inp.value || 0);
        if (v < 0) v = 0; if (v > 100) v = 100;
        inp.value = v;
        all[idx].ratio = v;

        // 금액 자동 계산
        const amt = Math.floor(soldTotal * v / 100);
        all[idx].amount = amt;
        tr.querySelector('.amountVal').textContent = fmtNum(amt) + "원";

        updateSummary(all, soldTotal);
      });
    });

    // 삭제
    tbody.querySelectorAll('.del').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = Number(btn.closest('tr').dataset.idx);
        all.splice(idx,1);
        render(all, soldTotal);
        updateSummary(all, soldTotal);
      });
    });

    updateSummary(all, soldTotal);
  }

  function updateSummary(all, soldTotal){
    const sumRatio = all.reduce((a,c)=> a + Number(c.ratio||0), 0);
    const buyTotal = all.reduce((a,c)=> a + Number(c.amount||0), 0);
    const remain   = Math.max(0, soldTotal - buyTotal);

    document.getElementById('sumRatio').textContent = `${sumRatio}%`;
    document.getElementById('buyTotal').textContent = toKRW(buyTotal);
    document.getElementById('remain').textContent   = toKRW(remain);

    const invalidRow = all.some(r => !r.prodId || !r.name);

    // ✅ 비율 합계 반드시 100이어야만 통과
    const ok = (sumRatio === 100) && buyTotal > 0 && buyTotal <= soldTotal && !invalidRow;

    document.getElementById('nextBtn').disabled = !ok;
    document.getElementById('errorBox').classList.toggle('hidden', ok);

    if (!ok){
      const parts = [];
      if (sumRatio !== 100) parts.push(`비율 합계가 100%가 아닙니다. (현재 ${sumRatio}%)`);
      if (buyTotal > soldTotal) parts.push('매수 합계액이 매도 합계액을 초과했습니다.');
      if (buyTotal <= 0) parts.push('매수 합계액이 0원 이하입니다.');
      if (invalidRow) parts.push('빈 필드가 있습니다.');
      document.getElementById('errorBox').textContent = parts.join(' ');
    }
  }

  // ✅ goNext
  async function goNext(all, soldTotal){
    await fetch("/retain-api/change/step2/buy/save", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(all)
    });
    location.href = "/purchase/trade/change/step4/docs";
  }

  // init
  (async function init(){
    let soldTotal = 0;
    let all = [];

    try{
      const r = await fetch('/retain-api/change/step2/snapshot');
      const data = await r.json();
      soldTotal = Number(data?.dto?.soldTotalAmount ?? 0);
      const buyItems = Array.isArray(data?.dto?.buyItems) ? data.dto.buyItems : [];
      all = buyItems.map(b => ({
        type  : b.type,
        prodId: b.prodId || '',
        name  : b.name   || '',
        ratio : Number(b.ratio || 0),
        amount: Math.floor(soldTotal * (Number(b.ratio || 0)) / 100)
      }));
    }catch(e){ console.error(e); }

    document.getElementById('soldTotal').textContent = toKRW(soldTotal);
    render(all, soldTotal);

    document.getElementById('addRow').addEventListener('click', ()=>{
      all.push({prodId:'', name:'', ratio:0, amount:0});
      render(all, soldTotal);
    });
    document.getElementById('clearAll').addEventListener('click', ()=>{
      all = []; render(all, soldTotal);
    });
    document.getElementById('nextBtn').addEventListener('click', ()=>goNext(all, soldTotal));
  })();
</script>
</body>
</html>
