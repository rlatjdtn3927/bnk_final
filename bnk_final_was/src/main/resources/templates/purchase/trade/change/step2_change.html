<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>보유상품 변경</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-neutral-100 text-neutral-900">
  <!-- 서버 세션 값 노출용 (JS에서 dataset으로 읽음) -->
  <div id="ctx"
       th:data-account-type="${session.ChangeValueDto != null ? session.ChangeValueDto.accountType : ''}"
       th:data-account-id="${session.ChangeValueDto != null ? session.ChangeValueDto.accountId : ''}"></div>

  <div class="max-w-xl mx-auto p-4">
    <header class="mb-4">
      <h1 class="text-xl font-semibold">보유상품 변경</h1>
      <p class="text-sm text-neutral-500">현재 계좌의 보유/미운용 자산을 확인해 주세요.</p>
    </header>

    <!-- 사용자/계좌 카드 -->
    <section id="userCard" class="bg-white rounded-2xl shadow-sm border border-neutral-200 p-4 mb-4">
      <div class="flex items-center justify-between">
        <div class="space-y-1">
          <div class="text-sm text-neutral-500">계좌정보</div>
          <div class="font-medium" id="uc-account"></div>
          <div class="text-sm" id="uc-owner"></div>
        </div>
        <div>
          <span id="uc-risk" class="inline-flex items-center px-2 py-1 rounded-full text-xs bg-neutral-100 border border-neutral-200"></span>
        </div>
      </div>
    </section>

    <!-- 보유상품 목록 영역 -->
    <section id="holdingsList" class="space-y-3"></section>

    <!-- 다음 버튼: PRG 패턴을 위해 POST 후 리다이렉트(컨트롤러에서 redirect) 권장 -->
    <div class="mt-6">
      <form action="/purchase/trade/change/step2_change/next" method="post">
        <button type="submit" class="w-full h-12 rounded-xl bg-rose-500 text-white text-base font-semibold">다음</button>
      </form>
    </div>
  </div>

  <script>
    const fmtWon = (n) => {
      if (n === null || n === undefined) return '-';
      try { return new Intl.NumberFormat('ko-KR').format(n) + ' 원'; } catch { return String(n) + ' 원'; }
    };
    const fmtRate = (n, suffix = '%') => {
      if (n === null || n === undefined) return '-';
      try { return (typeof n === 'number' ? n.toFixed(2) : n) + ' ' + suffix; } catch { return String(n) + ' ' + suffix; }
    };
    const makeBadge = (text) => {
      const span = document.createElement('span');
      span.className = 'inline-flex items-center px-2 py-0.5 rounded-full text-[11px] bg-neutral-100 border border-neutral-200';
      span.textContent = text;
      return span;
    };
    const renderUserCard = (userInfo) => {
      const acct = document.getElementById('uc-account');
      const owner = document.getElementById('uc-owner');
      const risk = document.getElementById('uc-risk');
      const accountType = userInfo.accountType || '-';
      const accountId = userInfo.accountId || '-';
      acct.textContent = `${accountType} · ${accountId}`;
      owner.textContent = userInfo.userName ? `예금주: ${userInfo.userName}` : '';
      risk.textContent = userInfo.riskGrade ? `투자성향: ${userInfo.riskGrade}` : '투자성향: -';
    };

    const renderPrincipalCard = (item, contributionLabel) => {
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl shadow-sm border border-neutral-200 p-4';
      const title = document.createElement('div');
      title.className = 'font-semibold mb-2';
      title.textContent = item.productName || '정기예금/원리금 상품';
      card.appendChild(title);
      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-2 gap-y-2 text-sm';
      const rows = [
        ['적립금구분', contributionLabel],
        ['매수원금', fmtWon(item.contractAmount)],
        ['평가액', fmtWon((item.contractAmount ?? 0) + (item.interestAccrued ?? 0))],
        ['매도가능금액', fmtWon(item.contractAmount)],
        ['금리', item.interestRate ? `${item.interestRate} %` : '-']
      ];
      rows.forEach(([k, v]) => {
        const kEl = document.createElement('div'); kEl.className = 'text-neutral-500'; kEl.textContent = k;
        const vEl = document.createElement('div'); vEl.className = 'text-right'; vEl.textContent = v;
        grid.appendChild(kEl); grid.appendChild(vEl);
      });
      card.appendChild(grid);
      return card;
    };

    const renderFundCard = (item, contributionLabel) => {
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl shadow-sm border border-neutral-200 p-4';
      const badgeWrap = document.createElement('div');
      badgeWrap.className = 'flex gap-1 mb-1';
      if (item.riskGradeText) badgeWrap.appendChild(makeBadge(item.riskGradeText));
      if (item.category) badgeWrap.appendChild(makeBadge(item.category));
      if (item.fundType) badgeWrap.appendChild(makeBadge(item.fundType));
      card.appendChild(badgeWrap);
      const title = document.createElement('div');
      title.className = 'font-semibold mb-2';
      title.textContent = item.productName || '펀드';
      card.appendChild(title);
      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-2 gap-y-2 text-sm';
      const rows = [
        ['적립금구분', contributionLabel],
        ['매수원금', fmtWon(item.acquisitionAmount)],
        ['평가액', fmtWon(item.valuationAmount)],
        ['매도가능좌수', item.units != null ? new Intl.NumberFormat('ko-KR').format(item.units) + ' 좌' : '-'],
        ['수익률', item.returnRate != null ? fmtRate(item.returnRate) : '-']
      ];
      rows.forEach(([k, v]) => {
        const kEl = document.createElement('div'); kEl.className = 'text-neutral-500'; kEl.textContent = k;
        const vEl = document.createElement('div'); vEl.className = 'text-right'; vEl.textContent = v;
        grid.appendChild(kEl); grid.appendChild(vEl);
      });
      card.appendChild(grid);
      return card;
    };

    const renderCashCard = (item, contributionLabel) => {
      const card = document.createElement('div');
      card.className = 'bg-white rounded-2xl shadow-sm border border-neutral-200 p-4';
      const title = document.createElement('div');
      title.className = 'font-semibold mb-2';
      title.textContent = '(미운용)현금성자산';
      card.appendChild(title);
      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-2 gap-y-2 text-sm';
      const rows = [
        ['적립금구분', contributionLabel],
        ['평가액', fmtWon(item.valuationAmount ?? item.amount)],
        ['매도가능금액', fmtWon(item.amount)],
        ['금리', item.interestRate ? `${item.interestRate} %` : '-']
      ];
      rows.forEach(([k, v]) => {
        const kEl = document.createElement('div'); kEl.className = 'text-neutral-500'; kEl.textContent = k;
        const vEl = document.createElement('div'); vEl.className = 'text-right'; vEl.textContent = v;
        grid.appendChild(kEl); grid.appendChild(vEl);
      });
      card.appendChild(grid);
      return card;
    };

    const load = async () => {
      const { accountType, accountId } = document.getElementById('ctx').dataset;
      const contributionLabel = accountType === 'DC' ? '퇴직금' : '본인부담금';
      try {
        const r1 = await fetch('/retain-api/change/user-info', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const j1 = await r1.json();
        if (j1 && j1.userInfo) renderUserCard(j1.userInfo);
      } catch (e) { console.error(e); }
      try {
        const q = new URLSearchParams({ accountType, accountId }).toString();
        const r2 = await fetch('/retain-api/change/retain?' + q, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
        const j2 = await r2.json();
        const root = j2.data ?? j2;
        const listWrap = document.getElementById('holdingsList');
        const principals = root.principalLedgers || root.principalLedgerDtoList || [];
        const funds      = root.fundHoldings   || root.fundHoldingsDtoList   || [];
        const cash       = root.cashAsset || null;
        principals.forEach(p => listWrap.appendChild(renderPrincipalCard(p, contributionLabel)));
        funds.forEach(f => listWrap.appendChild(renderFundCard(f, contributionLabel)));
        if (cash) listWrap.appendChild(renderCashCard(cash, contributionLabel));
        if (!principals.length && !funds.length && !cash) {
          const empty = document.createElement('div');
          empty.className = 'text-sm text-neutral-500 text-center py-8';
          empty.textContent = '보유 중인 자산이 없습니다.';
          listWrap.appendChild(empty);
        }
      } catch (e) { console.error(e); }
    };
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
