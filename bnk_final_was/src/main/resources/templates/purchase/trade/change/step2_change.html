<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>보유상품 목록 (변경 Step2)</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
/* ===== 공통 레이아웃 ===== */
html, body { height:100%; }
body{
  font-family:'Pretendard', sans-serif;
  margin:0; padding:0;
  color:#222; background:#f9fafb;
}
.layout{ height:100vh; display:flex; flex-direction:column; }

/* ===== 헤더 ===== */
.header-wrap{
  position:sticky; top:0; z-index:1000;
  background:#fff; border-bottom:1px solid #eee;
}
.header{ max-width:960px; margin:0 auto; padding:14px 16px; }
.page-title{ font-size:20px; font-weight:700; margin:6px 0; }

/* ===== 본문 ===== */
.content{
  flex:1 1 auto;
  overflow:auto;
  min-height:0;
  -webkit-overflow-scrolling:touch;
  padding-bottom:120px;          
}
.divider{ height:4px; background:#eee; border-radius:1px; }

/* ===== 카드 ===== */
.section{ max-width:960px; margin:0 auto 20px; padding:16px }
.card{
  background:#fff; border:1px solid #f0f0f0; border-radius:18px;
  padding:20px;
  box-shadow:0 4px 8px rgba(0,0,0,.03);
}
.card h3{ margin:0 0 16px; font-size:17px; font-weight:800; display:flex; justify-content:space-between; align-items:center; }
.muted{ color:#6b7280; font-size:14px; }

/* ===== 테이블 ===== */
table{ width:100%; border-collapse:separate; border-spacing:0; }
thead th{ background:#f8fafc; font-weight:700; font-size:13px; padding:12px; text-align:left; border-bottom:1px solid #e5e7eb; }
tbody td{ padding:12px; font-size:14px; border-bottom:1px solid #f1f5f9; color:#374151; }
tbody tr:last-child td{ border-bottom:0; }
tbody td[colspan]{ text-align:center; color:#9ca3af; }
input[type="checkbox"]{ width:16px; height:16px; }

/* ===== 버튼바 ===== */
.actions{
  position:fixed; left:0; right:0; bottom:0; z-index:1100;
  background:#fff; border-top:1px solid #eee;
  padding:14px 16px 30px;
  display:grid; grid-template-columns:1fr 1fr; gap:12px;
  max-width:960px; margin:0 auto;
}
.actions .btn{
  width:100%; height:52px;
  border-radius:14px; font-size:16px; font-weight:700;
  display:flex; align-items:center; justify-content:center;
  border:none; padding:0; cursor:pointer;
}
.actions .btn.btn-link{ background:#8d94a6; color:#fff; }
.actions .btn-primary{ background:#f85151; color:#fff; }
.actions .btn-primary:disabled{ background:#ffd6d6; cursor:not-allowed; }

/* ===== 모바일 대응 ===== */
@media (max-width:500px){
  .page-title{ font-size:18px; }
  .card h3{ font-size:15px; }
  thead th, tbody td{ font-size:13px; padding:8px }
}
@supports (padding: max(0px)){
  .actions{ padding-bottom:max(22px, env(safe-area-inset-bottom)); }
}
</style>
</head>
<body>
<div class="layout">
  <!-- 헤더 -->
  <div class="header-wrap">
    <div class="header">
      <div class="page-title">보유상품관리</div>
    </div>
  </div>
  
  <main class="content">
    <div class="divider"></div>

    <!-- 안내 카드 -->
    <section class="section">
      <div class="card">
        <h3>보유상품 변경 <span id="riskBadge" class="px-3 py-1 rounded-full text-xs bg-neutral-100">리스크: -</span></h3>
        <p class="muted">보유상품 목록에서 매도할 상품을 선택하세요.</p>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-3 mt-4 text-sm">
          <div class="bg-neutral-50 rounded-lg p-3">
            <div class="text-neutral-500">사용자</div>
            <div id="userName" class="font-semibold">-</div>
          </div>
          <div class="bg-neutral-50 rounded-lg p-3">
            <div class="text-neutral-500">계좌유형</div>
            <div id="accountType" class="font-semibold">-</div>
          </div>
          <div class="bg-neutral-50 rounded-lg p-3">
            <div class="text-neutral-500">계좌ID</div>
            <div id="accountId" class="font-semibold truncate">-</div>
          </div>
        </div>
      </div>
    </section>

    <!-- 펀드 보유내역 -->
    <section class="section">
      <div class="card">
        <h3>펀드 보유내역 <label class="text-sm text-neutral-500 flex items-center gap-2"><input id="chkAllFund" type="checkbox" class="w-4 h-4"> 전체선택</label></h3>
        <div class="overflow-x-auto">
          <table>
            <thead id="fundHead"></thead>
            <tbody id="fundBody"><tr><td colspan="6" class="py-6 text-center text-neutral-400">불러오는 중…</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- 원리금 보장상품 -->
    <section class="section">
      <div class="card">
        <h3>원리금 보장상품</h3>
        <div class="overflow-x-auto">
          <table>
            <thead id="principalHead"></thead>
            <tbody id="principalBody"><tr><td colspan="6" class="py-6 text-center text-neutral-400">불러오는 중…</td></tr></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- 버튼 -->
  <div class="actions">
    <button class="btn btn-link" onclick="location.href='/purchase/trade/change/step1/after-risk'">이전</button>
    <button id="nextBtn" class="btn btn-primary" disabled>다음</button>
  </div>
</div>

<script th:inline="javascript">
  const SESSION_ACCOUNT_TYPE = /*[[${session.ChangeValueDto?.accountType}]]*/ null;
  const SESSION_ACCOUNT_ID   = /*[[${session.ChangeValueDto?.accountId}]]*/ null;
</script>
<script>
  const fmtKRW = n => (Number(n ?? 0)).toLocaleString('ko-KR') + '원';
  const byPath = (obj, path) => path.split('.').reduce((o,k)=>o&&o[k], obj);

  async function fetchUserInfo() {
    const r = await fetch('/retain-api/change/user-info', {method:'POST'});
    if (!r.ok) throw new Error('user-info failed');
    return await r.json();
  }
  async function fetchHoldings(accountType, accountId) {
    const params = new URLSearchParams({accountType, accountId});
    const r = await fetch('/retain-api/change/retain?' + params.toString(), {method:'POST'});
    if (!r.ok) throw new Error('retain failed');
    return await r.json();
  }

  function normalizeHoldings(res) {
    const root = res?.resultList ?? res?.data ?? res?.result ?? res?.payload ?? res;
    if (Array.isArray(root)) {
      return { 
        funds: root.filter(x => x?.fundProductId || (x?.productName && x?.units != null)), 
        principals: root.filter(x => x?.principalId || x?.contractAmount != null) 
      };
    }
    return {
      funds: root?.fundHoldings ?? root?.funds ?? [],
      principals: root?.principalLedgers ?? root?.principals ?? []
    };
  }

  function renderFunds(list) {
    const head = document.getElementById('fundHead');
    const body = document.getElementById('fundBody');
    if (!list || list.length === 0) {
      head.innerHTML = '';
      body.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-neutral-400">펀드 보유내역이 없습니다.</td></tr>`;
      return;
    }
    head.innerHTML = `<tr><th></th><th>상품명</th><th>보유좌수</th><th>평가액</th><th>수익률</th></tr>`;
    body.innerHTML = list.map(item=>{
      const units   = item.units!=null ? Math.round(item.units) : '-';
      const evalAmt = item.valuationAmount!=null ? fmtKRW(item.valuationAmount):'-';
      const rr      = Number(item.returnRate??NaN);
      const rrStr   = Number.isFinite(rr)? rr.toFixed(2)+'%' : '-';
      return `<tr>
        <td><input type="checkbox" class="fundChk"
              data-id="${item.id??''}"
              data-product-id="${item.fundProductId??''}"
              data-name="${(item.productName??'').replace(/"/g,'&quot;')}"
              data-base="${Number(item.valuationAmount??0)}"></td>
        <td>${item.productName??'-'}</td>
        <td>${units}</td>
        <td>${evalAmt}</td>
        <td>${rrStr}</td>
      </tr>`;
    }).join('');
    document.getElementById('chkAllFund')?.addEventListener('change', e=>{
      document.querySelectorAll('.fundChk').forEach(c=> c.checked=e.target.checked);
      toggleNext();
    });
    document.querySelectorAll('.fundChk').forEach(c=> c.addEventListener('change', toggleNext));
  }

  function renderPrincipals(list){
    const head = document.getElementById('principalHead');
    const body = document.getElementById('principalBody');
    if(!list||list.length===0){
      head.innerHTML='';
      body.innerHTML=`<tr><td colspan="4" class="py-6 text-center text-neutral-400">원리금 보장상품 보유내역이 없습니다.</td></tr>`;
      return;
    }
    head.innerHTML=`<tr><th></th><th>상품ID</th><th>가입원금</th><th>만기일</th></tr>`;
    body.innerHTML=list.map(item=>{
      const contractAmt=item.contractAmount!=null?fmtKRW(item.contractAmount):'-';
      const maturity=item.maturityDate??'-';
      return `<tr>
        <td><input type="checkbox" class="principalChk"
              data-id="${item.id??''}"
              data-product-id="${item.principalId??''}"
              data-name="원리금보장(${item.principalId??'-'})"
              data-base="${Number(item.contractAmount??0)}"></td>
        <td>${item.principalId??'-'}</td>
        <td>${contractAmt}</td>
        <td>${maturity}</td>
      </tr>`;
    }).join('');
    document.querySelectorAll('.principalChk').forEach(c=>c.addEventListener('change',toggleNext));
  }

  function toggleNext(){
    const anyChecked=document.querySelectorAll('.fundChk:checked,.principalChk:checked').length>0;
    document.getElementById('nextBtn').disabled=!anyChecked;
  }

  function goNext(){
    const soldCandidates=[];
    document.querySelectorAll('.fundChk:checked').forEach(c=>{
      soldCandidates.push({type:'FUND',holdingId:c.dataset.id,prodId:c.dataset.productId,
        name:c.dataset.name,baseAmount:Number(c.dataset.base),ratio:0,amount:0});
    });
    document.querySelectorAll('.principalChk:checked').forEach(c=>{
      const ledgerId=c.dataset.id?Number(c.dataset.id):null;
      soldCandidates.push({type:'PRINCIPAL',ledgerId,id:ledgerId,prodId:c.dataset.productId,
        name:c.dataset.name,baseAmount:Number(c.dataset.base),ratio:0,amount:0});
    });
    sessionStorage.setItem('change.soldCandidates',JSON.stringify(soldCandidates));
    location.href='/purchase/trade/change/step2/sold-list';
  }

  (async function init(){
    try{
      const u=await fetchUserInfo();
      const info=byPath(u,'userInfo')||{};
      document.getElementById('userName').textContent=info.userName??'-';
      document.getElementById('accountType').textContent=info.accountType??(SESSION_ACCOUNT_TYPE??'-');
      document.getElementById('accountId').textContent=info.accountId??(SESSION_ACCOUNT_ID??'-');
      document.getElementById('riskBadge').textContent=`리스크: ${info.riskGrade??'-'}`;
      const accountType=info.accountType??SESSION_ACCOUNT_TYPE;
      const accountId=info.accountId??SESSION_ACCOUNT_ID;
      const res=await fetchHoldings(accountType,accountId);
      const {funds,principals}=normalizeHoldings(res);
      renderFunds(funds||[]);
      renderPrincipals(principals||[]);
      document.getElementById('nextBtn').addEventListener('click',goNext);
    }catch(e){
      console.error(e);
      document.getElementById('fundBody').innerHTML=`<tr><td colspan="6" class="py-6 text-center text-red-500">보유내역을 불러오지 못했습니다.</td></tr>`;
      document.getElementById('principalBody').innerHTML=`<tr><td colspan="6" class="py-6 text-center text-red-500">보유내역을 불러오지 못했습니다.</td></tr>`;
    }
  })();
</script>
</body>
</html>
