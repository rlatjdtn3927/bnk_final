<!-- templates/purchase/trade/step2.html (예시) -->
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="css">
  <style id="page-css" hx-swap-oob="true">
    .reserve-step2 { max-width: 720px; margin: 0 auto; padding: 16px 16px 100px; }
    .page-title { font-weight: 700; font-size: 20px; margin-bottom: 4px; }
    .page-sub { color:#666; font-size: 13px; margin-bottom: 12px; }
    .steps { display:flex; gap:6px; align-items:center; margin: 12px 0 18px; }
    .step-dot { width:22px; height:22px; line-height:22px; text-align:center; border-radius:50%; background:#eee; font-size:12px; color:#888; }
    .step-dot.active { background:#ff6b6b; color:#fff; font-weight:700; }
    .card { border:1px solid #eee; border-radius:12px; padding:14px; background:#fff; }
    .user-card { display:grid; grid-template-columns: 1fr 1fr; gap:8px 12px; }
    .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#f3f4f6; font-size:12px; margin-right:6px; }
    .badge.risk { background:#ffe5e5; color:#cc2b2b; }
    .section-title { font-weight:700; font-size:16px; margin:18px 0 10px; }
    .control { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
    .control label { color:#666; font-size:13px; }
    .retain-list { display:flex; flex-direction:column; gap:10px; }
    .retain-card { border:1px solid #f0f0f0; border-radius:12px; padding:12px; }
    .retain-head { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .retain-name { font-weight:600; margin-bottom:8px; }
    .ratio-row { display:flex; align-items:center; gap:8px; }
    .ratio-row input[type="number"] { width:90px; padding:6px 8px; border:1px solid #ddd; border-radius:8px; }
    .remove { border:none; background:transparent; font-size:18px; line-height:1; cursor:pointer; color:#bbb; }
    .total { display:flex; align-items:center; justify-content:space-between; margin-top:10px; font-size:14px; }
    progress { width:100%; height:10px; }
    .help { font-size:12px; margin-top:6px; }
    .help.ok { color:#2e7d32; }
    .help.warn { color:#e68a00; }
    .help.error { color:#c62828; }
    .page-bottom { position: fixed; left:0; right:0; bottom:0; padding:12px 16px; background:#fff; border-top:1px solid #eee; }
    .btn-primary { width:100%; padding:14px; border:none; border-radius:10px; background:#ff5252; color:#fff; font-weight:700; font-size:16px; cursor:pointer; }
    .btn-primary:disabled { background:#ffd6d6; cursor:not-allowed; }
  </style>
</th:block>

<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <section class="reserve-step2">
    <!-- 상단 타이틀/스텝 -->
    <div class="page-title">매수예정상품등록/변경</div>
    <div class="page-sub">매수예정상품 추가 및 운용비율 등록</div>

    <!-- 사용자/계좌 정보 -->
    <div class="card" id="user-card">
      <div class="user-card">
        <div>
          <div style="font-size:12px; color:#666;">계좌유형</div>
          <div id="accountType">-</div>
        </div>
        <div>
          <div style="font-size:12px; color:#666;">계좌번호</div>
          <div id="accountNumber">-</div>
        </div>
        <div>
          <div style="font-size:12px; color:#666;">성명</div>
          <div id="userName">-</div>
        </div>
        <div>
          <div style="font-size:12px; color:#666;">투자성향</div>
          <div><span class="badge risk" id="riskGrade">-</span></div>
        </div>
      </div>
    </div>

    <!-- 본인부담금 운용 섹션 -->
    <div class="section-title">본인부담금으로 상품운용</div>
    <div class="card">
      <div class="control">
        <label for="changeType">운용변경</label>
        <select id="changeType">
          <option value="KEEP">유지</option>
          <option value="CHANGE">변경</option>
        </select>
      </div>

      <div class="retain-list" id="retainList"><!-- 보유상품 카드 렌더링 영역 --></div>

      <div class="total">
        <div>합계: <strong><span id="totalPercent">0</span>%</strong></div>
        <progress id="totalProgress" max="100" value="0"></progress>
      </div>
      <div id="totalHelp" class="help warn">합계를 100%로 맞춰주세요</div>
    </div>

    <!-- 하단 고정 버튼 -->
    <div class="page-bottom">
      <button id="addProductBtn" class="btn-primary">매수상품 추가</button>
    </div>

    <!-- 서버에서 내려준 모델값 보관 -->
    <div id="model-data"
         th:data-flow="${flow}"
         th:data-account-type="${accountType}"
         th:data-account-id="${accountId}">
    </div>
  </section>

  <script>
    document.addEventListener('DOMContentLoaded', initStep2);

    async function initStep2() {
      const modelEl = document.getElementById('model-data');
      const model = {
        flow: modelEl?.dataset?.flow ?? '',
        accountType: modelEl?.dataset?.accountType ?? '',
        accountId: modelEl?.dataset?.accountId ?? ''
      };

      await loadUserInfo(model);
      await loadRetainList();

      document.getElementById('addProductBtn').addEventListener('click', () => goStep3(model));
    }

    // 1) 사용자 정보 로드
    async function loadUserInfo(model) {
      try {
        const res = await fetch('/retain-api/reserve/user-info', { method: 'POST' });
        if (!res.ok) throw new Error('user-info failed');
        const data = await res.json(); // { userInfo: {...} }
        const u = data.userInfo || {};

        document.getElementById('accountType').textContent  = u.accountType || model.accountType || '-';
        document.getElementById('accountNumber').textContent= u.accountNumber || '-';
        document.getElementById('userName').textContent     = u.userName || '-';
        document.getElementById('riskGrade').textContent    = u.riskGrade || '-';

        // 서버 모델이 비어있으면 user-info로 보정
        model.accountType = model.accountType || u.accountType || '';
        model.accountId   = model.accountId   || u.accountNumber || '';
      } catch (e) {
        console.error(e);
        // 최소한의 기본값 유지
      }
    }

    // 2) 보유상품(운용비율) 로드 & 렌더
    async function loadRetainList() {
      try {
        const res = await fetch('/retain-api/reserve/retain', { method: 'POST' });
        if (!res.ok) throw new Error('retain failed');
        const items = await res.json(); // FundRetainDto[]
        renderRetain(items || []);
      } catch (e) {
        console.error(e);
        renderRetain([]);
      }
    }

    function renderRetain(items) {
      const wrap = document.getElementById('retainList');
      wrap.innerHTML = '';
      items.forEach(it => {
        const el = document.createElement('div');
        el.className = 'retain-card';
        el.dataset.productId = it.productId;

        el.innerHTML = `
          <div class="retain-head">
            <div>
              <span class="badge">${it.category || '상품'}</span>
              <span class="badge risk">${it.riskGradeText || ''}</span>
            </div>
            <button class="remove" title="삭제" aria-label="삭제">&times;</button>
          </div>
          <div class="retain-name">${escapeHtml(it.productName || '')}</div>
          <div class="ratio-row">
            <label>운용비율</label>
            <input type="number" class="ratio-input" min="0" max="100" step="1" value="${it.retainRatio ?? 0}">
            <span>%</span>
          </div>
        `;

        el.querySelector('.remove').addEventListener('click', () => { el.remove(); updateTotal(); });
        el.querySelector('.ratio-input').addEventListener('input', updateTotal);

        wrap.appendChild(el);
      });
      updateTotal();
    }

    function updateTotal() {
      const vals = [...document.querySelectorAll('.ratio-input')].map(i => Number(i.value) || 0);
      const total = vals.reduce((a,b) => a + b, 0);

      document.getElementById('totalPercent').textContent = total;
      document.getElementById('totalProgress').value = Math.min(total, 100);

      const help = document.getElementById('totalHelp');
      const btn  = document.getElementById('addProductBtn');

      if (total > 100) {
        help.textContent = '합계가 100%를 초과했습니다';
        help.className = 'help error';
        btn.disabled = true;
      } else if (total < 100) {
        help.textContent = '합계를 100%로 맞춰주세요';
        help.className = 'help warn';
        btn.disabled = false; // 합계 100%가 아니어도 다음단계로 넘어가서 추가 선택 가능하다면 활성화 유지
      } else {
        help.textContent = '합계가 100%입니다';
        help.className = 'help ok';
        btn.disabled = false;
      }
    }

  </script>
</th:block>
