<!-- src/main/resources/templates/purchase/trade/step5.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>Step 5. 비교·확인</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>
    :root{--bg:#f6f7fb;--fg:#111827;--muted:#6b7280;--brand:#b30000;--border:#e5e7eb;--chip:#f3f4f6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .container{max-width:1000px;margin:0 auto;padding:16px 16px 36px}
    .header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;border-bottom:1px solid var(--border)}
    .brand{font-weight:700;color:var(--brand)}
    h1{font-size:22px;margin:20px 0 8px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    @media(max-width:768px){.grid{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .card h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--border);font-size:16px}
    .list{padding:10px 14px}
    .row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:10px;margin:8px 0;padding:10px 12px;background:#fafafa}
    .name{font-weight:600}
    .ratio{font-size:12px;background:#fff2f2;border:1px solid #ffe1e1;border-radius:999px;padding:2px 8px}
    .muted{color:var(--muted);font-size:13px}
    .banner{margin:12px 0;padding:10px 12px;border-radius:10px;border:1px solid #fde68a;background:#fffbeb;color:#92400e}
    .row .chip{margin-left:8px;background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:11px;color:#374151}
    .btn{appearance:none;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:700}
    .btn-primary{background:#ffd6d6}
    .btn-primary:hover{background:#ffbfbf}
    .actions{display:flex;gap:10px;align-items:center;margin-top:20px}
    .left a{color:#374151;text-decoration:none}
  </style>
</head>
<body>
<header class="header">
  <div class="brand">BNK 퇴직연금</div>
  <nav class="muted">상품관리</nav>
</header>

<div class="container">
  <h1>Step 5. 비교·확인</h1>
  <div class="banner" id="infoBanner" style="display:none"></div>

  <!-- 세션 JSON (escape 금지) -->
  <script id="json-source" type="application/json"
          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].sourceProdIdList : '[]'}"></script>
  <script id="json-target" type="application/json"
          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].targetProdIdList : '[]'}"></script>
  <script id="json-files" type="application/json"
          th:utext="${session['ReserveValueDto'] != null ? session['ReserveValueDto'].fileUrlList : '[]'}"></script>

  <section class="grid">
    <div class="card">
      <h3>변경 전</h3>
      <div id="beforeList" class="list">
        <div class="muted">표시할 항목이 없습니다.</div>
      </div>
    </div>

    <div class="card">
      <h3>변경 후</h3>
      <div id="afterList" class="list">
        <div class="muted">표시할 항목이 없습니다.</div>
      </div>
    </div>
  </section>

  <div class="actions">
    <div class="left"><a th:href="@{/purchase/trade/step4}">이전</a></div>
    <form th:action="@{/purchase/trade/step5/next}" method="post">
      <button class="btn btn-primary" type="submit">확정하기</button>
    </form>
  </div>
</div>

<script>
(function(){
  const $ = (id)=>document.getElementById(id);
  const banner = $("infoBanner");
  const beforeList = $("beforeList");
  const afterList  = $("afterList");

  // JSON 안전 파서 (문자열 안의 JSON까지 2단계 시도)
  function safeParseDeep(text){
    try{
      if(!text) return [];
      let v = JSON.parse(text);
      if (typeof v === 'string') {
        try { v = JSON.parse(v); } catch {}
      }
      return v;
    }catch{return []}
  }

  // 세션 JSON 읽기
  const sourceArr = safeParseDeep($("json-source").textContent); // [{product:{productId,productName}, ratio}, ...]
  const targetIds = safeParseDeep($("json-target").textContent); // ["PG3","K55..."]
  const fileDocs  = safeParseDeep($("json-files").textContent);  // [{prodId, prodName, ...}, ...]

  // prodId → name 매핑(문서 + source 모두 반영)
  const nameById = {};
  (Array.isArray(fileDocs) ? fileDocs : []).forEach(d=>{
    if (d && d.prodId && d.prodName) nameById[d.prodId] = d.prodName;
  });
  (Array.isArray(sourceArr) ? sourceArr : []).forEach(p=>{
    const id = p?.product?.productId, nm = p?.product?.productName;
    if (id && nm) nameById[id] = nm;
  });

  // ---------------- 변경 후 렌더링 ----------------
  function renderAfter(){
    const items = [];
    let sum = 0;

    (sourceArr || []).forEach(p=>{
      const id = p?.product?.productId;
      const nm = p?.product?.productName || nameById[id] || id;
      const r  = Number(p?.ratio ?? 0);
      if (!id) return;
      sum += (isFinite(r) ? r : 0);
      items.push({id, name:nm, ratio:r, type: id.startsWith("PG") ? "원리금보장" : "펀드/ETF/TDF"});
    });

    // 현금성자산 보정(합계 < 100)
    const cash = Math.max(0, 100 - sum);
    if (cash > 0) items.push({id:"CASH", name:"현금성자산", ratio:cash, type:"현금"});

    if (items.length === 0){
      afterList.innerHTML = '<div class="muted">표시할 항목이 없습니다.</div>';
    } else {
      afterList.innerHTML = items.map(it => `
        <div class="row">
          <div class="name">${it.name}${it.id!=="CASH" ? `<span class="chip">${it.type}</span>` : ""}</div>
          <div class="ratio">${it.ratio}%</div>
        </div>
      `).join("");
    }

    // 배너 안내
    banner.style.display = 'block';
    banner.textContent = (sum > 100)
      ? `설정 비율 합계가 ${sum}% 입니다. 100%를 초과했습니다.`
      : `설정 비율 합계는 ${sum}% 입니다. ${cash>0 ? '현금성자산으로 ' + cash + '%가 자동 배정됩니다.' : '합계 100%로 설정되었습니다.'}`;
  }

  // ---------------- 변경 전 렌더링 ----------------
  function renderBefore(){
    if (!Array.isArray(targetIds) || targetIds.length === 0){
      beforeList.innerHTML = '<div class="muted">표시할 항목이 없습니다.</div>';
      return;
    }
    beforeList.innerHTML = targetIds.map(id=>{
      const nm = nameById[id] || id;
      const type = id && id.startsWith("PG") ? "원리금보장" : "펀드/ETF/TDF";
      return `
        <div class="row">
          <div class="name">${nm}<span class="chip">${type}</span></div>
          <div class="muted">-</div>
        </div>
      `;
    }).join("");
  }

  renderBefore();
  renderAfter();
})();
</script>
</body>
</html>
