<div class="w-full">
  <h2 class="text-xl font-semibold mb-3">거래내역 조회</h2>
  <table class="w-full text-sm">
    <thead>
      <tr class="text-left text-neutral-500 border-b">
        <th class="py-2">일시</th><th>유형</th><th>상품명</th>
        <th class="text-right">수량</th><th class="text-right">단가</th><th class="text-right">체결금액</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="t : ${txs}" class="border-b">
        <td class="py-2" th:text="${#temporals.format(t.at, 'yyyy-MM-dd HH:mm')}">일시</td>
        <td th:text="${t.type}">유형</td>
        <td th:text="${t.name}">상품명</td>
        <td class="text-right" th:text="${t.qty}">0</td>
        <td class="text-right" th:text="${#numbers.formatInteger(t.price, 3, 'COMMA')}">0</td>
        <td class="text-right" th:text="${#numbers.formatInteger(t.total, 3, 'COMMA')}">0</td>
      </tr>
    </tbody>
  </table>
</div>
