<div class="w-full">
  <h2 class="text-xl font-semibold mb-3">보유상품 변경</h2>
  <div class="grid gap-3">
    <div th:each="h : ${holdings}" class="border rounded-xl p-3 flex items-center justify-between">
      <div>
        <div class="text-sm text-neutral-500" th:text="${h.category}">카테고리</div>
        <div class="font-medium" th:text="${h.name}">상품명</div>
        <div class="text-sm">
          평가금액: <span th:text="${#numbers.formatInteger(h.amount, 3, 'COMMA')}">0</span>원
          · 수익률: <span th:text="${h.pnlRate}">0</span>%
        </div>
      </div>
      <div class="flex gap-2">
        <button class="px-3 py-1 border rounded-xl">교체</button>
        <button class="px-3 py-1 border rounded-xl">비중 조정</button>
      </div>
    </div>
  </div>
</div>
