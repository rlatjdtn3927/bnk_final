<!-- src/main/resources/templates/purchase/holdings.html -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>보유현황 / 입금</title>
  <link th:href="@{/css/purchase.css}" rel="stylesheet"/>
</head>
<body>
<header class="header">
  <div class="brand">BNK 퇴직연금</div>
  <nav class="tabs">
    <a th:href="@{/purchase/holdings}" class="tab active">보유현황</a>
    <a th:href="@{/purchase/products}" class="tab">상품관리</a>
    <!-- 기본 진입은 PENDING/step1 -->
    <a th:href="@{/purchase/trade/PENDING/step1}" class="tab">매수/변경</a>
  </nav>
</header>

<main class="container">
  <!-- (기존 내용 유지) 요약/입금/내역 -->
  <section class="card">
    <div class="grid grid-3">
      <div>
        <label>계좌유형</label>
        <select id="accountType" class="input">
          <option value="IRP">IRP</option>
          <option value="DC">DC</option>
        </select>
      </div>
      <div>
        <label>계좌 식별자(acountId)</label>
        <input id="acountId" class="input" placeholder="IRP: 계좌번호 / DC: dc_account.id"/>
      </div>
      <div class="row" style="margin-top:22px">
        <button class="btn" id="loadSummaryBtn">요약 조회</button>
        <span class="badge" id="sumStatus">대기</span>
      </div>
    </div>
    <pre id="summaryBox" class="mt-8" style="white-space:pre-wrap;">(요약 표시)</pre>
  </section>

  <section class="card mt-16">
    <div class="row">
      <input id="depositAmount" class="input" type="number" placeholder="입금 금액"/>
      <input id="depositDesc" class="input" placeholder="메모(선택)"/>
      <button id="depositBtn" class="btn primary">계좌 입금(즉시)</button>
    </div>
    <span class="badge mt-8" id="depositStatus">대기</span>
  </section>

  <section class="card mt-16">
    <div class="grid grid-2">
      <div>
        <div class="badge">거래내역</div>
        <table class="table mt-8">
          <thead><tr><th>일자</th><th>상품</th><th>유형</th><th class="num">금액</th></tr></thead>
          <tbody id="txnBody"><tr><td colspan="4">-</td></tr></tbody>
        </table>
      </div>
      <div>
        <div class="badge">입금내역</div>
        <table class="table mt-8">
          <thead><tr><th>일시</th><th>메모</th><th class="num">금액</th></tr></thead>
          <tbody id="depositBody"><tr><td colspan="3">-</td></tr></tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="mt-16">
    <!-- 명확히 step1로 이동 -->
    <a class="btn" th:href="@{/purchase/trade/PENDING/step1}">상품/매수 변경으로 이동</a>
    <a class="btn ghost" th:href="@{/purchase/trade/history}">매수예정 변경내역 보기</a>
  </section>
</main>

<script th:src="@{/js/purchase/holdings.js}"></script>
</body>
</html>
