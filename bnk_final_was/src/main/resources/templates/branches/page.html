<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>부산은행 인근 지점 찾기</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/branches.css" />
</head>
<body>
<header class="header">
  <h1>부산은행 인근 지점 찾기</h1>
  <p class="subtitle">내 주변에서 가장 가까운 BNK 부산은행 지점을 빠르게 찾아보세요.</p>
</header>

<main>
  <section class="card">
    <div class="row">
      <div>
        <div class="muted subtle">내 현재 위치</div>
        <div id="mypos" class="pill">위치를 불러오는 중…</div>
      </div>
      <div class="actions">
        <input id="radius" type="number" step="0.1" min="0.5" value="2.0" title="검색 반경(km)" />
        <span class="unit">km</span>
        <button id="btn" class="btn">
          <span id="btxt">5개 지점 조회</span>
          <span id="bsp" class="spinner" style="display:none"></span>
        </button>
      </div>
    </div>

    <div id="err" class="error" style="display:none"></div>
    <div id="empty" class="empty" style="display:none">
      근처에서 지점을 찾지 못했어요. 반경을 넓혀 다시 시도해보세요.
    </div>

    <div id="list" class="list"></div>
  </section>
</main>

<footer class="footer">
  © BNK 안내 데모 · 지도 링크는 외부 서비스로 이동합니다.
</footer>

<script src="/js/branches.js"></script>
</body>
</html>
