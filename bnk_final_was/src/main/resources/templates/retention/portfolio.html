<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>포트폴리오</title>
<link rel="stylesheet" href="/css/retention.css" />
</head>
<body>
<div class="mobile-container">
<header class="appbar">
<button class="icon-btn" aria-label="뒤로가기">←</button>
<h1 class="appbar__title">포트폴리오</h1>
<span class="appbar__spacer"></span>
</header>


<main class="container">
<!-- 계좌 요약 -->
<section class="summary">
<div class="summary__name sk sk-text" style="width:120px">&nbsp;</div>
<div class="summary__value sk sk-text" style="width:140px">&nbsp;</div>
<div class="summary__yield sk sk-text" style="width:50px">&nbsp;</div>
</section>


<!-- 탭 -->
<nav class="tabs">
<button class="tab is-active" disabled>전체</button>
<button class="tab" disabled>예적금</button>
<button class="tab" disabled>펀드</button>
<button class="tab" disabled>ETF</button>
</nav>


<!-- 리스트 (스켈레톤) -->
<section class="table table--stack">
<div class="table__row">
<div class="table__cell sk sk-text" style="width:45%">&nbsp;</div>
<div class="table__cell sk sk-text" style="width:20%">&nbsp;</div>
<div class="table__cell sk sk-text" style="width:25%">&nbsp;</div>
<div class="table__cell sk sk-text" style="width:10%">&nbsp;</div>
</div>
<div class="table__row">
<div class="table__cell sk sk-text" style="width:40%">&nbsp;</div>
<div class="table__cell sk sk-text" style="width:22%">&nbsp;</div>
<div class="table__cell sk sk-text" style="width:25%">&nbsp;</div>
<div class="table__cell sk sk-text" style="width:10%">&nbsp;</div>
</div>
</section>


<!-- 차트 자리 -->
<section class="chart-block">
<div class="sk sk-chart"></div>
</section>
</main>
</div>
</body>
</html>
