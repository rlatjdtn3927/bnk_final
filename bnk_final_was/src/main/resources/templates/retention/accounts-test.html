<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<div style="padding:12px;border:1px solid #e5e7eb;border-radius:8px;margin:12px 0">
  <strong>계좌 로드 결과</strong>
  <pre id="acctOut" style="white-space:pre-wrap;margin:8px 0 0"></pre>
</div>

<script>
async function fetchAccountMin(){
  const r = await fetch('/retain-api/account/list-min');
  if(!r.ok) throw new Error('계좌 목록 실패');
  return r.json(); // { ok, accounts:[{type,id}], default:{type,id} }
}

// 필요 시 상태에 보관해서 추후 보유현황 API에 넘길 값
const state = { ids:{IRP:null, DC:null}, type:null, id:null };

async function loadAccountsOnly(){
  try{
    const res = await fetchAccountMin();
    document.getElementById('acctOut').textContent = JSON.stringify(res, null, 2);

    if(!(res && res.ok)) return;

    // IRP/DC 계좌번호 저장
    state.ids = { IRP:null, DC:null };
    (res.accounts || []).forEach(a => state.ids[a.type] = a.id);

    // 기본 계좌 선택 (IRP 우선)
    const def = res.default || res.defaults || (res.accounts && res.accounts[0]);
    state.type = (def?.type || (state.ids.IRP?'IRP':(state.ids.DC?'DC':null)));
    state.id   = def?.id || (state.type ? state.ids[state.type] : null);

    // 이제 state.type / state.id 로 보유현황 호출하면 됨:
    // fetch(`/retain-api/change/retain?accountType=${state.type}&accountId=${state.id}`, { method: 'POST' })
  }catch(e){
    document.getElementById('acctOut').textContent = '오류: ' + (e.message || e);
  }
}

document.addEventListener('DOMContentLoaded', loadAccountsOnly);
</script>

</body>
</html>
