<!-- templates/retain/holdings.html (혹은 정적 경로) -->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>퇴직연금 · 보유현황</title>

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

<style>
:root{--ink:#111827;--muted:#6b7280;--border:#e5e7eb;--bg:#fafafc;--card:#fff;--accent:#ef4444;--chip:#f8f9fb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.header{display:flex;align-items:center;gap:8px}
.header h1{font-size:20px;margin:0}
.nav{display:flex;gap:16px;margin:8px 0 0;border-bottom:1px solid var(--border)}
.nav a{padding:10px 2px;color:#9ca3af;text-decoration:none}
.nav a.active{color:var(--ink);border-bottom:2px solid var(--ink);font-weight:600}

.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.key{font-size:12px;color:var(--muted)}
.big{font-size:28px;font-weight:800;letter-spacing:-.4px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:8px 12px;font-weight:700;cursor:pointer}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:12px}
.pill{display:inline-flex;gap:8px;background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:6px}
.pill button{border:0;background:transparent;padding:6px 10px;border-radius:999px;cursor:pointer;color:#6b7280;font-weight:700}
.pill button.active{background:#111827;color:#fff}
.pill button.disabled{opacity:.4;pointer-events:none}

.table{width:100%;border-collapse:collapse;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff}
.table th,.table td{padding:10px;border-bottom:1px solid var(--border);text-align:right}
.table th:first-child,.table td:first-child{text-align:left}
.table thead th{background:#f8fafc;color:#374151;font-size:13px}
.empty{padding:18px 10px;color:var(--muted);text-align:center}

.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.kpi{flex:1 1 180px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px}
.kpi .ttl{font-size:12px;color:var(--muted)}
.kpi .val{font-size:20px;margin-top:4px}

.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#374151;margin-top:8px}
.legend .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:4px;vertical-align:middle}

#status{display:none;border:1px solid var(--border)}
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <button onclick="history.back()" class="btn ghost sm" aria-label="뒤로가기">←</button>
    <h1>퇴직연금</h1>
  </div>

  <nav class="nav" aria-label="상단 탭">
    <a class="active" href="javascript:void(0)">보유현황</a>
    <a href="javascript:void(0)">상품관리</a>
    <a href="javascript:void(0)">연금받기</a>
    <a href="javascript:void(0)">교육받기</a>
  </nav>

  <!-- 계좌 선택 -->
  <section class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div>
        <div class="key">개인IRP / DC 선택</div>
        <div class="pill" role="tablist" aria-label="계좌유형 선택">
          <button id="tab-irp" class="active" role="tab" aria-selected="true">IRP</button>
          <button id="tab-dc" role="tab" aria-selected="false">DC</button>
        </div>
        <div class="key" style="margin-top:6px" id="accMeta">-</div>
      </div>
      <button id="btnViewHoldings" class="btn ghost sm">보유상품보기</button>
    </div>
  </section>

  <!-- 총 평가액 / 최근수익률 -->
  <section class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <div class="key">총 평가액 <span id="asOf" class="key"></span></div>
        <div class="big" id="totalVal">- 원</div>
      </div>
      <div style="text-align:right">
        <div class="key">최근 1년 수익률</div>
        <div class="big" id="yearReturn">0%</div>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="ttl">납입금액</div>     <div class="val" id="paidAmt">- 원</div></div>
      <div class="kpi"><div class="ttl">당일 납입금액</div> <div class="val" id="todayPaid">- 원</div></div>
      <div class="kpi"><div class="ttl">운용수익금액</div>  <div class="val" id="pnlAmt">- 원</div></div>
    </div>
  </section>

  <!-- 수익률 상세 -->
  <section class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="key">수익률 상세</div>
      <div class="pill">
        <button id="tab-cum" class="active">누적수익률</button>
        <button id="tab-alloc">자산비율</button>
      </div>
    </div>
    <div style="margin-top:10px">
      <canvas id="chartCum" height="220" role="img" aria-label="누적수익률 차트"></canvas>
      <canvas id="chartAlloc" height="220" style="display:none" role="img" aria-label="자산비율 차트"></canvas>
    </div>
    <div class="legend" id="allocLegend" style="display:none"></div>
  </section>

  <!-- 보유상품 -->
  <section class="card" style="margin-top:12px">
    <div class="row" style="justify-content:space-between;align-items:center">
      <div class="key" style="font-size:16px">보유상품보기</div>
      <div>
        <button class="btn ghost sm" id="btnExplain">상품설명</button>
        <button class="btn ghost sm" id="btnOps">운용현황</button>
      </div>
    </div>

    <h3 style="margin:18px 0 8px">원리금 보장</h3>
    <table class="table" id="tblPrincipal">
      <thead>
        <tr><th>상품ID</th><th>계약원금</th><th>금리(%)</th><th>만기</th><th>누적이자</th><th>상태</th></tr>
      </thead>
      <tbody><tr><td class="empty" colspan="6">데이터 없음</td></tr></tbody>
    </table>

    <h3 style="margin:18px 0 8px">펀드/ETF/TDF</h3>
    <table class="table" id="tblFund">
      <thead>
        <tr><th>상품명</th><th>보유좌수</th><th>평균단가</th><th>평가액</th><th>손익</th><th>수익률(%)</th></tr>
      </thead>
      <tbody><tr><td class="empty" colspan="6">데이터 없음</td></tr></tbody>
    </table>
  </section>

  <section id="status" class="card" style="margin-top:12px"></section>
</div>

<script>
const $ = s => document.querySelector(s);
const el = id => document.getElementById(id);
const n  = v => v==null ? 0 : (typeof v==='number'? v : Number(v)||0);
const money = v => (isFinite(v)? Number(v).toLocaleString('ko-KR'):'-')+' 원';
const pct = v => isFinite(v)? Number(v).toLocaleString('ko-KR',{maximumFractionDigits:2})+'%' : '-';

let state = { ids:{IRP:null,DC:null}, type:'IRP', id:null, principals:[], funds:[] };

function setStatus(msg, ok=true){
  const s = el('status'); s.style.display='block';
  s.style.borderColor = ok? '#10b981' : '#ef4444';
  s.textContent = msg;
}

async function fetchAccountMin(){
  const r = await fetch('/retain-api/account/list-min');
  if(!r.ok) throw new Error('계좌 목록 실패');
  return r.json(); // { ok, accounts, default }
}

// 컨트롤러가 @PostMapping("/retain") 이므로 POST로 호출
async function fetchHoldings(type,id){
  const url = `/retain-api/change/retain?accountType=${encodeURIComponent(type)}&accountId=${encodeURIComponent(id)}`;
  const r = await fetch(url, { method:'POST' });
  if(!r.ok) throw new Error('보유현황 실패');
  return r.json(); // { resultList:{ fundHoldings:[], principalLedgers:[] } } or { error:"..." }
}

function paintHeader(){
  el('accMeta').textContent = `${state.type==='IRP'?'개인IRP':'DC'} · ${state.id||'-'}`;
  $('#tab-irp').classList.toggle('active', state.type==='IRP');
  $('#tab-dc').classList.toggle('active', state.type==='DC');
  // 사용 가능 여부
  $('#tab-irp').classList.toggle('disabled', !state.ids.IRP);
  $('#tab-dc').classList.toggle('disabled', !state.ids.DC);
}

function renderTables(principals, funds){
  const p = $('#tblPrincipal tbody'); const f = $('#tblFund tbody');
  if(!principals?.length){
    p.innerHTML = `<tr><td class="empty" colspan="6">데이터 없음</td></tr>`;
  }else{
    p.innerHTML = principals.map(v=>`
      <tr>
        <td><span class="key">${v.principalId??'-'}</span></td>
        <td>${money(n(v.contractAmount))}</td>
        <td>${pct(n(v.interestRate))}</td>
        <td>${v.maturityDate??'-'}</td>
        <td>${money(n(v.interestAccrued))}</td>
        <td>${v.status??'-'}</td>
      </tr>`).join('');
  }
  if(!funds?.length){
    f.innerHTML = `<tr><td class="empty" colspan="6">데이터 없음</td></tr>`;
  }else{
    f.innerHTML = funds.map(v=>`
      <tr>
        <td>${v.productName??'-'}</td>
        <td>${n(v.units).toLocaleString('ko-KR')}</td>
        <td>${n(v.avgPrice).toLocaleString('ko-KR')}</td>
        <td>${money(n(v.valuationAmount))}</td>
        <td>${money(n(v.profitLoss))}</td>
        <td>${n(v.returnRate).toLocaleString('ko-KR',{maximumFractionDigits:2})}%</td>
      </tr>`).join('');
  }
}

function renderKpis(principals, funds){
  const principalSum = principals.reduce((s,x)=> s+n(x.contractAmount),0);
  const interestSum  = principals.reduce((s,x)=> s+n(x.interestAccrued),0);
  const pVal = principalSum + interestSum;

  const fVal = funds.reduce((s,x)=> s+n(x.valuationAmount),0);
  const fAcq = funds.reduce((s,x)=> s+n(x.acquisitionAmount),0);

  const totalVal = pVal + fVal;
  const paid     = principalSum + fAcq;
  const pnl      = totalVal - paid;
  const rr       = paid>0 ? (pnl/paid*100) : 0;

  el('totalVal').textContent = money(totalVal);
  el('paidAmt').textContent  = money(paid);
  el('pnlAmt').textContent   = money(pnl);
  el('todayPaid').textContent= money(0);
  el('yearReturn').textContent = rr.toFixed(2)+'%';
  el('yearReturn').style.color = rr >= 0 ? '#0f766e' : '#b91c1c';
  el('asOf').textContent = '· 오늘 기준';
}

// 차트
let chartCum, chartAlloc;
function renderCumChart(series){
  const ctx = el('chartCum').getContext('2d'); chartCum && chartCum.destroy();
  const labels = series?.labels ?? ['-6M','-5M','-4M','-3M','-2M','-1M','오늘'];
  const data   = series?.values ?? [0,0,0,0,0,0,0];
  chartCum = new Chart(ctx,{ type:'line',
    data:{ labels, datasets:[{ label:'나', data, tension:.3, fill:false }] },
    options:{ plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ callback:v=>v+'%'}}}}
  });
}
function renderAllocChart(principals, funds){
  const alloc = new Map();
  const add = (k,v)=> alloc.set(k,(alloc.get(k)||0)+v);
  const pAmt = principals.reduce((s,x)=> s+n(x.contractAmount)+n(x.interestAccrued),0);
  if(pAmt>0) add('원리금보장', pAmt);
  funds.forEach(f=> add(f.category || f.fundType || '기타', n(f.valuationAmount)));

  const labels=[...alloc.keys()], values=[...alloc.values()];
  const ctx = el('chartAlloc').getContext('2d'); chartAlloc && chartAlloc.destroy();
  chartAlloc = new Chart(ctx,{ type:'doughnut', data:{ labels, datasets:[{ data: values }]}, options:{plugins:{legend:{display:false}}}});
  const legend = el('allocLegend'); legend.style.display='flex';
  legend.innerHTML = labels.map((lab,i)=>`<span><span class="dot" style="background:${chartAlloc.data.datasets[0].backgroundColor?.[i]||'#999'}"></span>${lab}</span>`).join('');
}

// 탭들
function wireTabs(){
  el('tab-cum').addEventListener('click',()=>{
    el('tab-cum').classList.add('active'); el('tab-alloc').classList.remove('active');
    el('chartCum').style.display=''; el('chartAlloc').style.display='none'; el('allocLegend').style.display='none';
  });
  el('tab-alloc').addEventListener('click',()=>{
    el('tab-alloc').classList.add('active'); el('tab-cum').classList.remove('active');
    el('chartCum').style.display='none'; el('chartAlloc').style.display=''; el('allocLegend').style.display='';
  });
  $('#tab-irp').addEventListener('click',()=>switchAccount('IRP'));
  $('#tab-dc').addEventListener('click',()=>switchAccount('DC'));
}

async function switchAccount(type){
  const id = state.ids[type];
  if(!id){ setStatus(`${type} 계좌가 없습니다.`, false); return; }
  state.type=type; state.id=id; paintHeader(); await loadHoldings();
}

async function loadHoldings(){
  try{
    setStatus('조회 중...', true);
    const res = await fetchHoldings(state.type, state.id);
    if(res?.error) throw new Error(res.error);
    const list = res?.resultList || {};
    state.principals = list.principalLedgers || [];
    state.funds      = list.fundHoldings || [];

    renderTables(state.principals, state.funds);
    renderKpis(state.principals, state.funds);
    renderCumChart(null);
    renderAllocChart(state.principals, state.funds);
    setStatus('조회 완료', true);
  }catch(e){
    renderTables([],[]); renderKpis([],[]); renderCumChart(null);
    setStatus(e.message || '보유현황 오류', false);
  }
}

async function bootstrap(){
  wireTabs();
  try{
    // 1) 계좌 먼저
    const a = await fetchAccountMin();
    if(!(a && a.ok)) throw new Error(a?.error || '계좌 목록 응답 오류');

    state.ids = { IRP:null, DC:null };
    (a.accounts||[]).forEach(v=> state.ids[v.type]=v.id);

    const def = a.default || a.defaults || (a.accounts && a.accounts[0]);
    state.type = (def?.type || (state.ids.IRP?'IRP':(state.ids.DC?'DC':'IRP'))).toUpperCase();
    state.id   = def?.id || state.ids[state.type] || null;

    paintHeader();
    if(!state.id){ setStatus('등록된 계좌가 없습니다.', false); renderCumChart(null); return; }

    // 2) 보유현황
    await loadHoldings();

  }catch(e){
    setStatus(e.message || '초기화 실패', false);
    renderCumChart(null);
  }

  // 보유상품보기 버튼: 하단 이동
  el('btnViewHoldings').addEventListener('click', ()=>{
    const y = document.getElementById('tblPrincipal').getBoundingClientRect().top + window.scrollY - 12;
    window.scrollTo({ top: y, behavior:'smooth' });
  });
}

document.addEventListener('DOMContentLoaded', bootstrap);
</script>
</body>
</html>
