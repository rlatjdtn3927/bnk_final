<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>문서-임베딩 & GPT 챗봇</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- 정적 리소스 -->
  <link rel="stylesheet" th:href="@{/css/chatbot.css}" href="/css/chatbot.css" />
</head>
<body>
<header>
  <h2>퇴직연금 판매 챗봇</h2>
</header>

<main>
  <!-- 2. 채팅 UI -->
  <section style="margin-top:32px;">
    <h3>챗봇 대화</h3>
    <div id="chatBox"></div>

    <form id="chatForm">
      <input id="question" type="text" placeholder="질문을 입력하세요…" autocomplete="off" required />
      <button class="btn btn-primary">전송</button>
    </form>
  </section>
</main>

<!-- 정적 리소스 -->
<script th:src="@{/js/chatbot.js}" src="/js/chatbot.js" defer></script>
</body>
</html>
