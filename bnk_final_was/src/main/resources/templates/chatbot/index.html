<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>문서-임베딩 & GPT 챗봇</title>
    <style>
        body            { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header          { background:#2b4fff; color:#fff; padding:12px 24px; }
        main            { max-width:700px; margin:40px auto; }
        .btn            { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; }
        .btn-primary    { background:#2b4fff; color:#fff; }
        .btn-secondary  { background:#666;    color:#fff; }
        #chatBox        { border:1px solid #ccc; border-radius:8px; height:400px;
                          padding:12px; overflow-y:auto; margin-top:12px; }
        .bubble.user    { text-align:right; }
        .bubble.assist  { text-align:left;  color:#333; }
        .bubble span    { display:inline-block; padding:8px 12px;
                          border-radius:18px; margin:4px 0; max-width:80%; }
        .user   span    { background:#2b4fff; color:#fff; }
        .assist span    { background:#e5e5e5; }
        #chatForm       { display:flex; gap:8px; margin-top:12px; }
        #question       { flex:1; padding:8px; border:1px solid #bbb; border-radius:6px; }
    </style>
</head>
<body>
<header>
    <h2>PDF 임베딩 & GPT 챗봇 데모</h2>
</header>

<main>
    <!-- 1. 임베딩 트리거 (결과는 STS 콘솔에서 확인) -->
    <button id="embedBtn" class="btn btn-secondary">
        📄 static 폴더 전체 PDF 임베딩
    </button>

    <!-- 2. 채팅 UI -->
    <section style="margin-top:32px;">
        <h3>챗봇 대화</h3>
        <div id="chatBox"></div>

        <form id="chatForm">
            <input id="question" type="text" placeholder="질문을 입력하세요…" autocomplete="off" required />
            <button class="btn btn-primary">전송</button>
        </form>
    </section>
</main>


<script>
/* ------------ 1) 임베딩 버튼 ------------ */
document.getElementById('embedBtn').addEventListener('click', () => {
    if (!confirm('static 폴더의 모든 PDF를 임베딩합니다.\n(진행 상황은 STS 콘솔에서 확인)')) return;

    fetch('/api/embeddings', {          // WAS → AP: EMBEDDING_CREATE
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : '{}'                   // 빈 JSON
    })
    .then(r => r.text())
    .then(msg => alert('임베딩 완료: ' + msg))
    .catch(e => alert('임베딩 오류: ' + e));
});

/* ------------ 2) 채팅 UI ------------ */
const chatBox = document.getElementById('chatBox');

function appendBubble(role, text) {
    const div  = document.createElement('div');
    div.className = 'bubble ' + role;
    const span = document.createElement('span');
    span.textContent = text;
    div.appendChild(span);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

document.getElementById('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    const input   = document.getElementById('question');
    const message = input.value.trim();
    if (!message) return;

    appendBubble('user', message);
    input.value = '';
    appendBubble('assist', '...thinking');

    fetch('/api/chat', {                // WAS → AP: CHAT_ASK_QUESTION
        method : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body   : JSON.stringify({ question: message })
    })
    .then(r => r.text())
    .then(answer => {
        // 마지막 placeholder '...thinking' 교체
        chatBox.lastChild.remove();
        appendBubble('assist', answer);
    })
    .catch(e => {
        chatBox.lastChild.remove();
        appendBubble('assist', '❌ 오류: ' + e);
    });
});
</script>
</body>
</html>
